name: RIOSYSTEMS Operator Access Preflight Once

on:
  push:
    branches: [factory-control]
    paths:
      - '.github/workflows/riosystems-operator-access-preflight-once.yml'

permissions:
  contents: read

jobs:
  access-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_OPERATOR_EMAIL: ${{ secrets.RIOSYSTEMS_OPERATOR_EMAIL }}
      TARGET_ACCESS_DOMAIN: riosystems-staging.gelato-donatello-dario-a5a5376c.workers.dev/operator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preflight baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "factory-control"
          test "$(git rev-parse HEAD^1)" = "24e3f6d024197c8aff152dda25408c186892a982"
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          test "$CHANGED" = ".github/workflows/riosystems-operator-access-preflight-once.yml"
      - name: Read-only Cloudflare Access preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          if [ -z "${RIOSYSTEMS_OPERATOR_EMAIL:-}" ]; then
            echo "operator_email_secret_present=false" >> "$GITHUB_STEP_SUMMARY"
            echo "RIOSYSTEMS_OPERATOR_EMAIL secret is missing" >&2
            exit 42
          fi
          echo "operator_email_secret_present=true" >> "$GITHUB_STEP_SUMMARY"

          STATUS="$(curl -sS -o /tmp/access-apps.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100")"

          echo "access_apps_http_status=$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "200" ]; then
            jq -r '.errors[]? | "cloudflare_error=\(.code):\(.message)"' /tmp/access-apps.json >> "$GITHUB_STEP_SUMMARY" || true
            exit 43
          fi

          MATCHES="$(jq --arg d "$TARGET_ACCESS_DOMAIN" '[.result[]? | select(.domain == $d)] | length' /tmp/access-apps.json)"
          echo "matching_access_app_count=$MATCHES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MATCHES" -gt 0 ]; then
            jq -r --arg d "$TARGET_ACCESS_DOMAIN" '.result[]? | select(.domain == $d) | "existing_access_app_id=" + .id + "\nexisting_access_app_aud=" + (.aud // "")' /tmp/access-apps.json >> "$GITHUB_STEP_SUMMARY"
          fi
