name: JARVIS Personal AI OS V1

on:
  push:
    branches:
      - 'factory/jarvis-personal-assistant-v1'
    paths:
      - 'src/jarvis/**'
      - 'scripts/jarvis-personal-assistant-v1-smoke.mjs'
      - 'scripts/jarvis-connector-runtime-v1-smoke.mjs'
      - 'scripts/jarvis-personal-memory-persistence-v1-smoke.mjs'
      - 'scripts/jarvis-supabase-memory-store-v1-smoke.mjs'
      - 'scripts/jarvis-runtime-v1-smoke.mjs'
      - 'scripts/jarvis-private-chat-v1-smoke.mjs'
      - 'scripts/jarvis-supabase-private-rpc-v1-smoke.mjs'
      - 'scripts/jarvis-google-oauth-v1-smoke.mjs'
      - 'scripts/jarvis-private-worker-v1-smoke.mjs'
      - 'scripts/jarvis-neutral-host-v1-smoke.mjs'
      - 'scripts/jarvis-cloudflare-account-isolation-v1-smoke.mjs'
      - 'scripts/jarvis-cloudflare-access-jwt-v1-smoke.mjs'
      - 'scripts/jarvis-pages-private-v1-smoke.mjs'
      - 'scripts/jarvis-pages-build-v1.mjs'
      - 'scripts/jarvis-pages-cloudflare-preflight-v1.mjs'
      - 'scripts/jarvis-pages-private-deploy-v1-smoke.mjs'
      - '.github/workflows/jarvis-pages-private-deploy-v1.yml'
      - 'wrangler.jarvis-pages.jsonc'
      - '.github/workflows/jarvis-pages-private-staging.yml'
      - 'wrangler.jarvis-private.jsonc'
      - '.github/workflows/jarvis-private-worker-staging.yml'
      - '.github/workflows/jarvis-private-access-bootstrap.yml'
      - 'supabase/migrations/*jarvis*'
      - 'docs/JARVIS_PERSONAL_ASSISTANT_V1.md'
      - '.github/workflows/jarvis-personal-assistant-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jarvis-v1-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JARVIS build dependencies
        run: npm install

      - name: Syntax check JARVIS V1
        run: |
          node --check src/jarvis/contracts-v1.js
          node --check src/jarvis/intent-v1.js
          node --check src/jarvis/context-v1.js
          node --check src/jarvis/action-gate-v1.js
          node --check src/jarvis/memory-v1.js
          node --check src/jarvis/tools-v1.js
          node --check src/jarvis/planner-v1.js
          node --check src/jarvis/result-v1.js
          node --check src/jarvis/audit-v1.js
          node --check src/jarvis/service-v1.js
          node --check src/jarvis/connectors-v1.js
          node --check src/jarvis/connector-runtime-v1.js
          node --check src/jarvis/memory-store-supabase-v1.js
          node --check src/jarvis/memory-store-supabase-user-v1.js
          node --check src/jarvis/memory-store-supabase-rpc-v1.js
          node --check src/jarvis/oauth-store-supabase-rpc-v1.js
          node --check src/jarvis/google-calendar-read-v1.js
          node --check src/jarvis/oauth-crypto-v1.js
          node --check src/jarvis/google-oauth-v1.js
          node --check src/jarvis/access-v1.js
          node --check src/jarvis/runtime-v1.js
          node --check src/jarvis/session-v1.js
          node --check src/jarvis/memory-store-memory-v1.js
          node --check src/jarvis/calendar-window-v1.js
          node --check src/jarvis/presenter-v1.js
          node --check src/jarvis/ui-v1.js
          node --check src/jarvis/http-v1.js
          node --check src/jarvis/standalone-worker-v1.js
          node --check src/jarvis/host-policy-v1.js
          node --check src/jarvis/cloudflare-account-isolation-v1.js
          node --check src/jarvis/access-jwt-v1.js
          node --check src/jarvis/pages-worker-v1.js
          node --check scripts/jarvis-pages-cloudflare-preflight-v1.mjs

      - name: JARVIS V1 architecture smoke
        run: node scripts/jarvis-personal-assistant-v1-smoke.mjs

      - name: JARVIS V1 connector runtime smoke
        run: node scripts/jarvis-connector-runtime-v1-smoke.mjs

      - name: JARVIS V1 personal memory persistence smoke
        run: node scripts/jarvis-personal-memory-persistence-v1-smoke.mjs

      - name: JARVIS V1 Supabase memory store smoke
        run: node scripts/jarvis-supabase-memory-store-v1-smoke.mjs

      - name: JARVIS V1 durable runtime smoke
        run: node scripts/jarvis-runtime-v1-smoke.mjs

      - name: JARVIS V1 private chat and session smoke
        run: node scripts/jarvis-private-chat-v1-smoke.mjs

      - name: JARVIS V1 private Supabase RPC gateway smoke
        run: node scripts/jarvis-supabase-private-rpc-v1-smoke.mjs

      - name: JARVIS V1 Google OAuth read-only smoke
        run: node scripts/jarvis-google-oauth-v1-smoke.mjs

      - name: JARVIS V1 standalone private worker smoke
        run: node scripts/jarvis-private-worker-v1-smoke.mjs

      - name: JARVIS V1 neutral host policy smoke
        run: node scripts/jarvis-neutral-host-v1-smoke.mjs

      - name: JARVIS V1 Cloudflare account isolation smoke
        run: node scripts/jarvis-cloudflare-account-isolation-v1-smoke.mjs

      - name: JARVIS V1 Cloudflare Access JWT smoke
        run: node scripts/jarvis-cloudflare-access-jwt-v1-smoke.mjs

      - name: JARVIS V1 private Pages runtime smoke
        run: node scripts/jarvis-pages-private-v1-smoke.mjs

      - name: JARVIS V1 Pages advanced-mode bundle
        run: node scripts/jarvis-pages-build-v1.mjs

      - name: JARVIS V1 Pages exact-head deploy gate smoke
        run: node scripts/jarvis-pages-private-deploy-v1-smoke.mjs
