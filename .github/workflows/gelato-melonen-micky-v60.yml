name: Gelato V60 Melonen Micky private preview
on:
  push:
    branches: [aurentara/gelato-melonen-micky-v60]
    paths: [.github/workflows/gelato-melonen-micky-v60.yml]
permissions:
  contents: read
concurrency:
  group: gelato-melonen-micky-private-v60
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify scope, image bytes and page content
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aurentara/gelato-melonen-micky-v60'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('projects/gelato-donatello-premium-v6')
          images={
            'melonen-becher.webp':'e7d4af7e1a2cff02',
            'micky-mouse.webp':'7423ad5475921d0a',
          }
          for name,prefix in images.items():
            p=root/'assets/images/cups'/name
            assert p.is_file(), name
            raw=p.read_bytes()
            assert hashlib.sha256(raw).hexdigest().startswith(prefix),name
            assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',name
            print('Verified original image:',name,len(raw))
          js=(root/'assets/js/components/discovery-cups.js').read_text()
          html=(root/'eisbecher/index.html').read_text()
          files=re.findall(r'src: "(/assets/images/cups/[^"]+)"',js)
          assert len(files)==29, len(files)
          assert len(set(files))==len(files)
          assert 'const TICK_MS = 2000' in js
          for name in images:
            assert js.count('/assets/images/cups/'+name)==1
            assert html.count('/assets/images/cups/'+name)==1
          assert 'id="joghurt-eisbecher"' in html
          for p in files:
            assert (root/p.lstrip('/')).is_file(),p
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['run_worker_first'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          print('PASS 29 unique Eisbecher, slideshow unchanged, only private preview in scope')
          PY
      - name: Smoke test mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v60-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gd-v60 --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gd-v60/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [name,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const page=await browser.newPage({viewport:{width,height}});
              const errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:43119/eisbecher/',{waitUntil:'domcontentloaded'});
              const images=page.locator('img[src*="melonen-becher.webp"],img[src*="micky-mouse.webp"]');
              assert.strictEqual(await images.count(),2);
              await images.first().scrollIntoViewIfNeeded();
              const loaded=await images.evaluateAll(async xs=>{await Promise.all(xs.map(x=>x.decode()));return xs.map(x=>({src:x.getAttribute('src'),width:x.naturalWidth,height:x.naturalHeight}))});
              assert(loaded.every(x=>x.width===1254&&x.height===1254),JSON.stringify(loaded));
              const sizes=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert(sizes.scroll<=sizes.viewport+2,'Horizontal overflow '+JSON.stringify(sizes));
              await images.first().screenshot({path:'visual-evidence/melonen-'+name+'.png',animations:'disabled'});
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
              const card=page.locator('[data-discovery-cups]');
              assert(await card.count()===1);
              await card.scrollIntoViewIfNeeded();
              await page.waitForTimeout(2500);
              assert((await card.locator('img.is-active').getAttribute('src'))!=='/assets/images/cups/fruechte-becher.webp','2-second slideshow did not advance');
              assert.deepStrictEqual(errs,[]);
              console.log('PASS '+name+': 2 original images decode, no overflow, slideshow advances');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('V60 QA FAIL',e);process.exit(1)});
          JS
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v60-image-qa
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify private worker availability
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
      - name: Deploy only private Gelato preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v60-deploy.json
          node -e "const d=require('/tmp/gelato-v60-deploy.json');const x=d.result?.deployments?.[0];if(!d.success||!x?.versions?.some(v=>v.percentage===100))process.exit(3);console.log('DEPLOYED PRIVATE PREVIEW',x.id)"
