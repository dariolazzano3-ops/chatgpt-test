name: Gelato V70 Clean Hero Premium Reveal Private Preview
on:
  push:
    branches: [aurentara/gelato-cinematic-first-impression-v70]
    paths: ['.github/workflows/gelato-premium-reveal-v70.yml']
permissions:
  contents: read
concurrency:
  group: gelato-v70-private-only
  cancel-in-progress: false
jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm clean hero source, original assets and private-only deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-cinematic-first-impression-v70"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('projects/gelato-donatello-premium-v6')
          home=(root/'index.html').read_text()
          css=(root/'assets/css/style.css').read_text()
          js=(root/'assets/js/components/hero-flavors.js').read_text()
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          policy=json.loads((root/'project.json').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['directory']=='./projects/gelato-donatello-premium-v6'
          assert config['assets']['run_worker_first'] is False
          assert policy['preview_policy']['external_publish'] is False
          assert policy['safety']['production_deploy'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          assert 'class="v6-hero v70-first-impression"' in home
          assert not re.search(r'class="v68-hero-melt"',home)
          assert 'v68-hero-melt' not in css
          assert 'v70-first-copy' in css and 'v70-first-visual' in css
          assert 'prefers-reduced-motion:reduce' in css
          assert 'width:auto' in css
          assert 'href="/eisbecher/"' in home and 'Unsere Eisbecher entdecken' in home
          assert 'data-hero-flavors' in home and home.count('data-flavor-photo')==2
          assert 'class="v6-hero__badge"' in home and 'data-flavor-name' in home
          assert 'const INTERVAL = 3500' in js
          assert 'prefers-reduced-motion: reduce' in js
          assert (root/'assets/images/flavors/pistazie.webp').is_file()
          assert (root/'assets/images/flavors/erdbeere.webp').is_file()
          print('PASS V70 clean straight image seam; accessible one-shot copy/photo reveal; real gelato photography; safe private preview')
          PY
          node --check projects/gelato-donatello-premium-v6/assets/js/components/hero-flavors.js
          node --check projects/gelato-donatello-premium-v6/assets/js/app.js
      - name: Mobile, desktop and reduced motion browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v70-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gelato-v70-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gelato-v70-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height,reducedMotion] of [
              ['iphone',390,844,'no-preference'],['small-iphone',360,780,'no-preference'],
              ['tablet',768,1024,'no-preference'],['desktop',1440,900,'no-preference'],
              ['reduced-motion',390,844,'reduce']
            ]){
              const page=await browser.newPage({viewport:{width,height},reducedMotion});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              const hero=page.locator('.v70-first-impression');
              assert.strictEqual(await hero.count(),1);
              assert.strictEqual(await hero.locator('.v68-hero-melt').count(),0,'Old drip still present');
              const button=hero.locator('a.button--light');
              assert.strictEqual(await button.getAttribute('href'),'/eisbecher/');
              assert((await button.innerText()).toLocaleLowerCase('de').includes('unsere eisbecher entdecken'));
              const lead=hero.locator('.v6-hero__lead');
              assert((await lead.innerText()).includes('Eislabor'));
              const badge=hero.locator('.v6-hero__badge');
              assert((await badge.innerText()).includes('1965'));
              const active=hero.locator('.v8-flavor-photo.is-active');
              await page.waitForFunction(()=>{
                const img=document.querySelector('.v6-hero .v8-flavor-photo.is-active');
                return img?.complete && img.naturalWidth>=800;
              },null,{timeout:15000});
              // Let the one-shot entrance settle before measuring pixel-perfect final seams.
              await page.waitForTimeout(1120);
              const initial=await hero.evaluate(h=>{
                const c=h.querySelector('.v6-hero__copy').getBoundingClientRect();
                const v=h.querySelector('.v6-hero__visual').getBoundingClientRect();
                return {copyRight:c.right,copyBottom:c.bottom,photoTop:v.top,photoLeft:v.left,photoWidth:v.width};
              });
              if(width<=820){
                assert(Math.abs(initial.copyBottom-initial.photoTop)<3,'Mobile photo seam not flush '+JSON.stringify(initial));
              }else{
                assert(initial.photoLeft>initial.copyRight-3,'Desktop side-by-side layout broken '+JSON.stringify(initial));
              }
              const anim=await hero.evaluate(h=>({
                heading:getComputedStyle(h.querySelector('h1')).animationName,
                opacity:getComputedStyle(h.querySelector('h1')).opacity,
                photo:getComputedStyle(h.querySelector('.v6-hero__visual')).animationName,
                photoOpacity:getComputedStyle(h.querySelector('.v6-hero__visual')).opacity
              }));
              assert.strictEqual(anim.opacity,'1');
              assert.strictEqual(anim.photoOpacity,'1');
              if(reducedMotion==='reduce'){
                assert.strictEqual(anim.heading,'none');
                assert.strictEqual(anim.photo,'none');
              }else{
                assert(anim.heading.includes('v70-first-copy'));
                assert(anim.photo.includes('v70-first-visual'));
              }
              const coords=await page.evaluate(()=>({width:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert(coords.width<=coords.viewport+3,'Horizontal overflow '+JSON.stringify(coords));
              assert.deepStrictEqual(errors,[],'Javascript errors');
              await hero.screenshot({path:'visual-evidence/hero-'+label+'.png',animations:'disabled'});
              if(label==='iphone'){
                await page.waitForFunction(()=>{
                  const img=document.querySelector('.v6-hero .v8-flavor-photo.is-active');
                  return img?.getAttribute('src')?.includes('erdbeere.webp') && img?.naturalWidth>0;
                },null,{timeout:10500});
                const tone=await hero.evaluate(h=>h.style.getPropertyValue('--hero-tone'));
                assert.strictEqual(tone,'#dfbbb4');
              }
              assert.strictEqual((await page.request.get('http://127.0.0.1:43119/eisbecher/')).status(),200);
              console.log('PASS V70',label,'no drip, clean seam, intact links/badge, real photo, tasteful reveal and reduced-motion compliance');
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error('BROWSER QA FAILURE',err);process.exit(1)});
          JS
      - name: Preserve browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v70-premium-reveal-mobile-desktop
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm dedicated private Worker target
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$status" = "200"
      - name: Deploy to private Gelato Worker ONLY
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm Cloudflare active private deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v70-deploy.json
          node -e "const r=require('/tmp/gelato-v70-deploy.json');const d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('GELATO V70 PRIVATE DEPLOY PASS',d.id)"
