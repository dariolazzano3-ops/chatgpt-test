name: RIOSYSTEMS Make Staging Bridge

on:
  pull_request:
    paths:
      - 'src/make-staging-bridge.js'
      - 'src/make-real-provider-adapter.js'
      - 'src/make-readonly-runner.js'
      - 'src/make-staging-write-runner.js'
      - 'src/make-staging-execution-runner.js'
      - 'src/make-live-staging-evidence.js'
      - 'src/make-supabase-lead-bridge.js'
      - 'src/make-supabase-lead-bridge-evidence.js'
      - 'src/business-staging-write-plan.js'
      - 'src/business-staging-write-evidence.js'
      - 'src/automation-provider-strategy.js'
      - 'src/provider-stack-v1.js'
      - 'scripts/make-staging-bridge-smoke.mjs'
      - 'scripts/make-real-provider-adapter-smoke.mjs'
      - 'scripts/make-readonly-runner-smoke.mjs'
      - 'scripts/make-staging-write-runner-smoke.mjs'
      - 'scripts/make-staging-execution-runner-smoke.mjs'
      - 'scripts/make-supabase-lead-bridge-smoke.mjs'
      - 'scripts/make-supabase-lead-bridge-evidence-smoke.mjs'
      - 'scripts/make-live-readonly-preflight.mjs'
      - 'scripts/make-live-staging-scenario-create.mjs'
      - 'scripts/make-live-staging-execution-once.mjs'
      - 'scripts/automation-provider-selection-smoke.mjs'
      - 'scripts/provider-stack-v1-smoke.mjs'
      - 'docs/RIOSYSTEMS-MAKE-STAGING-ACTIVATION.md'
      - 'docs/RIOSYSTEMS-BUSINESS-STAGING-ACTIVATION.md'
      - '.github/workflows/riosystems-make-staging-bridge.yml'
      - '.github/workflows/riosystems-make-live-readonly-preflight.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/make-staging-bridge.js
          node --check src/make-real-provider-adapter.js
          node --check src/make-readonly-runner.js
          node --check src/make-staging-write-runner.js
          node --check src/make-staging-execution-runner.js
          node --check src/make-live-staging-evidence.js
          node --check src/make-supabase-lead-bridge.js
          node --check src/make-supabase-lead-bridge-evidence.js
          node --check src/business-staging-write-plan.js
          node --check src/business-staging-write-evidence.js
          node --check src/automation-provider-strategy.js
          node --check scripts/make-staging-bridge-smoke.mjs
          node --check scripts/make-real-provider-adapter-smoke.mjs
          node --check scripts/make-readonly-runner-smoke.mjs
          node --check scripts/make-staging-write-runner-smoke.mjs
          node --check scripts/make-staging-execution-runner-smoke.mjs
          node --check scripts/make-supabase-lead-bridge-smoke.mjs
          node --check scripts/make-supabase-lead-bridge-evidence-smoke.mjs
          node --check scripts/make-live-readonly-preflight.mjs
          node --check scripts/make-live-staging-scenario-create.mjs
          node --check scripts/make-live-staging-execution-once.mjs
          node --check scripts/automation-provider-selection-smoke.mjs
          node --check scripts/provider-stack-v1-smoke.mjs
          node --check src/provider-stack-v1.js
      - name: Make staging bridge smoke
        run: node scripts/make-staging-bridge-smoke.mjs
      - name: Make to Supabase lead bridge smoke
        run: node scripts/make-supabase-lead-bridge-smoke.mjs
      - name: Make to Supabase live bridge evidence smoke
        run: node scripts/make-supabase-lead-bridge-evidence-smoke.mjs
      - name: Make real provider adapter smoke
        run: node scripts/make-real-provider-adapter-smoke.mjs
      - name: Make read-only runner smoke
        run: node scripts/make-readonly-runner-smoke.mjs
      - name: Make staging write runner smoke
        run: node scripts/make-staging-write-runner-smoke.mjs
      - name: Make staging execution runner smoke
        run: node scripts/make-staging-execution-runner-smoke.mjs
      - name: Provider stack regression
        run: node scripts/provider-stack-v1-smoke.mjs
      - name: Automation provider regression
        run: node scripts/automation-provider-selection-smoke.mjs
      - name: Existing Automation Factory regression
        run: node scripts/automation-factory-smoke.mjs
      - name: Real provider bridge regression
        run: node scripts/real-provider-bridge-smoke.mjs
      - name: Phase 6 regression
        run: node scripts/riosystems-phase6-smoke.mjs
