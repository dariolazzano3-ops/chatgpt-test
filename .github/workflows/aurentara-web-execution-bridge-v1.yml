name: AURENTARA Web Execution Bridge V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/operator-finalization-runtime-v1.js'
      - 'src/operator-runtime-api-v1.js'
      - 'src/operator-dashboard-completeness-v1.js'
      - 'src/operator-controlled-paid-staging-dashboard-v1.js'
      - 'src/operator-web-execution-bridge-v1.js'
      - 'src/project-preview-access-v1.js'
      - 'src/entry.js'
      - 'scripts/aurentara-web-execution-bridge-v1-smoke.mjs'
      - 'scripts/aurentara-controlled-async-execution-bridge-v1-smoke.mjs'
      - 'scripts/aurentara-web-task-executor-v1.mjs'
      - 'scripts/aurentara-web-task-executor-v1-smoke.mjs'
      - 'scripts/aurentara-web-execution-poller-v1.mjs'
      - 'config/aurentara-web-project-bindings-v1.json'
      - '.github/workflows/aurentara-private-website-preview-v1.yml'
      - '.github/workflows/aurentara-web-execution-bridge-v1.yml'
      - 'docs/AURENTARA-WEB-EXECUTION-BRIDGE-V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/operator-finalization-runtime-v1.js
          node --check src/operator-runtime-api-v1.js
          node --check src/operator-web-execution-bridge-v1.js
          node --check src/project-preview-access-v1.js
          node --check src/entry.js
          node --check scripts/aurentara-web-task-executor-v1.mjs
          node --check scripts/aurentara-web-execution-poller-v1.mjs
      - name: Durable async bridge
        run: node scripts/aurentara-web-execution-bridge-v1-smoke.mjs
      - name: Controlled paid path stays governed
        run: node scripts/aurentara-controlled-async-execution-bridge-v1-smoke.mjs
      - name: Bounded website executor
        run: node scripts/aurentara-web-task-executor-v1-smoke.mjs
      - name: Existing live staging regression
        run: node scripts/operator-live-staging-bridge-v1-smoke.mjs
      - name: Existing controlled paid regression
        run: node scripts/controlled-paid-staging-execution-path-smoke.mjs
      - name: AURENTARA Web Project Control regression
        run: node scripts/aurentara-web-project-control-v2-smoke.mjs
      - name: Staging bundle dry-run
        run: npx wrangler deploy --env staging --dry-run
      - name: Safety seal
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('config/aurentara-web-project-bindings-v1.json','utf8'));
          if(cfg.schema!=='aurentara.web-project-bindings.v1') process.exit(1);
          for(const b of Object.values(cfg.projects||{})){
            if(b.production_deploy!==false||b.public_deploy!==false||b.dns_change!==false||b.billing!==false||b.automatic_merge!==false) process.exit(1);
            if(!String(b.candidate_branch_prefix||'').startsWith('factory/aurentara-exec-')) process.exit(1);
            if(!String(b.private_preview_url||'').startsWith('https://')) process.exit(1);
          }
          NODE
          ! grep -E -- '--route|--domain|--routes|--domains' .github/workflows/aurentara-private-website-preview-v1.yml
          ! grep -E 'git (merge|push origin .*:(main|factory-control))' scripts/aurentara-web-execution-poller-v1.mjs
          echo "GitHub credentials in Worker: false"
          echo "Production deploy: false"
          echo "Public deploy: false"
          echo "DNS changes: false"
          echo "Automatic merge: false"
