name: RIOSYSTEMS Block 6 Live Web Make Once

on:
  push:
    branches: [feature/block6-bakery-live-e2e]
    paths:
      - '.github/workflows/riosystems-block6-live-web-make-once.yml'

permissions:
  contents: read

concurrency:
  group: riosystems-block6-live-web-make-once
  cancel-in-progress: false

jobs:
  web-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/block6-bakery-live-e2e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve only canonical verified Pages staging URL
        run: |
          node --input-type=module - <<'NODE'
          import { cloudflarePagesStagingEvidence, isCloudflarePagesStagingVerified } from './src/cloudflare-pages-staging-evidence.js';
          const e = cloudflarePagesStagingEvidence();
          if (!isCloudflarePagesStagingVerified()) throw new Error('PAGES_STAGING_EVIDENCE_NOT_VERIFIED');
          if (e.pages_project !== 'chatgpt-factory-preview') throw new Error('PAGES_PROJECT_REJECTED');
          if (e.source_branch !== 'factory/bakery-mueller-staging-v1') throw new Error('PAGES_SOURCE_BRANCH_REJECTED');
          if (!String(e.preview_url || '').startsWith('https://')) throw new Error('PAGES_PREVIEW_URL_REJECTED');
          if (e.production_deploy !== false || e.custom_domain !== false || e.dns_change !== false) throw new Error('PAGES_SAFETY_REJECTED');
          await import('node:fs').then(({writeFileSync}) => writeFileSync('/tmp/pages-url.txt', e.preview_url));
          console.log(JSON.stringify({ ok:true, project:e.pages_project, source_branch:e.source_branch, staging:true, production:false }));
          NODE
      - name: Verify live staging HTML reachability
        run: |
          set -euo pipefail
          url="$(cat /tmp/pages-url.txt)"
          code="$(curl --silent --show-error --max-time 15 --retry 0 --output /tmp/page.html --write-out '%{http_code}' "$url")"
          test "$code" = 200 || { echo "BAKERY_STAGING_HTTP_$code"; exit 3; }
          grep -qi '<html' /tmp/page.html || { echo BAKERY_STAGING_HTML_MISSING; exit 3; }
          echo '{"ok":true,"http_status":200,"staging":true,"production":false}'

  make-live-once:
    needs: web-live-read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: riosystems-staging
    env:
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      BLOCK6_LIVE_APPROVED: RUN_BLOCK6_MAKE_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/block6-bakery-live-e2e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and trace guard
        run: |
          node --check src/bakery-muller-live-e2e.js
          node --check src/block6-make-staging-runner.js
          node --check scripts/block6-make-live-once.mjs
          node scripts/bakery-muller-live-e2e-smoke.mjs
      - name: Run Make scenario exactly once and restore inactive
        run: node scripts/block6-make-live-once.mjs
