name: Visual Foundry AURENTARA Project Thumbnails Candidate

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-project-thumbnails-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_CANDIDATE: REFERENCE_EXTRACTED_EARTH_EXACT_PLACEMENT
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: T11
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: 1.40
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: 6.0
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: 400
      VISUAL_FOUNDRY_SIDEBAR_LOGO_CANDIDATE: SIDEBAR_LOGO_REFERENCE_EXTRACTED_P1
      VISUAL_FOUNDRY_PROJECT_THUMBNAILS_CANDIDATE: PROJECT_THUMBNAILS_REFERENCE_EXTRACTED_P1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-project-thumbnails-P1
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
