name: Visual Foundry AURENTARA Operator AI Reference Assets

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-operator-ai-assets-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-ai-reference-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: OA0_CONTROL
            variant: CONTROL
          - id: OA1_ICONS
            variant: ICONS
          - id: OA2_ICONS_BUTTONS
            variant: ICONS_BUTTONS
          - id: OA3_ICONS_BUTTONS_GLYPHS
            variant: ICONS_BUTTONS_GLYPHS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_OPERATOR_AI_ASSET_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_OPERATOR_AI_ASSET_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-operator-ai-assets-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
