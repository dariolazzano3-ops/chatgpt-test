name: Gelato HD private preview V22 one-shot
on:
  push:
    branches: [aurentara/gelato-shop-hd-v22]
    paths: [.github/workflows/gelato-hd-private-preview-v22.yml]
permissions:
  contents: read
concurrency:
  group: gelato-hd-private-preview-v22
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Safety and image verification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-shop-hd-v22"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'JS'
          const fs=require('fs'), assert=require('assert');
          const root='projects/gelato-donatello-premium-v6/';
          const h=fs.readFileSync(root+'index.html','utf8');
          const image=fs.readFileSync(root+'assets/images/shop/interior-hd-2026.webp');
          const config=JSON.parse(fs.readFileSync('wrangler.gelato-hd-private-v22.jsonc','utf8'));
          assert(h.includes('src="/assets/images/shop/interior-hd-2026.webp"'));
          assert(h.includes('Direkt aus dem Eislabor in die Vitrine.'));
          assert(image.length>100000);
          assert(image.toString('ascii',0,4)==='RIFF'&&image.toString('ascii',8,12)==='WEBP');
          assert(config.name==='gelato-donatello-private-preview-v2');
          assert(!JSON.stringify(config).includes('gelato-donatello.de'));
          console.log('V22 image, caption, target worker gate PASS; photo bytes',image.length);
          JS
      - name: Verify existing private target exists
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2" -o /tmp/gelato-target-check.json
          node -e "const r=require('/tmp/gelato-target-check.json');if(r.success!==true)process.exit(3);console.log('Existing private Worker is accessible')"
      - name: Deploy only to private Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-hd-private-v22.jsonc
      - name: Deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-after.json
          node -e "const r=require('/tmp/gelato-after.json');let d=r.result?.deployments?.[0];if(!r.success||!d||!d.versions?.some(x=>x.percentage===100))process.exit(4);console.log('Cloudflare private preview deployment verified:',d.id)"
