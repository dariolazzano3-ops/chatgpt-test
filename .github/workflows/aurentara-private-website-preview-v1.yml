name: AURENTARA Private Website Preview V1

on:
  workflow_dispatch:
    inputs:
      scope_key:
        description: 'Operator project scope'
        required: true
        type: string
      candidate_branch:
        description: 'Private candidate branch'
        required: true
        type: string
      candidate_sha:
        description: 'Exact candidate SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aurentara-private-website-preview-v1
  cancel-in-progress: false

jobs:
  deploy-private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCOPE_KEY: ${{ inputs.scope_key }}
      CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve allowlisted project binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CANDIDATE_BRANCH" != "factory-control"
          case "$CANDIDATE_BRANCH" in factory/aurentara-exec-*) ;; *) echo "Unsafe candidate branch"; exit 1 ;; esac
          test "$(printf '%s' "$CANDIDATE_SHA" | grep -Ec '^[0-9a-f]{40}$')" = "1"
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('config/aurentara-web-project-bindings-v1.json','utf8'));
          const b=cfg.projects?.[process.env.SCOPE_KEY];
          if(!b) throw new Error('PROJECT_BINDING_NOT_FOUND');
          if(b.production_deploy!==false||b.public_deploy!==false||b.dns_change!==false||b.billing!==false||b.automatic_merge!==false) throw new Error('PROJECT_BINDING_SAFETY_INVALID');
          for(const [k,v] of Object.entries({
            project_path:b.project_path,
            seed_sha:b.seed_sha,
            working_branch:b.working_branch,
            worker:b.private_preview_worker,
            preview_url:b.private_preview_url
          })) console.log(k+'='+v);
          NODE

      - name: Checkout exact private candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE_BRANCH"
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          # Release must originate from the canonical Gelato working branch.
          # Reject any stale candidate, including a former private-preview winner.
          git fetch --no-tags origin "${{ steps.binding.outputs.working_branch }}"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA" || { echo "STALE_CANDIDATE_DIFFERS_FROM_CANONICAL_WORKING_BRANCH"; exit 1; }
          git merge-base --is-ancestor "${{ steps.binding.outputs.seed_sha }}" HEAD
          test -d "${{ steps.binding.outputs.project_path }}"
          test -f "${{ steps.binding.outputs.project_path }}/project.json"
          CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              "${{ steps.binding.outputs.project_path }}"/*) ;;
              *) echo "Candidate changed forbidden path: $path"; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Enforce private-staging project safety
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PATH="${{ steps.binding.outputs.project_path }}"
          node - "$PROJECT_PATH/project.json" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const s=p.safety||{};
          if(s.production_deploy!==false||s.public_deploy!==false||s.dns_changes!==false||s.billing!==false||s.external_writes!==false) process.exit(1);
          if(p.preview_policy?.mode!=='PRIVATE_CLOUDFLARE_ACCESS_ONLY') process.exit(1);
          NODE
          # Fail closed on any explicit true production flag, without nested shell quoting.
          if git grep -n -E 'production_deploy[^:]*:[[:space:]]*true' -- "$PROJECT_PATH"; then
            echo "Refusing private preview: production_deploy true found"
            exit 1
          fi

      - name: Run project acceptance
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PATH="${{ steps.binding.outputs.project_path }}"
          # V6 baseline smoke rejects intentionally redirected legacy routes.
          # Check the current private site, preserving NOINDEX/safety checks.
          node - "$PROJECT_PATH" <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const root=process.argv[2];
          for(const route of ['index.html','eisbecher/index.html','eissorten/index.html','eistorten/index.html','eisvitrine/index.html','kontakt/index.html']){
            assert.ok(fs.existsSync(path.join(root,route)), 'Missing required route: '+route);
          }
          const home=fs.readFileSync(path.join(root,'index.html'),'utf8');
          const headers=fs.readFileSync(path.join(root,'_headers'),'utf8');
          assert.match(home,/noindex,nofollow,noarchive/);
          assert.match(headers,/X-Robots-Tag: noindex/);
          assert.match(home,/assets\/css\/style\.css/);
          assert.match(home,/assets\/js\/app\.js/);
          const project=JSON.parse(fs.readFileSync(path.join(root,'project.json'),'utf8'));
          assert.equal(project.preview_policy?.mode,'PRIVATE_CLOUDFLARE_ACCESS_ONLY');
          for (const key of ['production_deploy','public_deploy','dns_changes','billing','external_writes']) {
            assert.equal(project.safety?.[key],false,'Unsafe project policy: '+key);
          }
          NODE
          if test -f "$PROJECT_PATH/tests/cups-v111.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs" "$PROJECT_PATH/tests/location-v107.test.mjs" "$PROJECT_PATH/tests/location-v108.test.mjs" "$PROJECT_PATH/tests/location-v109.test.mjs" "$PROJECT_PATH/tests/location-v110.test.mjs" "$PROJECT_PATH/tests/cups-v111.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v110.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs" "$PROJECT_PATH/tests/location-v107.test.mjs" "$PROJECT_PATH/tests/location-v108.test.mjs" "$PROJECT_PATH/tests/location-v109.test.mjs" "$PROJECT_PATH/tests/location-v110.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v109.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs" "$PROJECT_PATH/tests/location-v107.test.mjs" "$PROJECT_PATH/tests/location-v108.test.mjs" "$PROJECT_PATH/tests/location-v109.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v108.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs" "$PROJECT_PATH/tests/location-v107.test.mjs" "$PROJECT_PATH/tests/location-v108.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v107.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs" "$PROJECT_PATH/tests/location-v107.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v106.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v106.test.mjs"
          elif test -f "$PROJECT_PATH/tests/location-v105.test.mjs"; then
            node --test "$PROJECT_PATH/tests/location-v105.test.mjs"
          else
            node scripts/gelato-donatello-premium-v6-smoke.mjs
          fi
          find "${{ steps.binding.outputs.project_path }}/assets/js" -name '*.js' -print0 | xargs -0 -n1 node --check

      # WebKit emulation script is retained in Gelato V106 for a separate Safari QA run.
      # Its dependency installation timed out on hosted Ubuntu after 15m (run 38734737005).
      # Mandatory source/hash/safety and Chromium QA remain in place, and Safari is not claimed PASS.

      - name: Isolated private preview dry run
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npx --yes wrangler@4 deploy "$GITHUB_WORKSPACE/${{ steps.binding.outputs.project_path }}"             --name "${{ steps.binding.outputs.worker }}"             --compatibility-date 2026-10-07             --keep-vars             --dry-run             --message "AURENTARA private website execution $CANDIDATE_SHA"

      - name: Deploy to pre-existing private preview Worker
        shell: bash
        run: |
          set -euo pipefail
          # Recheck immediately before the only authorized private deployment.
          git fetch --no-tags origin "${{ steps.binding.outputs.working_branch }}"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA" || { echo "Working branch changed during QA; refusing stale deployment"; exit 1; }
          cd /tmp
          npx --yes wrangler@4 deploy "$GITHUB_WORKSPACE/${{ steps.binding.outputs.project_path }}"             --name "${{ steps.binding.outputs.worker }}"             --compatibility-date 2026-10-07             --keep-vars             --message "AURENTARA private website execution $CANDIDATE_SHA"

      - name: Verify Cloudflare Access remains enforced
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.binding.outputs.preview_url }}"
          curl -sS -I --max-time 20 "$URL/" > /tmp/headers.txt
          grep -Eq '^HTTP/.* 302' /tmp/headers.txt
          tr -d '\r' < /tmp/headers.txt | grep -Eqi '^location: https://[^ ]*cloudflareaccess\.com/'
          echo "PRIVATE_PREVIEW_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_DEPLOY=false" >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLIC_DEPLOY=false" >> "$GITHUB_STEP_SUMMARY"
          echo "DNS_CHANGE=false" >> "$GITHUB_STEP_SUMMARY"
          echo "AUTOMATIC_MERGE=false" >> "$GITHUB_STEP_SUMMARY"
