name: AURENTARA Controlled Launch Readiness V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-ai/**'
      - 'src/customer-product/**'
      - 'scripts/aurentara-customer-red-team-v1.mjs'
      - 'scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_CONTROLLED_LAUNCH_READINESS_V1.md'
      - '.github/workflows/aurentara-controlled-launch-readiness-v1.yml'

jobs:
  controlled-launch-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/launch-readiness-v1.js
          node --check scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
      - name: Re-prove mandatory red team on launch candidate
        run: node scripts/aurentara-customer-red-team-v1.mjs
      - name: Evaluate launch readiness state machine
        run: node scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
