name: HAMYREN Legal Privacy Technical Readiness V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/legal-privacy-readiness-v1.js'
      - 'src/customer-product/production-privacy-surface-v1.js'
      - 'scripts/hamyren-legal-privacy-readiness-v1-smoke.mjs'
      - 'docs/HAMYREN_LEGAL_PRIVACY_TECHNICAL_READINESS_V1.md'
      - 'evidence/aurentara/customer-production-live-state-v1.json'
      - '.github/workflows/hamyren-legal-privacy-readiness-v1.yml'

permissions:
  contents: read

jobs:
  legal-privacy-technical-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/customer-product/legal-privacy-readiness-v1.js
          node --check src/customer-product/production-privacy-surface-v1.js
          node --check scripts/hamyren-legal-privacy-readiness-v1-smoke.mjs
      - name: HAMYREN legal privacy technical readiness
        run: node scripts/hamyren-legal-privacy-readiness-v1-smoke.mjs
      - name: Existing prelaunch privacy regression
        run: node scripts/aurentara-prelaunch-security-privacy-v1-smoke.mjs
      - name: Production account security regression
        run: node scripts/aurentara-production-account-surface-v1-smoke.mjs
      - name: Customer red team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
