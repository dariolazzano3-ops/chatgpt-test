name: PROJECT JAGUAR WebFactory 100 J1 Reference Foundation

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/reference-studio-v1.js'
      - 'src/web-factory/index.js'
      - 'src/web-factory/adapter.js'
      - 'scripts/webfactory-100-j1-reference-foundation-smoke.mjs'
      - '.github/workflows/webfactory-100-j1-reference-foundation.yml'
      - 'docs/PROJECT-JAGUAR-WEBFACTORY-100-J1-REFERENCE-FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check src/web-factory/reference-studio-v1.js
          node --check src/web-factory/index.js
          node --check src/web-factory/adapter.js
          node --check scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: J1 Reference Studio acceptance
        run: node scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: Jaguar regression
        run: node scripts/project-jaguar-premium-static-web-v1-smoke.mjs
      - name: WebFactory V1 regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Web OS V2 regression
        run: node scripts/web-factory-operating-system-v2-smoke.mjs
