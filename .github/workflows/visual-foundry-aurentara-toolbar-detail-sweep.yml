name: Visual Foundry AURENTARA Toolbar Detail Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-toolbar-detail-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbar-detail:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: TB0_CONTROL
            variant: CONTROL
          - id: TB1_OPERATOR
            variant: OPERATOR
          - id: TB2_OPERATOR_REGION
            variant: OPERATOR_REGION
          - id: TB3_FULL_NO_BELL
            variant: FULL_NO_BELL
          - id: TB4_FULL
            variant: FULL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_TOOLBAR_DETAIL_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_TOOLBAR_DETAIL_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-toolbar-detail-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
