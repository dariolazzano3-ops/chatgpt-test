name: Gelato V29 verified private photos fallback deploy
on:
  push:
    branches: [aurentara/gelato-missing-assets-v29]
    paths: [.github/workflows/gelato-v29-safe-asset-deploy.yml]
permissions:
  contents: read
concurrency:
  group: gelato-v29-safe-asset-deploy
  cancel-in-progress: false
jobs:
  verified-private-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Original byte accuracy, project routes and safe target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-missing-assets-v29"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import hashlib,re,json
          from pathlib import Path
          root=Path('projects/gelato-donatello-premium-v6')
          assets={
           'cups/ananas-becher.webp':'a630200255d1a0774669780f686c21dd5e6bbff1237d627b2aadc3399bf6ba6e',
           'cups/gummibaeren-becher.webp':'c1d6ba02e040a767b46e7c039234acd31933b78fa829495240be7c8e53eaeb19',
           'cups/joghurt-banane.webp':'97ef6101183479beb4ab8b62fbcd169b4568e4c2dd53473e2ad20dee12109564',
           'drinks/erdbeer-shake.webp':'3ae36eb6318c41aa33e62552dff2b13be81b64e0bdbf49fd0b9124a3e4919f59',
           'drinks/eiskaffee.webp':'3b861a25bba5c9eb0d21188bbd1166e983d0dfc85396864b660901024d1cba53',
           'drinks/eisschokolade.webp':'95ac99aa9fc914def60f414c42d623882b21cee182427f386085a2662f0d395a',
          }
          for p,sha in assets.items():
           b=(root/'assets/images'/p).read_bytes()
           assert hashlib.sha256(b).hexdigest()==sha, p
           assert b[:4]==b'RIFF' and b[8:12]==b'WEBP',p
          home=(root/'index.html').read_text()
          cups=(root/'eisbecher/index.html').read_text()
          drinks=(root/'getraenke/index.html').read_text()
          nav=(root/'assets/js/components/nav.js').read_text()
          js=(root/'assets/js/components/discovery-cups.js').read_text()
          assert len(re.findall(r'src: "/assets/images/cups/',js))==9
          assert 'const TICK_MS = 2000' in js
          for p in ['ananas-becher','gummibaeren-becher','joghurt-banane']:
           assert p in cups and p in js
          for p in ['erdbeer-shake','eiskaffee','eisschokolade']:
           assert p in home and p in drinks
          assert '/getraenke/' in nav and '/getraenke/' in home
          assert 'data-discovery-flavors' in home and 'data-discovery-cups' in home
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          w=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert w['name']=='gelato-donatello-private-preview-v2' and w['assets']['run_worker_first'] is False
          print('PASS: all six byte-exact originals, active product references, slideshow, private/noindex target')
          PY
          node --check projects/gelato-donatello-premium-v6/assets/js/app.js
          node --check projects/gelato-donatello-premium-v6/assets/js/components/discovery-cups.js
          node --check projects/gelato-donatello-premium-v6/assets/js/components/nav.js
      - name: Existing private Cloudflare worker preflight
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = '200'
      - name: Deploy static assets to private Gelato worker only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm 100 percent private deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/v29-deploy.json
          node -e "const r=require('/tmp/v29-deploy.json'),d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('PRIVATE V29 DEPLOY VERIFIED:',d.id)"
