name: PostHog Secret Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/posthog-secret-preflight.yml'
      - '.github/workflows/activate-posthog-telemetry-once.yml'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  verify-secret-name:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify PostHog secret is configured in Cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx wrangler secret list --name chatgpt-test --format json > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const secrets = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = new Set((Array.isArray(secrets) ? secrets : []).map((item) => item?.name));
          if (!names.has('POSTHOG_PROJECT_TOKEN')) throw new Error('POSTHOG_PROJECT_TOKEN_NOT_CONFIGURED');
          console.log('POSTHOG_PROJECT_TOKEN is configured in Cloudflare; its value was not read or printed.');
          NODE
