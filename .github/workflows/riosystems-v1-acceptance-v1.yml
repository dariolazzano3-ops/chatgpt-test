name: RIOSYSTEMS V1 Acceptance Gate

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/human-outcome-acceptance-v1.js'
      - 'src/riosystems-v1-acceptance-v1.js'
      - 'src/riosystems-v1-acceptance-evidence-v1.js'
      - 'src/operator-staging-deployment-evidence-v1.js'
      - 'src/operator-cloudflare-access-evidence-v1.js'
      - 'src/cloudflare-access-readonly-verifier-v1.js'
      - 'scripts/human-outcome-acceptance-v1-smoke.mjs'
      - 'scripts/riosystems-v1-acceptance-v1-smoke.mjs'
      - 'scripts/riosystems-v1-acceptance-evidence-v1-smoke.mjs'
      - 'scripts/operator-staging-deployment-evidence-v1-smoke.mjs'
      - 'scripts/operator-cloudflare-access-evidence-v1-smoke.mjs'
      - 'scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs'
      - 'scripts/cloudflare-access-live-readonly-verify.mjs'
      - '.github/workflows/riosystems-v1-acceptance-v1.yml'
      - '.github/workflows/riosystems-cloudflare-access-readonly.yml'
      - 'src/entry.js'
      - 'src/operator-runtime-v1.js'
      - 'src/operator-runtime-api-v1.js'
      - 'src/operator-dashboard-v1.js'
      - 'src/operator-dashboard-shell-v1.js'
      - 'src/operator-dashboard-completeness-v1.js'
      - 'src/operator-project-create-dashboard-v1.js'
      - 'src/operator-system-health-v1.js'
      - 'src/operator-system-health-dashboard-v1.js'
      - 'src/operator-v1-acceptance-dashboard-v1.js'
      - 'src/universal-mission-run-v1.js'
      - 'scripts/universal-mission-generalization-v1-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate acceptance gate syntax
        run: |
          node --check src/human-outcome-acceptance-v1.js
          node --check src/riosystems-v1-acceptance-v1.js
          node --check src/riosystems-v1-acceptance-evidence-v1.js
          node --check src/operator-staging-deployment-evidence-v1.js
          node --check src/operator-cloudflare-access-evidence-v1.js
          node --check src/cloudflare-access-readonly-verifier-v1.js
          node --check src/operator-v1-acceptance-dashboard-v1.js
          node --check scripts/human-outcome-acceptance-v1-smoke.mjs
          node --check scripts/riosystems-v1-acceptance-v1-smoke.mjs
          node --check scripts/riosystems-v1-acceptance-evidence-v1-smoke.mjs
          node --check scripts/operator-staging-deployment-evidence-v1-smoke.mjs
          node --check scripts/operator-cloudflare-access-evidence-v1-smoke.mjs
          node --check scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs
          node --check scripts/cloudflare-access-live-readonly-verify.mjs
      - name: Real human outcome fail-closed contract
        run: node scripts/human-outcome-acceptance-v1-smoke.mjs
      - name: RIOSYSTEMS V1 acceptance contract
        run: node scripts/riosystems-v1-acceptance-v1-smoke.mjs
      - name: Operator staging deployment evidence
        run: node scripts/operator-staging-deployment-evidence-v1-smoke.mjs
      - name: Cloudflare Access verifier safety
        run: node scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs
      - name: Operator Cloudflare Access evidence
        run: node scripts/operator-cloudflare-access-evidence-v1-smoke.mjs
      - name: RIOSYSTEMS V1 acceptance evidence
        run: node scripts/riosystems-v1-acceptance-evidence-v1-smoke.mjs
      - name: Operator System Health regression
        run: node scripts/operator-system-health-v1-smoke.mjs
      - name: Private Operator Dashboard regression
        run: node scripts/operator-dashboard-v1-smoke.mjs
      - name: Universal Mission generalization and recovery regression
        run: node scripts/universal-mission-generalization-v1-smoke.mjs
      - name: Integrated RIOSYSTEMS regression gate
        run: node scripts/riosystems-integrated-regression-gate.mjs
