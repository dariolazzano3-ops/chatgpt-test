name: AURENTARA HQ Preview Access Diagnostic
# diagnostic-v2

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/aurentara-hq-preview-access-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: riosystems-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/aurentara-hq-preview-access-diagnostic.mjs
      - run: node scripts/aurentara-hq-preview-access-diagnostic.mjs
