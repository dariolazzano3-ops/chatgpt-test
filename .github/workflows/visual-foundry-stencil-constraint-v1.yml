name: Visual Foundry Stencil Constraint Closure V1
# canonical hero png transport recheck
# hero derivative evidence recheck

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-stencil-constraint-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stencil-constraint-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check src/visual-foundry/stencil-mode.js
      - run: node --check src/visual-foundry/constraint-solver.js
      - run: node --check src/visual-foundry/soft-region-locks.js
      - run: node --check src/visual-foundry/visual-priority.js
      - run: node --check src/visual-foundry/semantic-gate.js
      - run: node --check scripts/visual-foundry-stencil-constraint-v1-smoke.mjs
      - run: node --check scripts/visual-foundry-hero-asset-reconstruction-smoke.mjs
      - run: node scripts/visual-foundry-delta-closure-hardening-v1-smoke.mjs
      - run: node scripts/visual-foundry-hero-asset-reconstruction-smoke.mjs
      - run: node scripts/visual-foundry-stencil-constraint-v1-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-foundry-stencil-constraint-v1-evidence
          path: |
            artifacts/visual-foundry/stencil-constraint-v1
            artifacts/visual-foundry/hardening-v1
          if-no-files-found: error
