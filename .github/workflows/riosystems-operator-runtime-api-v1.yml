name: RIOSYSTEMS Operator Runtime API V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/operator-runtime-v1.js'
      - 'src/operator-runtime-store-v1.js'
      - 'src/operator-runtime-api-v1.js'
      - 'scripts/operator-runtime-api-v1-smoke.mjs'
      - 'docs/RIOSYSTEMS-OPERATOR-RUNTIME-API-V1.md'
      - '.github/workflows/riosystems-operator-runtime-api-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/operator-runtime-v1.js
          node --check src/operator-runtime-store-v1.js
          node --check src/operator-runtime-api-v1.js
          node --check scripts/operator-runtime-api-v1-smoke.mjs
      - name: Operator Runtime API acceptance
        run: node scripts/operator-runtime-api-v1-smoke.mjs
      - name: Operator Control Plane regression
        run: node scripts/operator-control-plane-v1-smoke.mjs
      - name: Command Center regression
        run: node scripts/phase5-command-center-smoke.mjs
      - name: Universal Mission Run regression
        run: node scripts/universal-mission-run-v1-smoke.mjs
      - name: Integrated RIOSYSTEMS regression gate
        run: node scripts/riosystems-integrated-regression-gate.mjs
