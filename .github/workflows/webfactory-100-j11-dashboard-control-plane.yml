name: PROJECT JAGUAR WebFactory 100 J11 Dashboard Control Plane

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/dashboard-control-plane-v1.js'
      - 'src/web-factory/index.js'
      - 'src/web-factory/adapter.js'
      - 'src/operator-webfactory-control-plane-v1.js'
      - 'src/operator-premium-masterdashboard-v1.js'
      - 'scripts/webfactory-100-j11-dashboard-control-plane-smoke.mjs'
      - 'scripts/webfactory-100-j11-dashboard-control-plane-browser.mjs'
      - 'scripts/webfactory-100-j11-gelato-donatello-control-plane-dogfood.mjs'
      - '.github/workflows/webfactory-100-j11-dashboard-control-plane.yml'
      - 'docs/PROJECT-JAGUAR-WEBFACTORY-100-J11-DASHBOARD-CONTROL-PLANE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure FFmpeg for J4 regression
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Syntax
        run: |
          node --check src/web-factory/dashboard-control-plane-v1.js
          node --check src/web-factory/index.js
          node --check src/web-factory/adapter.js
          node --check src/operator-webfactory-control-plane-v1.js
          node --check src/operator-premium-masterdashboard-v1.js
          node --check scripts/webfactory-100-j11-dashboard-control-plane-smoke.mjs
          node --check scripts/webfactory-100-j11-dashboard-control-plane-browser.mjs
          node --check scripts/webfactory-100-j11-gelato-donatello-control-plane-dogfood.mjs
      - name: J11 control-plane acceptance
        run: node scripts/webfactory-100-j11-dashboard-control-plane-smoke.mjs
      - name: J11 Gelato Donatello read-only dogfood
        run: node scripts/webfactory-100-j11-gelato-donatello-control-plane-dogfood.mjs
      - name: J11 real dashboard browser acceptance
        run: node scripts/webfactory-100-j11-dashboard-control-plane-browser.mjs
      - name: Premium Masterdashboard regression
        run: |
          node scripts/project-ferrari-premium-masterdashboard-v1-smoke.mjs
          node scripts/project-ferrari-premium-masterdashboard-v1-browser.mjs
      - name: J10 regression
        run: |
          node scripts/webfactory-100-j10-versioning-diff-rollback-smoke.mjs
          node scripts/webfactory-100-j10-gelato-donatello-dogfood.mjs
      - name: J9 regression
        run: node scripts/webfactory-100-j9-browser-accessibility-performance-v2-smoke.mjs
      - name: J8 regression
        run: node scripts/webfactory-100-j8-multi-viewport-reference-closure-smoke.mjs
      - name: J7 regression
        run: node scripts/webfactory-100-j7-visual-closure-smoke.mjs
      - name: J6 regression
        run: node scripts/webfactory-100-j6-content-seo-v2-smoke.mjs
      - name: J5 regression
        run: node scripts/webfactory-100-j5-motion-contract-smoke.mjs
      - name: J4 regression
        run: node scripts/webfactory-100-j4-asset-media-smoke.mjs
      - name: J3 regression
        run: node scripts/webfactory-100-j3-premium-component-registry-smoke.mjs
      - name: J2 regression
        run: node scripts/webfactory-100-j2-reference-design-contract-smoke.mjs
      - name: J1 regression
        run: node scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: WebFactory V1 regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Web OS V2 regression
        run: node scripts/web-factory-operating-system-v2-smoke.mjs
      - name: Integrated safety regression
        run: |
          node scripts/mission-safety-smoke.mjs
          node scripts/edit-regression-guard-smoke.mjs
          node scripts/riosystems-integrated-regression-gate.mjs
      - name: Safety seal
        run: |
          node -e "const fs=require('fs');const y=fs.readFileSync('.github/workflows/webfactory-100-j11-dashboard-control-plane.yml','utf8');if(/wrangler\s+deploy|pages\s+deploy|curl\s+.*workers\.dev/i.test(y))process.exit(1);console.log('J11 workflow contains no deploy command')"
          echo "Automatic execution: false"
          echo "Automatic merge: false"
          echo "Production deploy: false"
          echo "Public launch: false"
          echo "DNS changes: false"
          echo "Paid provider calls: 0"
          echo "External writes: false"
      - name: Upload J11 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webfactory-100-j11-dashboard-control-plane-evidence
          path: artifacts/webfactory-100-j11-dashboard-control-plane
          if-no-files-found: warn
