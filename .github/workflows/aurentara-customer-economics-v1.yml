name: AURENTARA Customer Economics V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/**'
      - 'src/runtime-cost-ledger.js'
      - 'scripts/aurentara-customer-economics-v1-smoke.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_ECONOMICS_V1.md'
      - '.github/workflows/aurentara-customer-economics-v1.yml'

jobs:
  entitlement-economics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/economics-v1.js
          node --check src/customer-product/surface-v1.js
          node --check scripts/aurentara-customer-economics-v1-smoke.mjs
      - name: Zero-cost entitlement and fair-use acceptance
        run: node scripts/aurentara-customer-economics-v1-smoke.mjs
