name: RIOSYSTEMS Make Live Staging Run Once

on:
  workflow_dispatch:
    inputs:
      zone_url:
        description: 'Make zone URL'
        required: true
        default: 'https://eu1.make.com'
        type: string
      team_id:
        description: 'Make team ID'
        required: true
        default: '939128'
        type: string
      scenario_id:
        description: 'Exact RIOSYSTEMS staging scenario ID'
        required: true
        default: '7149691'
        type: string
      plan:
        description: 'Make plan class with API access'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - pro
          - teams
          - enterprise
      confirm_staging_run:
        description: 'Type RUN_STAGING_ONCE to prepare, activate, run once, and restore inactive'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: riosystems-make-live-staging-run-once
  cancel-in-progress: false

jobs:
  run-staging-once:
    if: ${{ inputs.confirm_staging_run == 'RUN_STAGING_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: riosystems-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: factory-control
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate secret presence without revealing it
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          test -n "$MAKE_API_TOKEN" || (echo 'MAKE_API_TOKEN secret is missing' && exit 2)
      - name: Prepare, run once, and restore Make staging scenario inactive
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE_URL: ${{ inputs.zone_url }}
          MAKE_TEAM_ID: ${{ inputs.team_id }}
          MAKE_SCENARIO_ID: ${{ inputs.scenario_id }}
          MAKE_PLAN: ${{ inputs.plan }}
          RIOSYSTEMS_MAKE_STAGING_RUN_APPROVED: 'RUN_STAGING_ONCE'
        run: node scripts/make-live-staging-execution-once.mjs
