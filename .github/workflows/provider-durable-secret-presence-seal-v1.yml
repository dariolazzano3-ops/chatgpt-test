name: Provider Durable Secret Presence Seal V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - '.github/workflows/provider-durable-secret-presence-seal-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'activepieces-final-closing-block-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: riosystems-staging
    env:
      ACTIVEPIECES_SOURCE_SECRET: ${{ secrets.ACTIVEPIECES_API_KEY }}
      WEBFLOW_SOURCE_SECRET: ${{ secrets.WEBFLOW_SITE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Confirm approved source and current binding metadata only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { providerDurabilitySources } from './scripts/staging-worker-runtime-bindings-v1.mjs';

          const sources = providerDurabilitySources(process.env);
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          if (!sources.activepieces_api_key_present || !sources.webflow_site_token_present) {
            console.log(JSON.stringify({
              activepieces_approved_source_present: sources.activepieces_api_key_present,
              webflow_approved_source_present: sources.webflow_site_token_present,
              secret_values_exposed: false
            }));
            process.exit(2);
          }
          if (!/^[a-f0-9]{32}$/i.test(accountId) || !token) throw new Error('CLOUDFLARE_METADATA_READ_CREDENTIALS_REQUIRED');

          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/riosystems-staging/secrets`, {
            method: 'GET',
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            redirect: 'error'
          });
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.success === false) throw new Error(`CLOUDFLARE_SECRET_NAME_METADATA_READ_FAILED_${response.status}`);
          const names = new Set((Array.isArray(body?.result) ? body.result : []).map((item) => item?.name).filter(Boolean));
          const result = {
            activepieces_approved_source_present: true,
            webflow_approved_source_present: true,
            activepieces_current_binding_present: names.has('ACTIVEPIECES_API_KEY'),
            webflow_current_binding_present: names.has('WEBFLOW_SITE_TOKEN'),
            api_token_current_binding_present: names.has('API_TOKEN'),
            durability_gate_remains: false,
            secret_values_exposed: false,
            provider_requests: 0,
            provider_writes: 0,
            flow_executions: 0,
            production_deploy: false
          };
          console.log(JSON.stringify(result));
          if (!result.activepieces_current_binding_present || !result.webflow_current_binding_present || !result.api_token_current_binding_present) process.exit(3);
          NODE
      - name: Validate restore contract with synthetic smoke only
        run: node scripts/staging-worker-runtime-bindings-v1-smoke.mjs
      - name: Validate Worker staging dry-run only
        run: npm run deploy:staging:dry-run
