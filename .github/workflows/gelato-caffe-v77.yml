name: Gelato V77 Private Preview
on:
  push:
    branches: [aurentara/gelato-caffe-v77-visual]
    paths: ['.github/workflows/gelato-caffe-v77.yml']
permissions:
  contents: read
jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check V77 assets and private-only deployment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('projects/gelato-donatello-premium-v6')
          css=(r/'assets/css/style.css').read_text()
          js=(r/'assets/js/app.js').read_text()
          html=(r/'index.html').read_text()
          cfg=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert cfg['name']=='gelato-donatello-private-preview-v2'
          assert cfg['assets']['directory']==str(r)
          assert cfg['assets']['run_worker_first'] is False
          assert 'V77: approved first-reference editorial coffee styling' in css
          assert 'const rotation=(progress-.5)*360' in js
          assert 'prefers-reduced-motion' in css
          assert 'caffe-donatello-cup-v75.webp' in html
          assert (r/'assets/images/editorial/caffe-donatello-cup-v75.webp').is_file()
          assert 'X-Robots-Tag: noindex' in (r/'_headers').read_text()
          print('PASS V77 source and preview-only target')
          PY
      - name: Deploy existing private Worker only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify private Cloudflare deployment
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" >/tmp/v77.json
          node -e "const x=require('/tmp/v77.json');const d=x.result?.deployments?.[0];if(!x.success||!d?.versions?.some(v=>v.percentage===100))process.exit(1);console.log('V77 PRIVATE DEPLOY PASS',d.id)"
