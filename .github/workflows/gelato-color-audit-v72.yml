name: Gelato V72 Original Flavor Pixel Audit
on:
  push:
    branches: [aurentara/gelato-ice-color-arrow-v72]
    paths: ['.github/workflows/gelato-color-audit-v72.yml']
permissions:
  contents: read
jobs:
  source-pixel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract real flavor ice colors from original center-of-scoop image areas
        run: |
          python3 -m pip install --break-system-packages -q pillow
          python3 - <<'PY'
          import re,json,colorsys
          from PIL import Image
          from pathlib import Path
          root=Path('projects/gelato-donatello-premium-v6')
          data=(root/'assets/js/components/hero-flavors.js').read_text()
          flavors=json.loads(re.search(r'export const FLAVORS = (\[.*?\]);',data,re.S).group(1))
          print('FOUND',len(flavors),'FLAVORS')
          for f in flavors:
            p=root/f['src'].lstrip('/')
            img=Image.open(p).convert('RGB').resize((128,128))
            px=img.load()
            # The center of the upper ice mound stays in the product, never the table.
            points=[px[x,y] for y in range(29,60) for x in range(45,84)]
            points.sort(key=lambda c:.2126*c[0]+.7152*c[1]+.0722*c[2])
            def median_c(arr):
              return tuple(sorted(z[i] for z in arr)[len(arr)//2] for i in range(3))
            median=median_c(points)
            bright=median_c(points[len(points)*45//100:len(points)*85//100])
            # Subset most characteristic of bright ice texture with intact hue.
            avg=tuple(round(sum(p[i] for p in points)/len(points)) for i in range(3))
            h=lambda c:'#'+''.join(format(v,'02x') for v in c)
            print(f['name']+'|old='+f['tone']+'|median='+h(median)+'|bright='+h(bright)+'|avg='+h(avg)+'|size='+str(Image.open(p).size))
          PY
