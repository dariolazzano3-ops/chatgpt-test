name: Visual Foundry AURENTARA Portfolio UI Detail Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-portfolio-ui-detail-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-ui-detail:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: PR0_CONTROL
            variant: CONTROL
            gap: 16
            weight: 650
            size: 9.5
            scope: 7
          - id: PR1_ICON
            variant: ICON
            gap: 16
            weight: 650
            size: 9.5
            scope: 7
          - id: PR2_ICON_NAME500
            variant: ICON_NAME500
            gap: 16
            weight: 500
            size: 9.5
            scope: 7
          - id: PR3_ICON_NAME500_SMALL
            variant: ICON_NAME500_SMALL
            gap: 16
            weight: 500
            size: 9
            scope: 7
          - id: PR4_NAME500
            variant: NAME500
            gap: 16
            weight: 500
            size: 9.5
            scope: 7
          - id: PR5_ICON_NAME550
            variant: ICON_NAME550
            gap: 18
            weight: 550
            size: 9.25
            scope: 7
          - id: PR6_ICON_NAME500_SCOPE
            variant: ICON_NAME500_SCOPE
            gap: 18
            weight: 500
            size: 9.25
            scope: 7.5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_PORTFOLIO_UI_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_PORTFOLIO_UI_VARIANT: ${{ matrix.variant }}
      VISUAL_FOUNDRY_PORTFOLIO_UI_HEADER_GAP_PX: ${{ matrix.gap }}
      VISUAL_FOUNDRY_PORTFOLIO_UI_NAME_WEIGHT: ${{ matrix.weight }}
      VISUAL_FOUNDRY_PORTFOLIO_UI_NAME_SIZE_PX: ${{ matrix.size }}
      VISUAL_FOUNDRY_PORTFOLIO_UI_SCOPE_SIZE_PX: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-portfolio-ui-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
