name: RIOSYSTEMS Staging Activation Probe V1

on:
  push:
    branches: [staging-activation-probe-v1]
    paths:
      - '.github/workflows/riosystems-staging-activation-probe-v1.yml'

permissions:
  contents: read

concurrency:
  group: riosystems-staging-activation-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: riosystems-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_OPERATOR_EMAIL: ${{ secrets.RIOSYSTEMS_OPERATOR_EMAIL }}
      RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_URL: ${{ secrets.RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_URL }}
      RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY }}
      RIOSYSTEMS_ZERO_COST_CONFIRMED: ${{ vars.RIOSYSTEMS_CLOUDFLARE_ZERO_COST_CONFIRMED }}
      TARGET_WORKER: riosystems-staging
      TARGET_ACCESS_DOMAIN: riosystems-staging.gelato-donatello-dario-a5a5376c.workers.dev/operator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify isolated exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging-activation-probe-v1"
          test "$(git rev-parse HEAD^1)" = "8209e599659b73fc4d63bfe2f54eaf483f974b33"
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          test "$CHANGED" = ".github/workflows/riosystems-staging-activation-probe-v1.yml"
          echo "canonical_baseline=8209e599659b73fc4d63bfe2f54eaf483f974b33" >> "$GITHUB_STEP_SUMMARY"
          echo "provider_mutations=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe secret and policy presence without values
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${2:-}" ]; then echo "$1=present"; else echo "$1=missing"; fi; }
          {
            present cloudflare_api_token "$CLOUDFLARE_API_TOKEN"
            present cloudflare_account_id "$CLOUDFLARE_ACCOUNT_ID"
            present operator_email "$RIOSYSTEMS_OPERATOR_EMAIL"
            present runtime_supabase_url "$RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_URL"
            present runtime_supabase_service_role "$RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY"
            if [ "$RIOSYSTEMS_ZERO_COST_CONFIRMED" = "true" ]; then echo "zero_cost_policy=true"; else echo "zero_cost_policy=false"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read-only Cloudflare Access and Worker permission probe
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_STATUS="SKIPPED_MISSING_CREDENTIALS"
          WORKER_STATUS="SKIPPED_MISSING_CREDENTIALS"
          ACCESS_ERROR=""
          WORKER_ERROR=""
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACCESS_STATUS="$(curl -sS -o /tmp/access-apps.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100" || true)"
            WORKER_STATUS="$(curl -sS -o /tmp/worker.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$TARGET_WORKER" || true)"
            if [ "$ACCESS_STATUS" != "200" ]; then ACCESS_ERROR="$(jq -r '[.errors[]? | (.code|tostring) + ":" + (.message|tostring)] | join(",")' /tmp/access-apps.json 2>/dev/null || true)"; fi
            if [ "$WORKER_STATUS" != "200" ]; then WORKER_ERROR="$(jq -r '[.errors[]? | (.code|tostring) + ":" + (.message|tostring)] | join(",")' /tmp/worker.json 2>/dev/null || true)"; fi
          fi
          {
            echo "cloudflare_access_apps_http_status=$ACCESS_STATUS"
            echo "cloudflare_worker_service_http_status=$WORKER_STATUS"
            [ -z "$ACCESS_ERROR" ] || echo "cloudflare_access_error=$ACCESS_ERROR"
            [ -z "$WORKER_ERROR" ] || echo "cloudflare_worker_error=$WORKER_ERROR"
            echo "target_access_domain=$TARGET_ACCESS_DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read-only Supabase runtime credential probe
        shell: bash
        run: |
          set -euo pipefail
          STATUS="SKIPPED_MISSING_CREDENTIALS"
          if [ -n "$RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_URL" ] && [ -n "$RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY" ]; then
            STATUS="$(curl -sS -o /tmp/runtime-read.json -w '%{http_code}' \
              -H "apikey: $RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Accept: application/json' \
              "$RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_URL/rest/v1/riosystems_operator_runtime_v1?select=revision&limit=1" || true)"
          fi
          echo "runtime_supabase_read_http_status=$STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize activation readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "probe_completed=true" >> "$GITHUB_STEP_SUMMARY"
          echo "production_deploy=false" >> "$GITHUB_STEP_SUMMARY"
          echo "variable_cost_eur=0" >> "$GITHUB_STEP_SUMMARY"
          echo "provider_mutations=false" >> "$GITHUB_STEP_SUMMARY"
