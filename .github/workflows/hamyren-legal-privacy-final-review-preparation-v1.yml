name: HAMYREN Legal Privacy Final Review Preparation V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/hamyren-legal-privacy-final-review-preparation-v1.js'
      - 'scripts/hamyren-legal-privacy-final-review-preparation-v1-smoke.mjs'
      - 'docs/HAMYREN_LEGAL_PRIVACY_FINAL_REVIEW_PREPARATION_V1.md'
      - 'docs/legal/HAMYREN_DATENSCHUTZERKLAERUNG_REVIEW_DRAFT_V1.md'
      - 'docs/legal/HAMYREN_NUTZUNGSBEDINGUNGEN_REVIEW_DRAFT_V1.md'
      - 'docs/legal/HAMYREN_IMPRESSUM_REVIEW_DRAFT_V1.md'
      - 'docs/legal/HAMYREN_AVV_REVIEW_OUTLINE_V1.md'
      - 'docs/legal/HAMYREN_TOM_REVIEW_ANNEX_V1.md'
      - 'docs/legal/HAMYREN_FINAL_HUMAN_REVIEW_RECORD_TEMPLATE_V1.md'
      - 'evidence/aurentara/hamyren-legal-privacy-final-review-preparation-v1.json'
      - 'evidence/aurentara/customer-production-live-state-v1.json'
      - '.github/workflows/hamyren-legal-privacy-final-review-preparation-v1.yml'

permissions:
  contents: read

jobs:
  final-review-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/customer-product/hamyren-legal-privacy-final-review-preparation-v1.js
          node --check scripts/hamyren-legal-privacy-final-review-preparation-v1-smoke.mjs
      - name: Final review preparation
        run: node scripts/hamyren-legal-privacy-final-review-preparation-v1-smoke.mjs
      - name: Existing legal privacy technical readiness regression
        run: node scripts/hamyren-legal-privacy-readiness-v1-smoke.mjs
      - name: Public surface remains gated
        run: node scripts/hamyren-public-customer-surface-readiness-v1-smoke.mjs
      - name: Customer journey remains gated
        run: node scripts/hamyren-customer-journey-readiness-v1-smoke.mjs
      - name: Controlled launch remains gated
        run: node scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
