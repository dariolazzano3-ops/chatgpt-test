name: RIOSYSTEMS Cloudflare Access Read-only Verification

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/cloudflare-access-readonly-verifier-v1.js'
      - 'scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs'
      - 'scripts/cloudflare-access-live-readonly-verify.mjs'
      - 'scripts/aurentara-operator-custom-domain-readonly-verify.mjs'
      - '.github/workflows/riosystems-cloudflare-access-readonly.yml'
      - 'src/operator-cloudflare-access-evidence-v1.js'
      - 'src/operator-v1-acceptance-dashboard-v1.js'
      - 'src/riosystems-v1-acceptance-evidence-v1.js'
      - 'wrangler.jsonc'
  push:
    branches: [factory-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riosystems-cloudflare-access-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and safety smoke
        run: |
          node --check src/cloudflare-access-readonly-verifier-v1.js
          node --check scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs
          node --check scripts/cloudflare-access-live-readonly-verify.mjs
          node --check scripts/aurentara-operator-custom-domain-readonly-verify.mjs
          node scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs

  verify-access:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_ACCESS_EXPECTED_WORKER_NAME: riosystems-staging
      AURENTARA_OPERATOR_HOSTNAME: control.aurentarasystems.com
      AURENTARA_OPERATOR_WORKER: riosystems-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Cloudflare credential presence without revealing values
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN secret is missing' && exit 2)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID secret is missing' && exit 2)
      - name: Verify canonical custom-domain Access via GET only
        env:
          RIOSYSTEMS_ACCESS_EXPECTED_HOSTNAME: control.aurentarasystems.com
        run: node scripts/cloudflare-access-live-readonly-verify.mjs
      - name: Verify workers.dev operator fallback Access via GET only
        env:
          RIOSYSTEMS_ACCESS_EXPECTED_PATH: /operator
        run: node scripts/cloudflare-access-live-readonly-verify.mjs
      - name: Verify HAMYREN workers.dev customer fallback Access via GET only
        env:
          RIOSYSTEMS_ACCESS_EXPECTED_PATH: /customer
        run: node scripts/cloudflare-access-live-readonly-verify.mjs
      - name: Verify custom-domain Worker binding, certificate and live Access
        run: node scripts/aurentara-operator-custom-domain-readonly-verify.mjs
