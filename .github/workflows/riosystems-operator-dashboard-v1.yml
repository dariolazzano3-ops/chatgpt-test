name: RIOSYSTEMS Private Operator Dashboard V1

on:
  push:
    branches: [factory-control]
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/command-center.js'
      - 'src/operator-dashboard-http-v1.js'
      - 'src/operator-dashboard-projections-v1.js'
      - 'src/operator-dashboard-shell-v1.js'
      - 'src/operator-dashboard-completeness-v1.js'
      - 'src/operator-project-create-dashboard-v1.js'
      - 'src/operator-system-health-v1.js'
      - 'src/operator-system-health-dashboard-v1.js'
      - 'src/operator-functional-completion-dashboard-v1.js'
      - 'src/operator-functional-seal-v1.js'
      - 'src/operator-design-ux-v1.js'
      - 'src/operator-human-ux-seal-v1.js'
      - 'src/operator-human-ux-final-v1.js'
      - 'src/operator-final-human-ux-localization-v1.js'
      - 'src/operator-deployment-localization-v1.js'
      - 'src/operator-branding-v1.js'
      - 'src/operator-project-source-intake-storage-dashboard-v1.js'
      - 'src/operator-project-source-intake-human-acceptance-ui-v1.js'
      - 'src/operator-runtime-api-v1.js'
      - 'src/operator-finalization-runtime-v1.js'
      - 'src/operator-runtime-store-supabase-v1.js'
      - 'src/operator-runtime-bootstrap-v1.js'
      - 'src/entry.js'
      - 'scripts/operator-dashboard-v1-smoke.mjs'
      - 'scripts/operator-dashboard-completeness-v1-smoke.mjs'
      - 'scripts/operator-functional-completion-v1-smoke.mjs'
      - 'scripts/operator-functional-seal-v1-smoke.mjs'
      - 'scripts/operator-design-ux-v1-smoke.mjs'
      - 'scripts/operator-human-ux-reality-v1-smoke.mjs'
      - 'scripts/operator-human-ux-browser-v1.mjs'
      - 'scripts/operator-final-human-ux-localization-v1-smoke.mjs'
      - 'scripts/operator-final-human-ux-mobile-v1.mjs'
      - 'scripts/operator-dashboard-local-worker-smoke.mjs'
      - 'scripts/project-source-human-ux-browser-v1.mjs'
      - 'scripts/operator-runtime-supabase-store-v1-smoke.mjs'
      - 'scripts/operator-live-staging-bridge-v1-smoke.mjs'
      - 'scripts/operator-project-create-v1-smoke.mjs'
      - 'scripts/operator-system-health-v1-smoke.mjs'
      - 'supabase/migrations/20260830114500_operator_runtime_store_v1.sql'
      - 'docs/RIOSYSTEMS-PRIVATE-OPERATOR-DASHBOARD-V1.md'
      - 'wrangler.jsonc'
      - '.github/workflows/riosystems-operator-dashboard-v1.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Syntax
        run: |
          node --check src/command-center.js
          node --check src/operator-dashboard-http-v1.js
          node --check src/operator-dashboard-projections-v1.js
          node --check src/operator-dashboard-shell-v1.js
          node --check src/operator-dashboard-completeness-v1.js
          node --check src/operator-project-create-dashboard-v1.js
          node --check src/operator-system-health-v1.js
          node --check src/operator-system-health-dashboard-v1.js
          node --check src/operator-functional-completion-dashboard-v1.js
          node --check src/operator-functional-seal-v1.js
          node --check src/operator-design-ux-v1.js
          node --check src/operator-human-ux-seal-v1.js
          node --check src/operator-human-ux-final-v1.js
          node --check src/operator-final-human-ux-localization-v1.js
          node --check src/operator-deployment-localization-v1.js
          node --check src/operator-branding-v1.js
          node --check src/operator-runtime-api-v1.js
          node --check src/operator-finalization-runtime-v1.js
          node --check src/operator-runtime-store-supabase-v1.js
          node --check src/operator-runtime-bootstrap-v1.js
          node --check src/entry.js
          node --check scripts/operator-dashboard-v1-smoke.mjs
          node --check scripts/operator-dashboard-completeness-v1-smoke.mjs
          node --check scripts/operator-functional-completion-v1-smoke.mjs
          node --check scripts/operator-functional-seal-v1-smoke.mjs
          node --check scripts/operator-design-ux-v1-smoke.mjs
          node --check scripts/operator-human-ux-reality-v1-smoke.mjs
          node --check scripts/operator-human-ux-browser-v1.mjs
          node --check scripts/operator-final-human-ux-localization-v1-smoke.mjs
          node --check scripts/operator-final-human-ux-mobile-v1.mjs
          node --check scripts/operator-dashboard-local-worker-smoke.mjs
          node --check scripts/operator-runtime-supabase-store-v1-smoke.mjs
          node --check scripts/operator-live-staging-bridge-v1-smoke.mjs
          node --check scripts/operator-project-create-v1-smoke.mjs
          node --check scripts/operator-system-health-v1-smoke.mjs
      - name: Durable Operator Runtime acceptance
        run: node scripts/operator-runtime-supabase-store-v1-smoke.mjs
      - name: Operator live staging bridge acceptance
        run: node scripts/operator-live-staging-bridge-v1-smoke.mjs
      - name: Authoritative project creation acceptance
        run: node scripts/operator-project-create-v1-smoke.mjs
      - name: Authoritative system health acceptance
        run: node scripts/operator-system-health-v1-smoke.mjs
      - name: Private operator dashboard acceptance
        run: node scripts/operator-dashboard-v1-smoke.mjs
      - name: Operator functional completion acceptance
        run: |
          node scripts/operator-functional-completion-v1-smoke.mjs
          node scripts/operator-functional-seal-v1-smoke.mjs
      - name: Operator design UX acceptance
        run: node scripts/operator-design-ux-v1-smoke.mjs
      - name: Final human UX reality contract
        run: node scripts/operator-human-ux-reality-v1-smoke.mjs
      - name: Final German UX localization and bounded retry contract
        run: node scripts/operator-final-human-ux-localization-v1-smoke.mjs
      - name: Operator dashboard completeness acceptance
        run: node scripts/operator-dashboard-completeness-v1-smoke.mjs
      - name: Local Cloudflare Worker acceptance
        run: node scripts/operator-dashboard-local-worker-smoke.mjs
      - name: Browser-based human operator flow
        run: node scripts/operator-human-ux-browser-v1.mjs
      - name: iPhone transient read retention acceptance
        run: node scripts/operator-final-human-ux-mobile-v1.mjs
      - name: Operator Runtime API regression
        run: node scripts/operator-runtime-api-v1-smoke.mjs
      - name: Operator Control Plane regression
        run: node scripts/operator-control-plane-v1-smoke.mjs
      - name: Universal Mission Run regression
        run: node scripts/universal-mission-run-v1-smoke.mjs
      - name: Canonical RIOSYSTEMS regression
        run: npm run check:riosystems
      - name: Integrated RIOSYSTEMS regression gate
        run: node scripts/riosystems-integrated-regression-gate.mjs
      - name: Cloudflare staging bundle dry-run
        run: npx wrangler deploy --env staging --dry-run
