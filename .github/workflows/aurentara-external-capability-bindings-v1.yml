name: AURENTARA External Capability Bindings V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/external-capability-bindings-v1.js'
      - 'src/customer-product/launch-readiness-v1.js'
      - 'scripts/aurentara-external-capability-bindings-v1-smoke.mjs'
      - 'scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs'
      - 'scripts/aurentara-customer-red-team-v1.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_EXTERNAL_CAPABILITY_BINDINGS_V1.md'
      - '.github/workflows/aurentara-external-capability-bindings-v1.yml'

jobs:
  external-capability-bindings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/external-capability-bindings-v1.js
          node --check src/customer-product/launch-readiness-v1.js
          node --check scripts/aurentara-external-capability-bindings-v1-smoke.mjs
      - name: External capability bindings acceptance
        run: node scripts/aurentara-external-capability-bindings-v1-smoke.mjs
      - name: Production activation contracts regression
        run: node scripts/aurentara-production-activation-contracts-v1-smoke.mjs
      - name: Prelaunch security privacy regression
        run: node scripts/aurentara-prelaunch-security-privacy-v1-smoke.mjs
      - name: Launch readiness regression
        run: node scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
      - name: Mandatory Customer Red Team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
