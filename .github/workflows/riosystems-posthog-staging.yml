name: RIOSYSTEMS PostHog Staging

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/posthog-staging-event-schema.js'
      - 'src/posthog-staging-event-runner.js'
      - 'src/posthog-staging-event-evidence.js'
      - 'src/provider-stack-v1.js'
      - 'src/command-center.js'
      - 'scripts/posthog-staging-event-smoke.mjs'
      - 'scripts/posthog-staging-event-evidence-smoke.mjs'
      - 'scripts/provider-stack-v1-smoke.mjs'
      - 'scripts/phase5-command-center-smoke.mjs'
      - '.github/workflows/riosystems-posthog-staging.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/posthog-staging-event-schema.js
          node --check src/posthog-staging-event-runner.js
          node --check src/posthog-staging-event-evidence.js
          node --check scripts/posthog-staging-event-smoke.mjs
          node --check scripts/posthog-staging-event-evidence-smoke.mjs
      - name: PostHog staging event guards
        run: node scripts/posthog-staging-event-smoke.mjs
      - name: PostHog staging evidence
        run: node scripts/posthog-staging-event-evidence-smoke.mjs
      - name: Provider stack regression
        run: node scripts/provider-stack-v1-smoke.mjs
      - name: Command center regression
        run: node scripts/phase5-command-center-smoke.mjs
