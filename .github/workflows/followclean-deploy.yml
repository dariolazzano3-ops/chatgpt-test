name: FollowClean Deploy (manual)

# Manual only. Never runs on push. Touches only the Worker followclean-mvp-preview.
# Modes:
#   status  – read-only: show deployments and recent versions
#   upload  – test, build, upload a new version with 0 % traffic (prints the version id)
#   deploy  – route traffic to an uploaded version (needs version_id; optional split with a second version)
# Token: FOLLOWCLEAN_CF_TOKEN (scoped, preferred). Falls back to the repo-wide CLOUDFLARE_API_TOKEN.
# Bindings: FC_APIFY_BUDGET_DB stays on chatgpt-test-db (phase B switch is a separate release).
# Secrets and dashboard vars are kept (--keep-vars); this workflow never sets or reads secret values.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'status | upload | deploy'
        required: true
        default: status
        type: choice
        options: [status, upload, deploy]
      ref:
        description: 'Git ref to build (upload mode)'
        required: false
        default: factory/followclean-v21-landing-20261120
        type: string
      version_id:
        description: 'Version id to route traffic to (deploy mode)'
        required: false
        type: string
      percentage:
        description: 'Traffic % for version_id (deploy mode, 1-100)'
        required: false
        default: '100'
        type: string
      other_version_id:
        description: 'Version that keeps the remaining traffic when percentage < 100'
        required: false
        type: string

concurrency:
  group: followclean-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORKER: followclean-mvp-preview
  CLOUDFLARE_API_TOKEN: ${{ secrets.FOLLOWCLEAN_CF_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  status:
    if: inputs.mode == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes wrangler@4 deployments status --name "$WORKER"
      - run: npx --yes wrangler@4 versions list --name "$WORKER" | tail -n 40

  upload:
    if: inputs.mode == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: followclean-staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Full FollowClean test suite
        run: |
          set -e
          for t in analysis-budget-smoke apify-adapter-smoke apify-two-actor-smartscan-v2-smoke instagram-live-worker-smoke smart-scan-v1-smoke apify-v2-ledger-orchestration-smoke apify-v2-ledger-hardening-smoke export-checker-v1-smoke chrome-ux-smoke premium-conversion-e2e landing-v21-smoke release-verify; do
            echo "::group::$t"; node apps/followclean/tests/$t.mjs; echo "::endgroup::"
          done
      - name: Build worker
        run: node apps/followclean/build-instagram-worker.mjs && node --check apps/followclean/dist/worker.mjs && sha256sum apps/followclean/dist/worker.mjs
      - name: Upload version (0 % traffic)
        id: up
        working-directory: apps/followclean
        run: |
          set -o pipefail
          SHA=$(git rev-parse --short HEAD)
          npx --yes wrangler@4 versions upload --config wrangler.followclean.jsonc --keep-vars \
            --tag "gh-$SHA" --message "FollowClean ${{ inputs.ref }} @ $SHA" | tee upload.log
          VID=$(grep -oiE 'Worker Version ID: *[0-9a-f-]{36}' upload.log | grep -oE '[0-9a-f-]{36}' | head -1)
          test -n "$VID"
          echo "version_id=$VID" >> "$GITHUB_OUTPUT"
          { echo "### Uploaded, 0 % traffic"; echo "Version: \`$VID\` (commit $SHA)"; echo "Preview URL (if enabled) is in the log."; echo "Next: run this workflow with mode=deploy and version_id=$VID."; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: followclean-production
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate inputs
        env: { VID: '${{ inputs.version_id }}', PCT: '${{ inputs.percentage }}', OTHER: '${{ inputs.other_version_id }}' }
        run: |
          [[ "$VID" =~ ^[0-9a-f-]{36}$ ]] || { echo "version_id missing/invalid"; exit 1; }
          [[ "$PCT" =~ ^[0-9]{1,3}$ ]] && [ "$PCT" -ge 1 ] && [ "$PCT" -le 100 ] || { echo "percentage must be 1-100"; exit 1; }
          if [ "$PCT" -lt 100 ]; then [[ "$OTHER" =~ ^[0-9a-f-]{36}$ ]] || { echo "other_version_id required below 100 %"; exit 1; }; fi
      - name: Route traffic
        env: { VID: '${{ inputs.version_id }}', PCT: '${{ inputs.percentage }}', OTHER: '${{ inputs.other_version_id }}' }
        run: |
          if [ "$PCT" -lt 100 ]; then
            npx --yes wrangler@4 versions deploy "$VID@$PCT%" "$OTHER@$((100-PCT))%" --name "$WORKER" --yes
          else
            npx --yes wrangler@4 versions deploy "$VID@100%" --name "$WORKER" --yes
          fi
          npx --yes wrangler@4 deployments status --name "$WORKER" | tee -a "$GITHUB_STEP_SUMMARY"
