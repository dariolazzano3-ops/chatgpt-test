name: PROJECT JAGUAR WebFactory 100 J5 Motion Contract

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/motion-localization.js'
      - 'src/web-factory/lifecycle-governance-v2.js'
      - 'src/web-factory/operating-system-v2.js'
      - 'src/web-factory/index.js'
      - 'src/web-factory/adapter.js'
      - 'scripts/webfactory-100-j5-motion-contract-smoke.mjs'
      - '.github/workflows/webfactory-100-j5-motion-contract.yml'
      - 'docs/PROJECT-JAGUAR-WEBFACTORY-100-J5-MOTION-CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check src/web-factory/motion-localization.js
          node --check src/web-factory/lifecycle-governance-v2.js
          node --check src/web-factory/operating-system-v2.js
          node --check src/web-factory/index.js
          node --check src/web-factory/adapter.js
          node --check scripts/webfactory-100-j5-motion-contract-smoke.mjs
      - name: J5 Motion Contract acceptance
        run: node scripts/webfactory-100-j5-motion-contract-smoke.mjs
      - name: J3 Premium Component regression
        run: node scripts/webfactory-100-j3-premium-component-registry-smoke.mjs
      - name: J2 Design Contract regression
        run: node scripts/webfactory-100-j2-reference-design-contract-smoke.mjs
      - name: J1 Reference Studio regression
        run: node scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: WebFactory V1 regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Web OS V2 regression
        run: node scripts/web-factory-operating-system-v2-smoke.mjs
