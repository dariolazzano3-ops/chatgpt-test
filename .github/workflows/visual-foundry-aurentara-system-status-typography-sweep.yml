name: Visual Foundry AURENTARA System Status Typography Sweep
# sealed baseline rerun

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-system-status-typography-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-status-typography:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: R1
            primary_size: 9
            secondary_size: 9
            secondary_weight: 600
          - id: R2
            primary_size: 9.5
            secondary_size: 9.5
            secondary_weight: 600
          - id: R3
            primary_size: 10
            secondary_size: 10
            secondary_weight: 600
          - id: R4
            primary_size: 9
            secondary_size: 9
            secondary_weight: 700
          - id: R5
            primary_size: 9.5
            secondary_size: 9.5
            secondary_weight: 700
          - id: R6
            primary_size: 10
            secondary_size: 10
            secondary_weight: 700
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_RIGHT_RAIL_TYPOGRAPHY_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_RIGHT_RAIL_TYPOGRAPHY_SCOPE: SYSTEM_STATUS
      VISUAL_FOUNDRY_RIGHT_RAIL_PRIMARY_SIZE_PX: ${{ matrix.primary_size }}
      VISUAL_FOUNDRY_RIGHT_RAIL_SECONDARY_SIZE_PX: ${{ matrix.secondary_size }}
      VISUAL_FOUNDRY_RIGHT_RAIL_SECONDARY_WEIGHT: ${{ matrix.secondary_weight }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-system-status-typography-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
