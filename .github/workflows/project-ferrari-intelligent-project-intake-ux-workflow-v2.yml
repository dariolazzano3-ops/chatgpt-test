name: PROJECT FERRARI Intelligent Project Intake UX & Workflow V2

on:
  push:
    branches:
      - factory/project-ferrari-intelligent-project-intake-ux-v2
      - factory-control
    paths:
      - 'src/project-source-intake-v1.js'
      - 'src/project-source-workspace-intake-v1.js'
      - 'src/project-source-knowledge-review-v1.js'
      - 'src/project-source-knowledge-organizer-v1.js'
      - 'src/operator-project-source-intake-storage-dashboard-v1.js'
      - 'src/operator-project-source-intake-human-acceptance-ui-v1.js'
      - 'src/operator-project-source-intake-knowledge-review-v1.js'
      - 'src/operator-project-intake-ux-v2.js'
      - 'src/entry.js'
      - 'scripts/project-ferrari-intelligent-project-intake-ux-workflow-v2-smoke.mjs'
      - 'scripts/project-ferrari-intelligent-project-intake-ux-v2-browser.mjs'
      - '.github/workflows/project-ferrari-intelligent-project-intake-ux-workflow-v2.yml'
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/project-source-intake-v1.js'
      - 'src/project-source-workspace-intake-v1.js'
      - 'src/project-source-knowledge-review-v1.js'
      - 'src/project-source-knowledge-organizer-v1.js'
      - 'src/operator-project-source-intake-storage-dashboard-v1.js'
      - 'src/operator-project-source-intake-human-acceptance-ui-v1.js'
      - 'src/operator-project-source-intake-knowledge-review-v1.js'
      - 'src/operator-project-intake-ux-v2.js'
      - 'src/entry.js'
      - 'scripts/project-ferrari-intelligent-project-intake-ux-workflow-v2-smoke.mjs'
      - '.github/workflows/project-ferrari-intelligent-project-intake-ux-workflow-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ferrari-intelligent-project-intake-ux-workflow-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      - name: V2 syntax
        run: |
          node --check src/project-source-intake-v1.js
          node --check src/project-source-workspace-intake-v1.js
          node --check src/project-source-knowledge-review-v1.js
          node --check src/project-source-knowledge-organizer-v1.js
          node --check src/operator-project-source-intake-storage-dashboard-v1.js
          node --check src/operator-project-source-intake-knowledge-review-v1.js
          node --check src/operator-project-intake-ux-v2.js
          node --check src/entry.js
          node --check scripts/project-ferrari-intelligent-project-intake-ux-workflow-v2-smoke.mjs
          node --check scripts/project-ferrari-intelligent-project-intake-ux-v2-browser.mjs

      - name: Intelligent Project Intake UX and Workflow V2 acceptance
        run: node scripts/project-ferrari-intelligent-project-intake-ux-workflow-v2-smoke.mjs

      - name: Existing Intelligent Intake and Knowledge Approval regression
        run: node scripts/project-ferrari-intelligent-project-intake-knowledge-approval-v1-smoke.mjs

      - name: Project Source Intake and private storage regression
        run: |
          node scripts/project-source-intake-v1-smoke.mjs
          node scripts/project-source-intake-v1-acceptance.mjs
          node scripts/project-source-intake-storage-v1-smoke.mjs
          node scripts/project-source-human-acceptance-ui-v1-smoke.mjs

      - name: Ferrari Dashboard Human Input Closure regression
        run: node scripts/project-ferrari-dashboard-human-input-closure-v1-smoke.mjs

      - name: Gelato realistic customer input dogfood regression
        run: node scripts/gelato-ferrari-realistic-input-dogfood-v1.mjs

      - name: System-wide Preview Access V2 regression
        run: |
          node scripts/generate-project-preview-index-v1.mjs
          node scripts/project-ferrari-project-scoped-preview-access-v1-smoke.mjs

      - name: Project Repair knowledge binding protection gate
        run: node scripts/project-repair-wave2-project-knowledge-binding-smoke.mjs

      - name: Cloudflare Access Read-only Verification regression
        run: node scripts/cloudflare-access-readonly-verifier-v1-smoke.mjs

      - name: Install Chromium for Desktop and Mobile regressions
        run: npx playwright install --with-deps chromium

      - name: Intelligent Intake V2 browser acceptance
        timeout-minutes: 3
        run: node scripts/project-ferrari-intelligent-project-intake-ux-v2-browser.mjs

      - name: Existing Source Intake Desktop and Mobile regression
        run: node scripts/project-source-human-ux-browser-v1.mjs

      - name: Existing Ferrari Human Input Closure Desktop and Mobile regression
        run: node scripts/project-ferrari-dashboard-human-input-closure-v1-browser.mjs

      - name: Existing System-wide Preview Desktop and Mobile regression
        run: node scripts/project-ferrari-project-scoped-preview-access-v1-browser.mjs

      - name: Safety invariants
        run: |
          echo "Production deploy: false"
          echo "External writes: false"
          echo "Public: false"
          echo "DNS changed: false"
          echo "Billing changed: false"
          echo "New factory: false"
          echo "New provider: false"
          echo "Project Repair reopened: false"
