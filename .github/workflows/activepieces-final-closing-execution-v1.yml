name: Activepieces Final Closing Execution V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'scripts/activepieces-final-closing-execution-v1.mjs'
      - '.github/workflows/activepieces-final-closing-execution-v1.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-candidate:
    if: github.head_ref == 'activepieces-final-closing-block-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Validate final diagnostics without real provider calls
        run: |
          node --check scripts/activepieces-final-closing-execution-v1.mjs
          node scripts/final-provider-connection-diagnostics-smoke.mjs
          node scripts/staging-worker-runtime-bindings-v1-smoke.mjs
          npm run deploy:staging:dry-run

  deploy-and-verify-once:
    if: github.head_ref == 'activepieces-final-closing-block-v1'
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: riosystems-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RIOSYSTEMS_OPERATOR_RUNTIME_SUPABASE_SERVICE_ROLE_KEY }}
      ACTIVEPIECES_API_KEY: ${{ secrets.ACTIVEPIECES_API_KEY }}
      WEBFLOW_SITE_TOKEN: ${{ secrets.WEBFLOW_SITE_TOKEN }}
      ACTIVEPIECES_SOURCE_SECRET: ${{ secrets.ACTIVEPIECES_API_KEY }}
      WEBFLOW_SOURCE_SECRET: ${{ secrets.WEBFLOW_SITE_TOKEN }}
      FACTORY_API_TOKEN_A: ${{ secrets.API_TOKEN }}
      FACTORY_API_TOKEN_B: ${{ secrets.RIO_FACTORY_API_TOKEN }}
      ACCESS_APP_ID: 3a87e726-2724-479f-8e52-6f954e6efc24
      FACTORY_URL: https://control.aurentarasystems.com
      RIOSYSTEMS_ACCESS_EXPECTED_WORKER_NAME: riosystems-staging
      RIOSYSTEMS_STAGING_BINDINGS_APPROVED: 'true'
      RIOSYSTEMS_STAGING_DEPLOY_APPROVED: 'true'
      RIOSYSTEMS_ZERO_COST_CONFIRMED: ${{ vars.RIOSYSTEMS_CLOUDFLARE_ZERO_COST_CONFIRMED }}
      RIOSYSTEMS_STAGING_CONFIRMATION: DEPLOY_RIOSYSTEMS_STAGING_ZERO_COST
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Audit approved GitHub provider secret sources without values
        run: |
          node - <<'NODE'
          console.log(JSON.stringify({
            activepieces_api_key_present: Boolean(process.env.ACTIVEPIECES_SOURCE_SECRET || ''),
            webflow_site_token_present: Boolean(process.env.WEBFLOW_SOURCE_SECRET || ''),
            secret_values_returned: false
          }));
          NODE
      - name: Deploy tested candidate to isolated zero-cost staging only
        run: |
          test "$GITHUB_HEAD_REF" = "activepieces-final-closing-block-v1"
          test "$RIOSYSTEMS_ZERO_COST_CONFIRMED" = "true"
          npm run deploy:staging
      - name: Restore approved durable runtime bindings without logging values
        run: node scripts/staging-worker-runtime-bindings-v1.mjs
      - name: Execute exact one-shot Activepieces verification with mandatory Access cleanup
        run: node scripts/activepieces-final-closing-execution-v1.mjs
      - name: Publish sanitized execution evidence to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.activepieces-final-close/evidence.json';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : JSON.stringify({
                  schema_version: '1.0',
                  provider_id: 'activepieces-cloud-free',
                  environment: 'staging',
                  final: { activepieces_l3_connected: false, blocker: 'EXECUTION_EVIDENCE_NOT_CREATED' },
                  secrets_persisted: false
                }, null, 2);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- activepieces-final-closing-execution-v1 -->\nSanitized final execution evidence:\n\n\`\`\`json\n${body}\n\`\`\``
            });
