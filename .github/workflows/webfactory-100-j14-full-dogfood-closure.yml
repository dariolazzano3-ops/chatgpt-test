name: PROJECT JAGUAR WebFactory 100 J14 Full Dogfood Closure

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/full-dogfood-closure-v1.js'
      - 'src/web-factory/index.js'
      - 'scripts/webfactory-100-j14-full-dogfood-closure-smoke.mjs'
      - 'scripts/webfactory-100-j14-gelato-real-integrity-dogfood.mjs'
      - 'scripts/webfactory-100-j14-full-dogfood-browser.mjs'
      - '.github/workflows/webfactory-100-j14-full-dogfood-closure.yml'
      - 'docs/PROJECT-JAGUAR-WEBFACTORY-100-J14-FULL-DOGFOOD-CLOSURE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure FFmpeg for J4 regression
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Syntax
        run: |
          node --check src/web-factory/full-dogfood-closure-v1.js
          node --check src/web-factory/index.js
          node --check scripts/webfactory-100-j14-full-dogfood-closure-smoke.mjs
          node --check scripts/webfactory-100-j14-gelato-real-integrity-dogfood.mjs
          node --check scripts/webfactory-100-j14-full-dogfood-browser.mjs
      - name: J14 synthetic full lifecycle closure
        run: node scripts/webfactory-100-j14-full-dogfood-closure-smoke.mjs
      - name: J14 Gelato real-project integrity dogfood
        run: node scripts/webfactory-100-j14-gelato-real-integrity-dogfood.mjs
      - name: J14 final composed browser acceptance
        run: node scripts/webfactory-100-j14-full-dogfood-browser.mjs
      - name: J13 Delivery Lifecycle regression
        run: |
          node scripts/webfactory-100-j13-delivery-lifecycle-smoke.mjs
          node scripts/webfactory-100-j13-gelato-delivery-lifecycle-dogfood.mjs
          node scripts/webfactory-100-j13-delivery-lifecycle-browser.mjs
      - name: J12 Next Best Action regression
        run: |
          node scripts/webfactory-100-j12-next-best-action-smoke.mjs
          node scripts/webfactory-100-j12-gelato-next-best-action-dogfood.mjs
          node scripts/webfactory-100-j12-next-best-action-browser.mjs
      - name: J11 Dashboard Control Plane regression
        run: |
          node scripts/webfactory-100-j11-dashboard-control-plane-smoke.mjs
          node scripts/webfactory-100-j11-gelato-donatello-control-plane-dogfood.mjs
          node scripts/webfactory-100-j11-dashboard-control-plane-browser.mjs
      - name: J10 Versioning Diff Rollback regression
        run: |
          node scripts/webfactory-100-j10-versioning-diff-rollback-smoke.mjs
          node scripts/webfactory-100-j10-gelato-donatello-dogfood.mjs
      - name: J9 Browser Accessibility Performance regression
        run: node scripts/webfactory-100-j9-browser-accessibility-performance-v2-smoke.mjs
      - name: J8 Multi-Viewport regression
        run: node scripts/webfactory-100-j8-multi-viewport-reference-closure-smoke.mjs
      - name: J7 Visual Closure regression
        run: node scripts/webfactory-100-j7-visual-closure-smoke.mjs
      - name: J6 Content SEO regression
        run: node scripts/webfactory-100-j6-content-seo-v2-smoke.mjs
      - name: J5 Motion Contract regression
        run: node scripts/webfactory-100-j5-motion-contract-smoke.mjs
      - name: J4 Asset Media regression
        run: node scripts/webfactory-100-j4-asset-media-smoke.mjs
      - name: J3 Premium Component regression
        run: node scripts/webfactory-100-j3-premium-component-registry-smoke.mjs
      - name: J2 Design Contract regression
        run: node scripts/webfactory-100-j2-reference-design-contract-smoke.mjs
      - name: J1 Reference Studio regression
        run: node scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: Premium Masterdashboard regression
        run: |
          node scripts/project-ferrari-premium-masterdashboard-v1-smoke.mjs
          node scripts/project-ferrari-premium-masterdashboard-v1-browser.mjs
      - name: Customer Review and Delivery regression
        run: |
          node scripts/customer-review-lifecycle-v1-smoke.mjs
          node scripts/customer-delivery-contract-v1-smoke.mjs
          node scripts/phase3-execution-delivery-smoke.mjs
      - name: WebFactory V1 regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Web OS V2 regression
        run: node scripts/web-factory-operating-system-v2-smoke.mjs
      - name: Integrated safety regression
        run: |
          node scripts/mission-safety-smoke.mjs
          node scripts/edit-regression-guard-smoke.mjs
          node scripts/riosystems-integrated-regression-gate.mjs
      - name: J14 final safety seal
        run: |
          node -e "const fs=require('fs');const y=fs.readFileSync('.github/workflows/webfactory-100-j14-full-dogfood-closure.yml','utf8');if(/wrangler\\s+deploy|pages\\s+deploy|curl\\s+.*workers\\.dev/i.test(y))process.exit(1);console.log('J14 workflow contains no deploy command')"
          echo "Prerequisite canonical waves: 13"
          echo "Synthetic full lifecycle required: true"
          echo "Real project integrity sentinel required: true"
          echo "Fake real-project PASS forbidden: true"
          echo "Post-merge Exact-Head seal required: true"
          echo "Automatic execution: false"
          echo "Automatic merge: false"
          echo "Production deploy: false"
          echo "Public launch: false"
          echo "DNS changes: false"
          echo "Paid provider calls: 0"
          echo "External writes: false"
      - name: Upload J14 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webfactory-100-j14-full-dogfood-closure-evidence
          path: artifacts/webfactory-100-j14-full-dogfood-closure
          if-no-files-found: warn
