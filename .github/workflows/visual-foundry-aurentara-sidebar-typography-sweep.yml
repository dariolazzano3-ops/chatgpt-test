name: Visual Foundry AURENTARA Sidebar Typography Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-sidebar-typography-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidebar-typography:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: S1
            font_size: 11.0
            weight: 500
          - id: S2
            font_size: 11.5
            weight: 500
          - id: S3
            font_size: 12.0
            weight: 500
          - id: S4
            font_size: 11.0
            weight: 600
          - id: S5
            font_size: 11.5
            weight: 600
          - id: S6
            font_size: 12.0
            weight: 600
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_CANDIDATE: REFERENCE_EXTRACTED_EARTH_EXACT_PLACEMENT
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: T5
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: 1.32
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: 5.5
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: 600
      VISUAL_FOUNDRY_SIDEBAR_NAV_TYPOGRAPHY_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_SIDEBAR_NAV_FONT_SIZE_PX: ${{ matrix.font_size }}
      VISUAL_FOUNDRY_SIDEBAR_NAV_FONT_WEIGHT: ${{ matrix.weight }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-sidebar-typography-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
