name: Gelato original photo private preview V25 one-shot
on:
  push:
    branches: [aurentara/gelato-original-photo-v25]
    paths: [.github/workflows/gelato-original-photo-private-preview-v25.yml]
permissions:
  contents: read
concurrency:
  group: gelato-original-photo-private-preview-v25
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Safety and image verification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-original-photo-v25"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'JS'
          const fs=require('fs'), assert=require('assert'), crypto=require('crypto');
          const root='projects/gelato-donatello-premium-v6/';
          const h=fs.readFileSync(root+'index.html','utf8');
          const image=fs.readFileSync(root+'assets/images/shop/gelato-donatello-original-warm-v25.webp');
          const config=JSON.parse(fs.readFileSync('wrangler.gelato-private-preview.jsonc','utf8'));
          assert(h.includes('src="/assets/images/shop/gelato-donatello-original-warm-v25.webp"'));
          assert(h.includes('Direkt aus dem Eislabor in die Vitrine.'));
          assert(image.length===180188);
          assert(crypto.createHash('sha256').update(image).digest('hex')==='4533f4d40589ac6bb18aee1b01eea9179cf9ba5a776599f7d016ef3bb643f793');
          assert(image.toString('ascii',0,4)==='RIFF'&&image.toString('ascii',8,12)==='WEBP');
          assert(config.name==='gelato-donatello-private-preview-v2');
          assert(!JSON.stringify(config).includes('gelato-donatello.de'));
          console.log('V25 original owner image, caption, target worker gate PASS; photo bytes',image.length);
          JS
      - name: Verify existing private target exists
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          echo "Cloudflare private deployment preflight HTTP $http_code"
          test "$http_code" = "200"
          echo 'Existing private Worker is accessible'
      - name: Deploy only to private Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-after.json
          node -e "const r=require('/tmp/gelato-after.json');let d=r.result?.deployments?.[0];if(!r.success||!d||!d.versions?.some(x=>x.percentage===100))process.exit(4);console.log('Cloudflare private preview deployment verified:',d.id)"
