name: Gelato V65 Milkshake Copy Private Preview
on:
  push:
    branches: [aurentara/gelato-shake-copy-v65]
    paths: ['.github/workflows/gelato-shake-copy-v65.yml']
permissions:
  contents: read
concurrency:
  group: gelato-milkshake-private-v65
  cancel-in-progress: false
jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify copy change and strictly private target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-shake-copy-v65"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('projects/gelato-donatello-premium-v6')
          home=(root/'index.html').read_text()
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          policy=json.loads((root/'project.json').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['directory']=='./projects/gelato-donatello-premium-v6'
          assert config['assets']['run_worker_first'] is False
          assert policy['preview_policy']['external_publish'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          match=re.search(r'<div class="v26-discovery__shake-note".*?</div>\s*<a class="v26-discovery__shake-link".*?</a>',home,re.S)
          assert match, 'Drink marketing section missing'
          note=match.group(0)
          copy='Erdbeer, Vanille oder deine Lieblingssorte? Du wählst dein Eis, wir mixen dir daraus einen herrlich cremigen Milchshake.'
          assert note.count(copy)==1
          assert '<h3>Shake it. Sip it. Donatello.</h3>' in note
          assert 'Von Erdbeer-, Vanille- und Schoko-Shakes' not in note
          assert 'href="/getraenke/"' in note and 'Alle Drinks entdecken' in note
          for klass,href in [('cups','/eisbecher/'),('flavors','/eissorten/'),('shakes','/getraenke/')]:
            assert re.search(r'<a class="v26-discovery__card v26-discovery__card--'+klass+r'" href="'+href+'"', home)
          assert (root/'assets/images/drinks/erdbeer-shake.webp').is_file()
          print('PASS V65 copy, unchanged links and images, private-only worker and noindex')
          PY
      - name: iPhone and desktop browser layout QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v65-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gelato-v65-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gelato-v65-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [name,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              const section=page.locator('.v26-discovery__shake-note');
              await section.scrollIntoViewIfNeeded();
              const heading=section.locator('h3');
              const paragraph=section.locator('.v26-discovery__shake-copy>p:last-child');
              assert.strictEqual(await heading.innerText(),'Shake it. Sip it. Donatello.');
              assert.strictEqual(await paragraph.innerText(),'Erdbeer, Vanille oder deine Lieblingssorte? Du wählst dein Eis, wir mixen dir daraus einen herrlich cremigen Milchshake.');
              const rect=await paragraph.boundingBox(), noteRect=await section.boundingBox();
              assert(rect && noteRect && rect.width>0 && rect.height>0 && rect.x>=noteRect.x-2 && rect.x+rect.width<=noteRect.x+noteRect.width+2);
              assert.strictEqual(await section.locator('a.v26-discovery__shake-link').getAttribute('href'),'/getraenke/');
              const overflow=await page.evaluate(()=>({page:document.documentElement.scrollWidth,viewport:window.innerWidth}));
              assert(overflow.page<=overflow.viewport+3,'unexpected horizontal overflow '+JSON.stringify(overflow));
              assert.deepStrictEqual(errors,[],'unexpected JS errors');
              await section.screenshot({path:'visual-evidence/shake-note-'+name+'.png',animations:'disabled'});
              const drinks=await page.request.get('http://127.0.0.1:43119/getraenke/');
              assert.strictEqual(drinks.status(),200);
              console.log('PASS V65 '+name+' mobile/desktop copy, heading, link, layout, drinks');
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v65-shake-note
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm dedicated private Worker exists
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$status" = "200"
      - name: Deploy Gelato private Worker only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm latest private Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v65-deploy.json
          node -e "const r=require('/tmp/gelato-v65-deploy.json');const d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('GELATO V65 PRIVATE DEPLOY PASS',d.id)"
