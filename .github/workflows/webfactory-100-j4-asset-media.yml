name: PROJECT JAGUAR WebFactory 100 J4 Asset Media

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/asset-media-pipeline-v1.js'
      - 'src/web-factory/operating-system-v2.js'
      - 'src/web-factory/index.js'
      - 'src/web-factory/adapter.js'
      - 'scripts/webfactory-100-j4-asset-media-smoke.mjs'
      - '.github/workflows/webfactory-100-j4-asset-media.yml'
      - 'docs/PROJECT-JAGUAR-WEBFACTORY-100-J4-ASSET-MEDIA.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure FFmpeg capability
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Syntax
        run: |
          node --check src/web-factory/asset-media-pipeline-v1.js
          node --check src/web-factory/operating-system-v2.js
          node --check src/web-factory/index.js
          node --check src/web-factory/adapter.js
          node --check scripts/webfactory-100-j4-asset-media-smoke.mjs
      - name: J4 real Asset and Media acceptance
        run: node scripts/webfactory-100-j4-asset-media-smoke.mjs
      - name: J3 Premium Component regression
        run: node scripts/webfactory-100-j3-premium-component-registry-smoke.mjs
      - name: J2 Design Contract regression
        run: node scripts/webfactory-100-j2-reference-design-contract-smoke.mjs
      - name: J1 Reference Studio regression
        run: node scripts/webfactory-100-j1-reference-foundation-smoke.mjs
      - name: WebFactory V1 regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Web OS V2 regression
        run: node scripts/web-factory-operating-system-v2-smoke.mjs
