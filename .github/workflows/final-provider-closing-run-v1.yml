name: Final Provider Closing Run V1

on:
  push:
    branches: [final-provider-closing-run-v1]
    paths:
      - '.github/workflows/final-provider-closing-run-v1.yml'

permissions:
  contents: read

jobs:
  final-closing-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      BASE_URL: https://control.aurentarasystems.com
    steps:
      - name: Build and syntax-check one-time runner
        shell: bash
        run: |
          cat > /tmp/final-provider-closing-run.mjs <<'NODE'
          const CF = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const cfToken = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const apiToken = String(process.env.API_TOKEN || '').trim();
          const baseUrl = String(process.env.BASE_URL || '').trim();
          const targetHost = 'control.aurentarasystems.com';
          const tempName = 'AURENTARA GitHub Final Provider Closing Run';

          const result = {
            schema: 'aurentara.final-provider-closing-run.v1',
            live_staging_sha: '621a84f0119e0f6ca80d5aefae06a4f39d5f4a06',
            access: {
              audit_ok: false,
              matching_application_count: null,
              service_token_created: false,
              service_auth_policy_created: false,
              propagation_wait_completed: false,
              human_policy_preserved: false,
              bypass_count_before: null,
              broad_allow_count_before: null,
              cleanup_verified: false,
              temp_token_remains: null,
              temp_policy_remains: null,
              bypass_count_after: null,
              broad_allow_count_after: null,
              error: null
            },
            webflow: null,
            activepieces: null,
            safety: {
              secrets_exposed: false,
              total_provider_writes: 0,
              real_customer_data: false,
              production: false,
              variable_cost_eur: 0
            }
          };

          const clean = (v) => String(v ?? '').trim();
          const mask = (v) => { if (v) console.log('::add-mask::' + v); };
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          const ruleKeys = (r) => r && typeof r === 'object' && !Array.isArray(r) ? Object.keys(r).map(k => k.toLowerCase()) : [];
          const safeHostname = (v) => { try { return new URL(clean(v).includes('://') ? clean(v) : `https://${clean(v)}`).hostname.toLowerCase(); } catch { return ''; } };
          const appHosts = (app) => {
            const values = [safeHostname(app?.domain)];
            for (const d of Array.isArray(app?.destinations) ? app.destinations : []) {
              if (clean(d?.type).toLowerCase() === 'public') values.push(safeHostname(d?.uri));
            }
            return [...new Set(values.filter(Boolean))];
          };
          const broadAllow = (p) => {
            if (clean(p?.decision).toLowerCase() !== 'allow') return false;
            const include = Array.isArray(p?.include) ? p.include : [];
            if (!include.length) return true;
            return include.some(r => ruleKeys(r).some(k => k === 'everyone' || k === 'login_method'));
          };
          const restrictiveHumanAllow = (p) => {
            if (clean(p?.decision).toLowerCase() !== 'allow' || broadAllow(p)) return false;
            const include = Array.isArray(p?.include) ? p.include : [];
            return include.some(r => !ruleKeys(r).includes('service_token') && !ruleKeys(r).includes('any_valid_service_token'));
          };
          const serviceTokenIds = (p) => clean(p?.decision).toLowerCase() === 'non_identity'
            ? (Array.isArray(p?.include) ? p.include : []).map(r => clean(r?.service_token?.token_id)).filter(Boolean)
            : [];

          async function cf(method, path, body) {
            const response = await fetch(CF + path, {
              method,
              redirect: 'manual',
              signal: AbortSignal.timeout(20000),
              headers: {
                authorization: `Bearer ${cfToken}`,
                accept: 'application/json',
                ...(body ? {'content-type':'application/json'} : {})
              },
              body: body ? JSON.stringify(body) : undefined
            });
            let json = null;
            try { json = await response.json(); } catch {}
            return {status: response.status, ok: response.ok && json?.success !== false, json};
          }

          async function worker(path, accessId, accessSecret, expectedService) {
            let response;
            try {
              response = await fetch(baseUrl + path, {
                method: 'GET',
                redirect: 'manual',
                signal: AbortSignal.timeout(20000),
                headers: {
                  accept: 'application/json',
                  'CF-Access-Client-Id': accessId,
                  'CF-Access-Client-Secret': accessSecret,
                  authorization: `Bearer ${apiToken}`
                }
              });
            } catch {
              return {worker_reached:false,http_status:null,body:null,error:'RUNTIME_NETWORK_FAILURE'};
            }
            if (response.status >= 300 && response.status < 400) return {worker_reached:false,http_status:response.status,body:null,error:'RUNTIME_AUTH_GATE'};
            let body = null;
            if ((response.headers.get('content-type') || '').includes('application/json')) {
              try { body = await response.json(); } catch {}
            }
            const reached = !!body && (typeof body.service === 'string' || body.error === 'UNAUTHORIZED' || body.error === 'STAGING_ONLY_EXTERNAL_WRITES_OFF_REQUIRED');
            if (!reached || (expectedService && body?.service !== expectedService)) return {worker_reached:reached,http_status:response.status,body:null,error:'RUNTIME_AUTH_GATE'};
            return {worker_reached:true,http_status:response.status,body,error:null};
          }

          function presence(call) {
            const b = call.body || {};
            const pass = call.worker_reached === true && call.http_status === 200 && b.ok === true && b.credential_present === true && b.provider_requests === 0 && b.provider_writes === 0 && b.production_deploy === false && b.external_writes === false && b.variable_cost_eur === 0;
            return {
              pass,
              worker_reached: call.worker_reached,
              http_status: call.http_status,
              token_present: b.credential_present === true,
              provider_requests: Number(b.provider_requests || 0),
              provider_writes: Number(b.provider_writes || 0),
              error: pass ? null : (call.error || b.error || 'UNKNOWN_PROVIDER_FAILURE')
            };
          }

          function webflowVerify(call) {
            const b = call.body || {};
            const pass = call.worker_reached === true && call.http_status === 200 && b.ok === true && b.credential_valid === true && b.authenticated === true && b.site_accessible === true && b.site_metadata_read === true && b.connected_staging === true && b.provider_requests === 1 && b.provider_writes === 0 && b.publish_performed === false && b.production_deploy === false && b.variable_cost_eur === 0;
            return {
              pass,
              worker_reached: call.worker_reached,
              http_status: call.http_status,
              credential_valid: b.credential_valid === true,
              authenticated: b.authenticated === true,
              site_accessible: b.site_accessible === true,
              site_metadata_read: b.site_metadata_read === true,
              connected_staging: b.connected_staging === true,
              provider_requests: Number(b.provider_requests || 0),
              provider_writes: Number(b.provider_writes || 0),
              publish_performed: b.publish_performed === true,
              error: pass ? null : (call.error || b.error || 'UNKNOWN_PROVIDER_FAILURE')
            };
          }

          function activepiecesVerify(call) {
            const b = call.body || {};
            const pass = call.worker_reached === true && call.http_status === 200 && b.ok === true && b.credential_valid === true && b.authenticated === true && b.api_accessible === true && b.connected_staging === true && b.provider_requests === 1 && b.provider_writes === 0 && b.flow_execution_performed === false && b.production_deploy === false && b.variable_cost_eur === 0;
            return {
              pass,
              worker_reached: call.worker_reached,
              http_status: call.http_status,
              credential_valid: b.credential_valid === true,
              authenticated: b.authenticated === true,
              api_accessible: b.api_accessible === true,
              connected_staging: b.connected_staging === true,
              provider_requests: Number(b.provider_requests || 0),
              provider_writes: Number(b.provider_writes || 0),
              flow_execution_performed: b.flow_execution_performed === true,
              error: pass ? null : (call.error || b.error || 'UNKNOWN_PROVIDER_FAILURE')
            };
          }

          async function main() {
            let appId = '';
            let tempTokenId = '';
            let tempPolicyId = '';
            let accessId = '';
            let accessSecret = '';
            try {
              if (!/^[a-f0-9]{32}$/i.test(accountId) || !cfToken || !apiToken) {
                result.access.error = 'REQUIRED_GITHUB_SECRET_MISSING';
                return;
              }

              const appsRes = await cf('GET', `/accounts/${accountId}/access/apps?per_page=100`);
              if (!appsRes.ok) { result.access.error = 'ACCESS_APPLICATION_AUDIT_FAILED'; return; }
              const apps = Array.isArray(appsRes.json?.result) ? appsRes.json.result : [];
              const matches = apps.filter(app => clean(app?.type).toLowerCase() === 'self_hosted' && appHosts(app).includes(targetHost));
              result.access.matching_application_count = matches.length;
              if (matches.length !== 1) { result.access.error = matches.length ? 'ACCESS_APPLICATION_AMBIGUOUS' : 'ACCESS_APPLICATION_NOT_FOUND'; return; }
              appId = clean(matches[0]?.id);

              const policiesRes = await cf('GET', `/accounts/${accountId}/access/apps/${appId}/policies?per_page=100`);
              if (!policiesRes.ok) { result.access.error = 'ACCESS_POLICY_AUDIT_FAILED'; return; }
              const policies = Array.isArray(policiesRes.json?.result) ? policiesRes.json.result : [];
              result.access.bypass_count_before = policies.filter(p => clean(p?.decision).toLowerCase() === 'bypass').length;
              result.access.broad_allow_count_before = policies.filter(broadAllow).length;
              result.access.human_policy_preserved = policies.some(restrictiveHumanAllow);
              result.access.audit_ok = result.access.human_policy_preserved && result.access.bypass_count_before === 0 && result.access.broad_allow_count_before === 0;
              if (!result.access.audit_ok) { result.access.error = 'ACCESS_SAFETY_AUDIT_FAILED'; return; }

              const tokenRes = await cf('POST', `/accounts/${accountId}/access/service_tokens`, {name: tempName, duration: '1h'});
              if (!tokenRes.ok) { result.access.error = tokenRes.status === 402 ? 'CLOUDFLARE_ACCESS_PAID_UPGRADE_GATE' : 'SERVICE_TOKEN_CREATE_FAILED'; return; }
              tempTokenId = clean(tokenRes.json?.result?.id);
              accessId = clean(tokenRes.json?.result?.client_id);
              accessSecret = clean(tokenRes.json?.result?.client_secret);
              mask(accessId); mask(accessSecret);
              if (!tempTokenId || !accessId || !accessSecret) { result.access.error = 'SERVICE_TOKEN_CREATE_RESPONSE_INVALID'; return; }
              result.access.service_token_created = true;

              const policyRes = await cf('POST', `/accounts/${accountId}/access/apps/${appId}/policies`, {
                name: tempName,
                decision: 'non_identity',
                include: [{service_token:{token_id:tempTokenId}}]
              });
              if (!policyRes.ok) { result.access.error = policyRes.status === 402 ? 'CLOUDFLARE_ACCESS_PAID_UPGRADE_GATE' : 'SERVICE_AUTH_POLICY_CREATE_FAILED'; return; }
              tempPolicyId = clean(policyRes.json?.result?.id);
              if (!tempPolicyId) { result.access.error = 'SERVICE_AUTH_POLICY_CREATE_RESPONSE_INVALID'; return; }
              result.access.service_auth_policy_created = true;

              const check = await cf('GET', `/accounts/${accountId}/access/apps/${appId}/policies?per_page=100`);
              const ps = check.ok && Array.isArray(check.json?.result) ? check.json.result : [];
              const exact = ps.filter(x => clean(x?.id) === tempPolicyId && clean(x?.decision).toLowerCase() === 'non_identity' && serviceTokenIds(x).length === 1 && serviceTokenIds(x)[0] === tempTokenId).length === 1;
              if (!check.ok || !exact || ps.some(x => clean(x?.decision).toLowerCase() === 'bypass') || ps.some(broadAllow) || !ps.some(restrictiveHumanAllow)) {
                result.access.error = 'POST_CREATE_ACCESS_SAFETY_VERIFICATION_FAILED';
                return;
              }

              await sleep(30000);
              result.access.propagation_wait_completed = true;

              const wp = presence(await worker('/factory/diagnostics/webflow-connection', accessId, accessSecret, 'aurentara-webflow-connection-presence-v1'));
              result.webflow = {presence: wp, verify: null};
              if (wp.pass) {
                result.webflow.verify = webflowVerify(await worker('/factory/diagnostics/webflow-connection?verify=sites', accessId, accessSecret, 'aurentara-webflow-readonly-connection-v1'));
              }

              const ap = presence(await worker('/factory/diagnostics/activepieces-connection', accessId, accessSecret, 'aurentara-activepieces-connection-presence-v1'));
              result.activepieces = {presence: ap, verify: null};
              if (ap.pass) {
                result.activepieces.verify = activepiecesVerify(await worker('/factory/diagnostics/activepieces-connection?verify=projects', accessId, accessSecret, 'aurentara-activepieces-readonly-connection-v1'));
              }
            } catch {
              if (!result.access.error) result.access.error = 'UNEXPECTED_RUNTIME_FAILURE';
            } finally {
              if (tempPolicyId && appId) { try { await cf('DELETE', `/accounts/${accountId}/access/apps/${appId}/policies/${tempPolicyId}`); } catch {} }
              if (tempTokenId) { try { await cf('DELETE', `/accounts/${accountId}/access/service_tokens/${tempTokenId}`); } catch {} }

              if (appId) {
                try {
                  const p = await cf('GET', `/accounts/${accountId}/access/apps/${appId}/policies?per_page=100`);
                  const ps = p.ok && Array.isArray(p.json?.result) ? p.json.result : [];
                  result.access.temp_policy_remains = tempPolicyId ? ps.some(x => clean(x?.id) === tempPolicyId) : false;
                  result.access.bypass_count_after = ps.filter(x => clean(x?.decision).toLowerCase() === 'bypass').length;
                  result.access.broad_allow_count_after = ps.filter(broadAllow).length;
                  result.access.human_policy_preserved = result.access.human_policy_preserved && ps.some(restrictiveHumanAllow);
                } catch {}
              }
              if (tempTokenId) {
                try {
                  const s = await cf('GET', `/accounts/${accountId}/access/service_tokens?per_page=100`);
                  const ss = s.ok && Array.isArray(s.json?.result) ? s.json.result : [];
                  result.access.temp_token_remains = ss.some(x => clean(x?.id) === tempTokenId);
                } catch {}
              } else result.access.temp_token_remains = false;
              if (!tempPolicyId) result.access.temp_policy_remains = false;

              result.access.cleanup_verified = result.access.temp_token_remains === false && result.access.temp_policy_remains === false && result.access.human_policy_preserved === true && result.access.bypass_count_after === 0 && result.access.broad_allow_count_after === 0;
              console.log('FINAL_SANITIZED_RESULT=' + JSON.stringify(result));
            }
          }

          await main();
          NODE
          node --check /tmp/final-provider-closing-run.mjs

      - name: Execute exactly once after syntax gate
        shell: bash
        run: node /tmp/final-provider-closing-run.mjs
