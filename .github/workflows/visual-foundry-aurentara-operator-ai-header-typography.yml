name: Visual Foundry AURENTARA Operator AI Header Typography

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-operator-ai-header-typography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-ai-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_CANDIDATE: REFERENCE_EXTRACTED_EARTH_EXACT_PLACEMENT
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: T5
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: 1.32
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: 5.5
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: 600
      VISUAL_FOUNDRY_PANEL_HEADER_TYPOGRAPHY_CANDIDATE: OPERATOR_AI_HEADER_H4
      VISUAL_FOUNDRY_PANEL_HEADER_SCOPE: OPERATOR_AI
      VISUAL_FOUNDRY_PANEL_HEADER_TITLE_SIZE_PX: 14
      VISUAL_FOUNDRY_PANEL_HEADER_TITLE_WEIGHT: 700
      VISUAL_FOUNDRY_PANEL_HEADER_SUBTITLE_SIZE_PX: 9.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-operator-ai-header-H4
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
