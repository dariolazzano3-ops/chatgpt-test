name: Final Webflow Reconciliation Once

on:
  push:
    branches: [final-provider-closing-run-v1]
    paths:
      - '.github/workflows/final-provider-webflow-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-provider-closing-run-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Webflow L3 reconciliation
        run: node scripts/final-webflow-reconcile-once.mjs
      - run: npm install
      - name: Run provider regression
        run: npm run check:riosystems
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/webflow-staging-connection-evidence-v1.js src/remaining-provider-fast-lane-evidence-v1.js src/provider-activation-inventory.js src/provider-stack-v1.js src/web-provider-strategy.js scripts/remaining-provider-fast-lane-smoke.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Reconcile Webflow L3 staging connection evidence"
          git push origin HEAD:final-provider-closing-run-v1
