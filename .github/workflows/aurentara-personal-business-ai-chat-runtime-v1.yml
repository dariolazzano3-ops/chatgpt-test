name: AURENTARA Personal Business AI Chat Runtime V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-ai/**'
      - 'src/ai-factory-v1.js'
      - 'src/ai-provider-adapters-v1.js'
      - 'src/ai-prompt-registry-v1.js'
      - 'scripts/aurentara-personal-business-ai-chat-runtime-v1-smoke.mjs'
      - 'fixtures/aurentara/customer-chat-runtime-v1.json'
      - 'fixtures/aurentara/customer-ai-foundation-v1.json'
      - 'migrations/20260901_aurentara_customer_chat_runtime_v1.sql'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_CUSTOMER_CHAT_RUNTIME_V1.md'
      - '.github/workflows/aurentara-personal-business-ai-chat-runtime-v1.yml'

jobs:
  customer-chat-runtime-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check chat runtime
        run: |
          node --check src/customer-ai/chat-contracts-v1.js
          node --check src/customer-ai/chat-context-v1.js
          node --check src/customer-ai/chat-runtime-v1.js
          node --check scripts/aurentara-personal-business-ai-chat-runtime-v1-smoke.mjs
      - name: Run zero-cost synthetic chat runtime acceptance
        run: node scripts/aurentara-personal-business-ai-chat-runtime-v1-smoke.mjs
