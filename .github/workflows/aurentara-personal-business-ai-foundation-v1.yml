name: AURENTARA Personal Business AI Foundation V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-ai/**'
      - 'src/runtime-cost-ledger.js'
      - 'src/durable-runtime-store.js'
      - 'src/business-crm-model.js'
      - 'scripts/aurentara-personal-business-ai-foundation-v1-smoke.mjs'
      - 'fixtures/aurentara/customer-ai-foundation-v1.json'
      - 'migrations/20260901_aurentara_customer_ai_foundation_v1.sql'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_FOUNDATION_V1.md'
      - '.github/workflows/aurentara-personal-business-ai-foundation-v1.yml'

jobs:
  foundation-security-and-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check customer AI foundation
        run: |
          node --check src/customer-ai/contracts-v1.js
          node --check src/customer-ai/context-v1.js
          node --check src/customer-ai/cost-attribution-v1.js
          node --check src/customer-ai/foundation-v1.js
          node --check scripts/aurentara-personal-business-ai-foundation-v1-smoke.mjs
      - name: Run zero-cost synthetic foundation acceptance
        run: node scripts/aurentara-personal-business-ai-foundation-v1-smoke.mjs
