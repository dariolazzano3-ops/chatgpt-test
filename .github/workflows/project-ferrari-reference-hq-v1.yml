name: PROJECT FERRARI Reference HQ V1

on:
  push:
    branches:
      - factory/ferrari-reference-hq-v1
  pull_request:
    branches:
      - factory-control

permissions:
  contents: read

jobs:
  reference-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      - name: Reference HQ syntax
        run: |
          node --check src/operator-reference-hq-v1.js
          node --check scripts/project-ferrari-reference-hq-v1-smoke.mjs
          node --check scripts/project-ferrari-reference-hq-v1-browser.mjs

      - name: Reference HQ contract acceptance
        run: node scripts/project-ferrari-reference-hq-v1-smoke.mjs

      - name: Existing premium contract regression
        run: node scripts/project-ferrari-premium-masterdashboard-v1-smoke.mjs

      - name: Reference HQ desktop browser evidence
        run: node scripts/project-ferrari-reference-hq-v1-browser.mjs

      - name: Existing premium desktop and iPhone regression
        run: node scripts/project-ferrari-premium-masterdashboard-v1-browser.mjs

      - name: Existing human operator desktop regression
        run: node scripts/operator-human-ux-browser-v1.mjs

      - name: Existing iPhone retention regression
        run: node scripts/operator-final-human-ux-mobile-v1.mjs

      - name: Ferrari safety and integration regression
        run: |
          node scripts/operator-ai-global-access-v1-smoke.mjs
          node scripts/operator-project-workspace-reconciliation-v1-smoke.mjs
          node scripts/masterdashboard-gelato-integration-gate-v1-smoke.mjs
          node scripts/mission-safety-smoke.mjs
          node scripts/riosystems-integrated-regression-gate.mjs

      - name: Upload Reference 01 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-ferrari-reference-hq-v1-visual-evidence
          path: artifacts/project-ferrari-reference-hq-v1
          if-no-files-found: warn
