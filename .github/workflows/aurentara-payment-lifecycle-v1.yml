name: AURENTARA Payment Lifecycle V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/payment-lifecycle-v1.js'
      - 'src/customer-product/launch-readiness-v1.js'
      - 'scripts/aurentara-payment-lifecycle-v1-smoke.mjs'
      - 'scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs'
      - 'scripts/aurentara-production-activation-contracts-v1-smoke.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_PAYMENT_LIFECYCLE_V1.md'
      - '.github/workflows/aurentara-payment-lifecycle-v1.yml'

jobs:
  payment-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/payment-lifecycle-v1.js
          node --check src/customer-product/launch-readiness-v1.js
          node --check scripts/aurentara-payment-lifecycle-v1-smoke.mjs
      - name: Payment lifecycle acceptance
        run: node scripts/aurentara-payment-lifecycle-v1-smoke.mjs
      - name: Economics regression
        run: node scripts/aurentara-customer-economics-v1-smoke.mjs
      - name: Production activation contracts regression
        run: node scripts/aurentara-production-activation-contracts-v1-smoke.mjs
      - name: Launch readiness regression
        run: node scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
      - name: Mandatory customer red team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
