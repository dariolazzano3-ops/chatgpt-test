name: AURENTARA Customer Live Launch Gate Audit V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'evidence/aurentara/customer-production-live-state-v1.json'
      - 'src/customer-product/launch-gate-audit-v1.js'
      - 'scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs'
      - 'scripts/aurentara-customer-observability-evidence-v1-smoke.mjs'
      - 'scripts/aurentara-customer-launch-gate-audit-v1.mjs'
      - 'docs/AURENTARA_CUSTOMER_LIVE_LAUNCH_GATE_AUDIT_V1.md'
      - '.github/workflows/aurentara-customer-launch-gate-audit-v1.yml'
  push:
    branches: [factory-control]
    paths:
      - 'src/customer-product/launch-gate-audit-v1.js'
      - 'scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs'
      - 'scripts/aurentara-customer-observability-evidence-v1-smoke.mjs'
      - 'scripts/aurentara-customer-launch-gate-audit-v1.mjs'
      - '.github/workflows/aurentara-customer-launch-gate-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-launch-gate-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURENTARA_CUSTOMER_WORKER_SCRIPT: aurentara-customer-runtime
      AURENTARA_NOTIFICATION_WRITE_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install zero-cost verification tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/customer-product/launch-gate-audit-v1.js
          node --check scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
          node --check scripts/aurentara-customer-observability-evidence-v1-smoke.mjs
          node --check scripts/aurentara-customer-launch-gate-audit-v1.mjs
      - name: Observability evidence fail-closed acceptance
        run: node scripts/aurentara-customer-observability-evidence-v1-smoke.mjs
      - name: Mandatory Customer Red Team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
      - name: Read-only active deployment truth and closed serving route
        run: node scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs
      - name: Read-only native Observability notification policy verification
        run: node scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs
      - name: Fresh live Signal to Sink evidence
        run: node scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs
      - name: Live Cloudflare evidence aggregation
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Evidence-based Customer launch audit
        run: node scripts/aurentara-customer-launch-gate-audit-v1.mjs
