name: Gelato V63 Strawberry Static Private Preview
on:
  push:
    branches: [aurentara/gelato-strawberry-static-v63]
    paths: ['.github/workflows/gelato-strawberry-v63.yml']
permissions:
  contents: read
concurrency:
  group: gelato-strawberry-private-v63
  cancel-in-progress: false
jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source, isolation and image
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-strawberry-static-v63"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import re, json
          from pathlib import Path
          root=Path('projects/gelato-donatello-premium-v6')
          home=(root/'index.html').read_text()
          app=(root/'assets/js/app.js').read_text()
          catalog=(root/'getraenke/index.html').read_text()
          js=(root/'assets/js/components/discovery-drinks.js').read_text()
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['directory']=='./projects/gelato-donatello-premium-v6'
          assert not config['assets']['run_worker_first']
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          m=re.search(r'<a class="v26-discovery__card v26-discovery__card--shakes".*?</a>',home,re.S)
          assert m,'Shakes & Drinks card missing'
          card=m.group(0)
          assert 'href="/getraenke/"' in card
          assert card.count('<img ')==1
          assert 'src="/assets/images/drinks/erdbeer-shake.webp"' in card
          assert 'data-discovery-drinks' not in card
          assert 'data-drink-layer' not in card
          assert 'Milchshakes und sonstige Eisgetränke' in card
          assert 'initDiscoveryDrinks' not in app
          img=root/'assets/images/drinks/erdbeer-shake.webp'
          assert img.is_file() and img.stat().st_size>50000
          assert catalog.count('v29-drinks-catalog__card')==6
          assert all(x in catalog for x in ['Erdbeer-Shake','Vanille-Shake','Schoko-Shake','Orange Flip','Eiskaffee','Eisschokolade'])
          assert len(re.findall(r'src: "/assets/images/drinks/',js))==6
          for img_name in ['erdbeer-shake','vanille-shake','schoko-shake','orange-flip','eiskaffee','eisschokolade']:
            assert (root/f'assets/images/drinks/{img_name}.webp').is_file()
          print('PASS static original drink card; full six-drink catalog; noindex; private worker config')
          PY
          node --check projects/gelato-donatello-premium-v6/assets/js/app.js
      - name: Real browser mobile and desktop QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v63-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gelato-v63-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gelato-v63-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              const card=page.locator('.v26-discovery__card--shakes');
              await card.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>{
                const img=document.querySelector('.v26-discovery__card--shakes>img');
                return img?.complete && img.naturalWidth>=800;
              });
              assert.strictEqual(await card.locator('img').count(),1);
              assert.strictEqual(await card.getAttribute('href'),'/getraenke/');
              assert((await card.locator('img').getAttribute('src')).endsWith('erdbeer-shake.webp'));
              assert((await card.innerText()).includes('Milchshakes und sonstige Eisgetränke'));
              await page.waitForTimeout(4200);
              assert((await card.locator('img').getAttribute('src')).endsWith('erdbeer-shake.webp'));
              const bounds=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,inner:innerWidth}));
              assert(bounds.scroll<=bounds.inner+3,'horizontal overflow: '+JSON.stringify(bounds));
              await card.screenshot({path:'visual-evidence/strawberry-card-'+label+'.png',animations:'disabled'});
              await page.goto('http://127.0.0.1:43119/getraenke/',{waitUntil:'domcontentloaded'});
              assert.strictEqual(await page.locator('.v29-drinks-catalog__card').count(),6);
              assert((await page.locator('main').innerText()).includes('Orange Flip'));
              assert.deepStrictEqual(errors,[],'runtime errors: '+errors.join('; '));
              console.log('PASS',label,'stable photo, subtitle, destination, 6 drinks and no overflow');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Attach QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v63-strawberry-responsive
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm ONLY private preview Worker target
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$status" = "200"
      - name: Deploy private Gelato Worker preview ONLY
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm Cloudflare deployment activation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v63-deploy.json
          node -e "const r=require('/tmp/gelato-v63-deploy.json');const d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('GELATO V63 PRIVATE DEPLOY PASS',d.id)"
