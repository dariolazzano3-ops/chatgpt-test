name: AURENTARA Customer Zero Cost Runtime Live V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/customer-runtime-entry-v1.js'
      - 'wrangler.customer-production.jsonc'
      - 'scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs'
      - 'scripts/aurentara-customer-dedicated-worker-v1-smoke.mjs'
      - 'scripts/aurentara-customer-live-closure-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs'
      - 'scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs'
      - 'scripts/aurentara-customer-launch-gate-audit-v1.mjs'
      - 'customer-runtime-activation-requests/aurentara-customer-runtime-v1.json'
      - '.github/workflows/aurentara-customer-zero-cost-runtime-live-v1.yml'
  push:
    branches: [factory-control]
    paths:
      - 'customer-runtime-activation-requests/aurentara-customer-runtime-v1.json'

permissions:
  contents: read

concurrency:
  group: aurentara-customer-zero-cost-runtime-live-v1
  cancel-in-progress: false

env:
  REQUEST_FILE: customer-runtime-activation-requests/aurentara-customer-runtime-v1.json
  CUSTOMER_WORKER_NAME: aurentara-customer-runtime
  CUSTOMER_WORKER_URL: https://aurentara-customer-runtime.gelato-donatello-dario-a5a5376c.workers.dev
  AURENTARA_NOTIFICATION_WRITE_ALLOWED: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and activation guard
        run: |
          node --check src/customer-product/customer-runtime-entry-v1.js
          node --check scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs
          node --check scripts/aurentara-customer-dedicated-worker-v1-smoke.mjs
          node --check scripts/aurentara-customer-live-closure-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs
          node --check scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs
          node scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs "$REQUEST_FILE"
      - name: Dedicated Customer Worker routing isolation
        run: node scripts/aurentara-customer-dedicated-worker-v1-smoke.mjs
      - name: Customer Red Team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
      - name: Production runtime contract regression
        run: |
          node scripts/aurentara-customer-production-runtime-activation-v1-smoke.mjs
          node scripts/aurentara-production-live-bindings-v1-smoke.mjs
          node scripts/aurentara-production-account-surface-v1-smoke.mjs
      - name: Dedicated Customer Worker bundle dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.customer-production.jsonc

  verify-current-live:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURENTARA_CUSTOMER_WORKER_SCRIPT: aurentara-customer-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install zero-cost verification tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify active deployment truth and closed route
        run: node scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs
      - name: Verify native notification policy read-only
        run: node scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs
      - name: Verify live Signal to Sink
        run: node scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs
      - name: Verify current dedicated Worker live bindings
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Propagation-safe live closure proof
        run: node scripts/aurentara-customer-live-closure-v1.mjs
      - name: Recompute evidence-based launch readiness
        run: node scripts/aurentara-customer-launch-gate-audit-v1.mjs

  live-activate:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURENTARA_CUSTOMER_WORKER_SCRIPT: aurentara-customer-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install zero-cost verification tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify activation credentials and guard again
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs "$REQUEST_FILE"
      - name: Pre-activation Cloudflare read-only evidence
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Deploy dedicated Customer Worker with Surface OFF
        run: npx --yes wrangler@4 deploy --config wrangler.customer-production.jsonc
      - name: Post-activation active deployment truth and closed route
        run: node scripts/aurentara-customer-cloudflare-deployment-truth-v1.mjs
      - name: Verify native notification policy read-only
        run: node scripts/aurentara-customer-cloudflare-observability-notification-v1.mjs
      - name: Post-activation live Signal to Sink
        run: node scripts/aurentara-customer-cloudflare-signal-sink-e2e-v1.mjs
      - name: Post-activation Cloudflare evidence aggregation
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Verify live bindings without exposing values
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('/tmp/aurentara-cloudflare-live-evidence.json','utf8'));
          const required = [
            'worker_settings_verified',
            'worker_present',
            'customer_surface_off_live',
            'customer_project_binding_live',
            'operator_customer_project_separation_live',
            'distributed_rate_binding_live',
            'official_retrieval_binding_live',
            'official_source_fetch_verified',
            'observability_binding_live',
            'alert_signal_path_verified',
            'notification_policy_verified'
          ];
          for (const key of required) if (e[key] !== true) throw new Error(`LIVE_BINDING_NOT_VERIFIED:${key}`);
          if (e.external_write !== false || e.binding_values_returned !== false || e.token_returned !== false) throw new Error('LIVE_EVIDENCE_REDACTION_FAILED');
          NODE
      - name: Verify dedicated runtime remains closed
        run: node scripts/aurentara-customer-live-closure-v1.mjs
      - name: Recompute evidence-based launch readiness
        run: node scripts/aurentara-customer-launch-gate-audit-v1.mjs
