name: AURENTARA Customer Zero Cost Runtime Live V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/customer-runtime-entry-v1.js'
      - 'wrangler.customer-production.jsonc'
      - 'scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs'
      - 'customer-runtime-activation-requests/aurentara-customer-runtime-v1.json'
      - '.github/workflows/aurentara-customer-zero-cost-runtime-live-v1.yml'
  push:
    branches: [factory-control]
    paths:
      - 'customer-runtime-activation-requests/aurentara-customer-runtime-v1.json'

permissions:
  contents: read

concurrency:
  group: aurentara-customer-zero-cost-runtime-live-v1
  cancel-in-progress: false

env:
  REQUEST_FILE: customer-runtime-activation-requests/aurentara-customer-runtime-v1.json
  CUSTOMER_WORKER_NAME: aurentara-customer-runtime
  CUSTOMER_WORKER_URL: https://aurentara-customer-runtime.gelato-donatello-dario-a5a5376c.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and activation guard
        run: |
          node --check src/customer-product/customer-runtime-entry-v1.js
          node --check scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs
          node scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs "$REQUEST_FILE"
      - name: Customer Red Team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
      - name: Production runtime contract regression
        run: |
          node scripts/aurentara-customer-production-runtime-activation-v1-smoke.mjs
          node scripts/aurentara-production-live-bindings-v1-smoke.mjs
          node scripts/aurentara-production-account-surface-v1-smoke.mjs
      - name: Dedicated Customer Worker bundle dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.customer-production.jsonc

  live-activate:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURENTARA_CUSTOMER_WORKER_SCRIPT: aurentara-customer-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify activation credentials and guard again
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/aurentara-customer-zero-cost-runtime-live-v1-guard.mjs "$REQUEST_FILE"
      - name: Pre-activation Cloudflare read-only evidence
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Deploy dedicated Customer Worker with Surface OFF
        run: npx --yes wrangler@4 deploy --config wrangler.customer-production.jsonc
      - name: Post-activation Cloudflare read-only evidence
        run: node scripts/aurentara-customer-cloudflare-live-gate-audit-v1.mjs
      - name: Verify live bindings without exposing values
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('/tmp/aurentara-cloudflare-live-evidence.json','utf8'));
          const required = [
            'worker_settings_verified',
            'worker_present',
            'customer_surface_off_live',
            'customer_project_binding_live',
            'operator_customer_project_separation_live',
            'distributed_rate_binding_live',
            'official_retrieval_binding_live',
            'official_source_fetch_verified'
          ];
          for (const key of required) if (e[key] !== true) throw new Error(`LIVE_BINDING_NOT_VERIFIED:${key}`);
          if (e.external_write !== false || e.binding_values_returned !== false || e.token_returned !== false) throw new Error('LIVE_EVIDENCE_REDACTION_FAILED');
          NODE
      - name: Verify dedicated runtime remains closed
        run: |
          set -euo pipefail
          CUSTOMER_STATUS=$(curl -sS -o /tmp/customer.json -w '%{http_code}' "$CUSTOMER_WORKER_URL/customer/api/manifest")
          test "$CUSTOMER_STATUS" = "404"
          node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/customer.json','utf8')); if(b.error!=='CUSTOMER_SURFACE_NOT_ACTIVATED'||b.public_active!==false) process.exit(1)"
          FACTORY_STATUS=$(curl -sS -o /tmp/factory.json -w '%{http_code}' "$CUSTOMER_WORKER_URL/factory/diagnostics")
          test "$FACTORY_STATUS" = "404"
          node -e "const b=JSON.parse(require('fs').readFileSync('/tmp/factory.json','utf8')); if(b.error!=='AURENTARA_CUSTOMER_RUNTIME_ROUTE_NOT_FOUND'||b.public_active!==false) process.exit(1)"
          OPERATOR_STATUS=$(curl -sS -o /tmp/operator.json -w '%{http_code}' "$CUSTOMER_WORKER_URL/operator")
          test "$OPERATOR_STATUS" = "404"
      - name: Recompute evidence-based launch readiness
        run: node scripts/aurentara-customer-launch-gate-audit-v1.mjs
