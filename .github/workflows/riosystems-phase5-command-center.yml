name: RIOSYSTEMS Phase 5 Command Center

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/command-center.js'
      - 'src/command-center-api.js'
      - 'src/phase5-readiness.js'
      - 'scripts/phase5-command-center-smoke.mjs'
      - 'docs/RIOSYSTEMS-PHASE-5-COMPLETE.md'
      - '.github/workflows/riosystems-phase5-command-center.yml'

jobs:
  validate-phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check src/command-center.js
          node --check src/command-center-api.js
          node --check src/phase5-readiness.js
          node --check scripts/phase5-command-center-smoke.mjs
      - name: Phase 5 command center smoke
        run: node scripts/phase5-command-center-smoke.mjs
      - name: Phase 4 readiness regression
        run: node scripts/phase4-provider-integrations-smoke.mjs
      - name: Phase 3 readiness regression
        run: node scripts/phase3-execution-delivery-smoke.mjs
      - name: Phase 2 readiness regression
        run: node scripts/phase2-readiness.mjs
      - name: Phase 1 readiness regression
        run: node scripts/phase1-readiness.mjs
      - name: V5 readiness regression
        run: node scripts/factory-v50-readiness.mjs
