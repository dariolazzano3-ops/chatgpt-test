name: PROJECT FERRARI Build-Time System-Wide Preview Bundle V3

on:
  push:
    branches:
      - factory/project-ferrari-system-wide-preview-access-v2
      - factory/project-ferrari-preview-discovery-scope-route-fix-v2
      - factory/project-ferrari-buildtime-preview-bundle-v3
      - factory-control

permissions:
  contents: read

concurrency:
  group: project-ferrari-buildtime-preview-bundle-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Generate system-wide project preview registry
        run: npm run preview:registry
      - name: Syntax
        run: |
          node --check src/project-preview-access-v1.js
          node --check src/generated-project-preview-registry-v1.js
          node --check scripts/generate-project-preview-registry-v1.mjs
          node --check src/operator-project-preview-access-v1.js
          node --check scripts/project-ferrari-project-scoped-preview-access-v1-smoke.mjs
          node --check scripts/project-ferrari-project-scoped-preview-access-v1-browser.mjs
      - name: Build-time system-wide preview backend acceptance
        run: node scripts/project-ferrari-project-scoped-preview-access-v1-smoke.mjs
      - name: Build-time system-wide preview Desktop and Mobile
        run: node scripts/project-ferrari-project-scoped-preview-access-v1-browser.mjs
      - name: Existing Dashboard Human Input Closure backend regression
        run: node scripts/project-ferrari-dashboard-human-input-closure-v1-smoke.mjs
      - name: Existing Dashboard Human Input Closure Desktop and Mobile regression
        run: node scripts/project-ferrari-dashboard-human-input-closure-v1-browser.mjs
      - name: Existing Gelato Auto Customer Input Closure regression
        run: node scripts/gelato-ferrari-auto-customer-input-closure-evidence-v1-smoke.mjs
      - name: Existing Entity-Aware evidence regression
        run: node scripts/gelato-ferrari-entity-aware-multi-source-evidence-v1-smoke.mjs
      - name: Existing Project Source Intake acceptance
        run: node scripts/project-source-intake-v1-acceptance.mjs
      - name: Existing Gelato Ferrari dogfood regression
        run: node scripts/gelato-ferrari-realistic-input-dogfood-v1.mjs
      - name: Safety
        run: |
          echo "Production deploy: false"
          echo "Public launch: false"
          echo "DNS changed: false"
          echo "Billing changed: false"
          echo "Paid overflow: false"
          echo "Paid provider calls: 0"
          echo "New preview engine: false"
          echo "New provider: false"
