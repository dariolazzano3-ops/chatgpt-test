name: RIOSYSTEMS Operator Dashboard Staging Deploy Once

on:
  push:
    branches: [factory-control]
    paths:
      - '.github/workflows/riosystems-operator-dashboard-staging-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy-staging-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_STAGING_DEPLOY_APPROVED: 'true'
      RIOSYSTEMS_ZERO_COST_CONFIRMED: ${{ vars.RIOSYSTEMS_CLOUDFLARE_ZERO_COST_CONFIRMED }}
      RIOSYSTEMS_STAGING_CONFIRMATION: 'DEPLOY_RIOSYSTEMS_STAGING_ZERO_COST'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact approved baseline and one-time change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "factory-control"
          test "$(git rev-parse HEAD^1)" = "643d4f543dfaec6ff35d565387191779f3160f5e"
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          test "$CHANGED" = ".github/workflows/riosystems-operator-dashboard-staging-deploy-once.yml"
          test "$RIOSYSTEMS_ZERO_COST_CONFIRMED" = "true"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install
      - name: Guard smoke
        shell: bash
        run: |
          env -u RIOSYSTEMS_STAGING_DEPLOY_APPROVED \
              -u RIOSYSTEMS_ZERO_COST_CONFIRMED \
              -u RIOSYSTEMS_STAGING_CONFIRMATION \
              node scripts/staging-deploy-guard-smoke.mjs
      - name: Staging dry-run
        run: npm run deploy:staging:dry-run
      - name: Deploy isolated zero-cost staging worker
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:staging 2>&1 | tee /tmp/riosystems-deploy.log
          npx wrangler deployments list --env staging 2>&1 | tee /tmp/riosystems-deployments.log
          URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/riosystems-deploy.log | tail -n 1 || true)"
          test -n "$URL"
          STATUS="$(curl -sS -L --max-redirs 0 -o /tmp/operator-response -w '%{http_code}' "$URL/operator" || true)"
          test "$STATUS" != "000"
          test "$STATUS" != "200"
          {
            echo "### RIOSYSTEMS staging deployment"
            echo "- Worker URL: $URL"
            echo "- /operator unauthenticated HTTP status: $STATUS"
            echo "- Public dashboard exposure: blocked"
            echo "- Production deploy: false"
            echo "- External writes: false"
          } >> "$GITHUB_STEP_SUMMARY"
