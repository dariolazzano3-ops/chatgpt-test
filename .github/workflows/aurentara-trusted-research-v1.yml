name: AURENTARA Trusted Research Safety V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-ai/**'
      - 'scripts/aurentara-trusted-research-v1-smoke.mjs'
      - 'fixtures/aurentara/trusted-research-v1.json'
      - '.github/workflows/aurentara-trusted-research-v1.yml'

jobs:
  trusted-research-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-ai/trusted-research-v1.js
          node --check src/customer-ai/trusted-runtime-v1.js
          node --check scripts/aurentara-trusted-research-v1-smoke.mjs
      - name: Zero-cost trusted research acceptance
        run: node scripts/aurentara-trusted-research-v1-smoke.mjs
