name: Gelato discovery V26 private preview one-shot
on:
  push:
    branches: [aurentara/gelato-discovery-shakes-v26]
    paths:
      - .github/workflows/gelato-discovery-private-v26.yml
permissions:
  contents: read
concurrency:
  group: gelato-discovery-private-v26
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Scope and content QA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-discovery-shakes-v26"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('projects/gelato-donatello-premium-v6')
          html=(root/'index.html').read_text()
          css=(root/'assets/css/style.css').read_text()
          svg=(root/'assets/images/editorial/shakes-trio.svg').read_text()
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          a=html.index('<section class="v26-discovery"')
          b=html.index('<section class="v6-cup-story"',a)
          section=html[a:b]
          assert html.count('<section class="v26-discovery"')==1
          assert 'class="v6-showcase"' not in html
          assert section.count('class="v26-discovery__card ')==3
          assert 'href="/eisbecher/"' in section and 'href="/eissorten/"' in section and 'href="#v26-shakes"' in section
          assert 'id="v26-shakes"' in section and 'href="/kontakt/"' in section
          assert 'Erdbeer · Vanille · Schoko' in section
          assert (root/'assets/images/cups/fruechte-becher.webp').is_file()
          assert (root/'assets/images/flavors/pistazie.webp').is_file()
          assert '<svg' in svg and '</svg>' in svg and svg.count('<g')>=3
          assert '.v26-discovery__grid{' in css and '@media(max-width:700px)' in css
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['run_worker_first'] is False
          assert (root/'_headers').read_text().find('X-Robots-Tag: noindex')!=-1
          print('PASS: original surrounding site preserved; three links, shake note, images, CSS and private worker scope verified')
          PY
      - name: Visual QA on iPhone and desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gd-v26-qa-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gd-v26-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert = require('assert');
          const {chromium} = require('/tmp/gd-v26-browser/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height] of [['iphone',390,844],['desktop',1440,900]]) {
              const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              const section = page.locator('.v26-discovery');
              await section.scrollIntoViewIfNeeded();
              await section.locator('img').evaluateAll(async images=>{await Promise.all(images.map(img=>img.decode().catch(()=>{})))});
              const info = await section.evaluate(sec => {
                const boxes=[...sec.querySelectorAll('.v26-discovery__card')].map(e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right}});
                const images=[...sec.querySelectorAll('.v26-discovery__card img')].map(e=>({loaded:e.complete&&e.naturalWidth>0,src:e.getAttribute('src')}));
                return {heading:sec.querySelector('h2')?.textContent,boxes,images,overflow:sec.scrollWidth>sec.clientWidth+3};
              });
              console.log(label,JSON.stringify(info));
              assert.strictEqual(info.boxes.length,3);
              assert(info.images.every(i=>i.loaded),'Some category images failed to load');
              assert(info.boxes.every(b=>b.width>100&&b.right<=width+4),'Category card clips outside viewport');
              assert(!info.overflow,'Section has horizontal overflow');
              assert(Math.abs(info.boxes[0].y-info.boxes[1].y)<5,'First categories do not align');
              if(label==='iphone')assert(info.boxes[2].y>info.boxes[0].y+40,'Shake card must be second row on mobile');
              else assert(Math.abs(info.boxes[0].y-info.boxes[2].y)<5,'Desktop cards must share a row');
              await section.screenshot({path:'visual-evidence/discovery-'+label+'.png',animations:'disabled'});
              if(label==='iphone'){
                await page.locator('a.v26-discovery__card--shakes').click();
                assert(page.url().endsWith('#v26-shakes'));
              }
              await page.close();
            }
            await browser.close();
            console.log('PASS: responsive category cards, loaded images, navigation and screenshots');
          })().catch(err=>{console.error('VISUAL QA FAIL',err);process.exit(1)});
          JS
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-discovery-v26-qa
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Private Worker preflight
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
          echo 'Existing private Worker deployment endpoint accessible'
      - name: Deploy private Gelato static assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm private deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gd-v26-deployment.json
          node -e "const r=require('/tmp/gd-v26-deployment.json'),d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('Private preview DEPLOY PASS',d.id)"
