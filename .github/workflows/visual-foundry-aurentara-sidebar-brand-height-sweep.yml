name: Visual Foundry AURENTARA Sidebar Brand Height Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-sidebar-brand-height-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidebar-brand-height:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: B7
            fixed_height: 148
          - id: B8
            fixed_height: 150
          - id: B9
            fixed_height: 152
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_CANDIDATE: REFERENCE_EXTRACTED_EARTH_EXACT_PLACEMENT
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: T5
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: 1.32
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: 5.5
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: 600
      VISUAL_FOUNDRY_SIDEBAR_BRAND_TYPOGRAPHY_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_SIDEBAR_BRAND_TITLE_SIZE_PX: 16.5
      VISUAL_FOUNDRY_SIDEBAR_BRAND_TITLE_LETTER_SPACING_EM: 0.22
      VISUAL_FOUNDRY_SIDEBAR_BRAND_TAGLINE_SIZE_PX: 7.5
      VISUAL_FOUNDRY_SIDEBAR_BRAND_TAGLINE_WIDTH_PX: 132
      VISUAL_FOUNDRY_SIDEBAR_BRAND_FIXED_HEIGHT_PX: ${{ matrix.fixed_height }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-sidebar-brand-height-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
