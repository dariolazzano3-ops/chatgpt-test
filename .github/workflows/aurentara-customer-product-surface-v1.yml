name: AURENTARA Customer Product Surface V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/**'
      - 'src/customer-ai/**'
      - 'src/entry.js'
      - 'scripts/aurentara-customer-product-surface-v1-smoke.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_CUSTOMER_PRODUCT_SURFACE_V1.md'
      - '.github/workflows/aurentara-customer-product-surface-v1.yml'

jobs:
  customer-surface-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/shell-v1.js
          node --check src/customer-product/surface-v1.js
          node --check src/entry.js
          node --check scripts/aurentara-customer-product-surface-v1-smoke.mjs
      - name: Zero-cost customer surface acceptance
        run: node scripts/aurentara-customer-product-surface-v1-smoke.mjs
