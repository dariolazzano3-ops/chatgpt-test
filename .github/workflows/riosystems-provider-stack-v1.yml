name: RIOSYSTEMS Provider Stack v1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/provider-stack-v1.js'
      - 'src/cloudflare-pages-staging-evidence.js'
      - 'src/cloudflare-live-read-evidence.js'
      - 'src/business-live-read-evidence.js'
      - 'scripts/provider-stack-v1-smoke.mjs'
      - 'docs/RIOSYSTEMS-PROVIDER-STACK-V1.md'
      - '.github/workflows/riosystems-provider-stack-v1.yml'
      - 'src/web-provider-strategy.js'
      - 'src/automation-provider-strategy.js'
      - 'src/ai-provider-strategy.js'
      - 'src/business-provider-strategy.js'
      - 'src/execution-adapters.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/provider-stack-v1.js
          node --check scripts/provider-stack-v1-smoke.mjs
      - name: Provider stack v1 smoke
        run: node scripts/provider-stack-v1-smoke.mjs
      - name: Web provider regression
        run: node scripts/web-provider-selection-smoke.mjs
      - name: Automation provider regression
        run: node scripts/automation-provider-selection-smoke.mjs
      - name: AI provider regression
        run: node scripts/ai-provider-selection-smoke.mjs
      - name: Business provider regression
        run: node scripts/business-provider-selection-smoke.mjs
      - name: Staging release budget regression
        run: node scripts/staging-release-budget-control-smoke.mjs
      - name: Real provider bridge regression
        run: node scripts/real-provider-bridge-smoke.mjs
      - name: Phase 6 regression
        run: node scripts/riosystems-phase6-smoke.mjs
      - name: V5 regression
        run: node scripts/factory-v50-readiness.mjs
