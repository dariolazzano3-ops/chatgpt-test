name: Gelato V32 owner product photos private preview
on:
  push:
    branches: [aurentara/gelato-product-images-v32]
    paths: [.github/workflows/gelato-v32-photos-private.yml]
permissions:
  contents: read
concurrency:
  group: gelato-v32-photos-private
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Asset-integrity and site-scope checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aurentara/gelato-product-images-v32'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('projects/gelato-donatello-premium-v6')
          cups=['raffaello-becher','schneemann-becher','orange-flip-becher','roche-becher','smarties-becher']
          details={'raffaello-becher':'970fe23c','schneemann-becher':'d7e19b58','orange-flip-becher':'b6ff1cc9','roche-becher':'1094761a','smarties-becher':'ca6d2a56','schoko-shake':'1386be95'}
          for name in cups+['schoko-shake']:
            path=root/('assets/images/cups/' if name in cups else 'assets/images/drinks/')/(name+'.webp')
            assert path.is_file() and path.stat().st_size>70000, name
            raw=path.read_bytes()
            assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',name
            print('ASSET_PASS',name,len(raw),hashlib.sha256(raw).hexdigest()[:10])
          script=(root/'assets/js/components/discovery-cups.js').read_text()
          cupPage=(root/'eisbecher/index.html').read_text()
          drinks=(root/'getraenke/index.html').read_text()
          homepage=(root/'index.html').read_text()
          paths=re.findall(r'src: "(/assets/images/cups/[^"]+)"',script)
          assert len(paths)==21 and len(set(paths))==21, '21 distinct Eisbecher slideshow sources required'
          for src in paths: assert (root/src.lstrip('/')).is_file(),src
          for name in cups: 
            assert '/assets/images/cups/'+name+'.webp' in cupPage,name
            assert '/assets/images/cups/'+name+'.webp' in script,name
          assert drinks.count('class="v29-drinks-catalog__card"')==5
          assert drinks.count('/assets/images/drinks/schoko-shake.webp')==1
          assert 'Erdbeer-Shake' in drinks and 'Vanille-Shake' in drinks and 'Schoko-Shake' in drinks
          assert homepage.count('data-discovery-cups')==1 and 'const TICK_MS = 2000;' in script
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['run_worker_first']==False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          print('PASS: 21 Eisbecher slideshow images, 5 new photo gallery items, 5 drinks, static privacy gate')
          PY
      - name: Automated mobile and desktop visual checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v32-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gelato-v32-playwright --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('/tmp/gelato-v32-playwright/node_modules/playwright');
          const added=['raffaello-becher','schneemann-becher','orange-flip-becher','roche-becher','smarties-becher'];
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              for(const section of ['eisbecher','getraenke']){
                const page=await browser.newPage({viewport:{width,height}});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:43119/'+section+'/',{waitUntil:'domcontentloaded'});
                const gallery=section==='eisbecher'?page.locator('#becher-fuer-jeden-geschmack'):page.locator('#getraenke-auswahl');
                await gallery.scrollIntoViewIfNeeded();
                const imgs=gallery.locator('img');
                if(section==='eisbecher')assert.equal(await imgs.count(),5,'expected five owner supplied cups');
                else assert.equal(await imgs.count(),5,'expected five drinks');
                for(let k=0;k<await imgs.count();k++){
                  await imgs.nth(k).scrollIntoViewIfNeeded();
                  await imgs.nth(k).evaluate(async img=>{if(img.decode)await img.decode().catch(()=>{})});
                }
                const values=await gallery.evaluate(el=>({width:el.clientWidth,scroll:el.scrollWidth,photos:[...el.querySelectorAll('img')].map(x=>({src:x.getAttribute('src'),ok:x.complete&&x.naturalWidth>0}))}));
                assert(values.photos.every(p=>p.ok),'undecoded image: '+JSON.stringify(values));
                assert(values.scroll<=values.width+5,'horizontal gallery overflow: '+JSON.stringify(values));
                if(section==='eisbecher')for(const item of added)assert(values.photos.some(p=>p.src.includes(item)),'missing '+item);
                else assert(values.photos.some(p=>p.src.includes('schoko-shake')),'missing schoko shake');
                await gallery.screenshot({path:'visual-evidence/'+section+'-'+label+'.png',animations:'disabled'});
                assert.deepEqual(errors,[],'page script errors');
                console.log('VISUAL_PASS',section,label,values.photos.length);
                await page.close();
              }
              const home=await browser.newPage({viewport:{width,height}});
              await home.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
              const card=home.locator('[data-discovery-cups]');
              await card.scrollIntoViewIfNeeded();
              const first=await card.locator('img.is-active').getAttribute('src');
              await home.waitForFunction((previous)=>document.querySelector('[data-discovery-cups] img.is-active')?.getAttribute('src')!==previous,first,{timeout:7500});
              assert.notEqual(await card.locator('img.is-active').getAttribute('src'),first);
              console.log('SLIDESHOW_PASS',label,'21 configured photos, active swap checked');
              await home.close();
            }
            await browser.close();
          })().catch(e=>{console.error('V32 QA FAILED',e);process.exit(1)});
          JS
      - name: Retain screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v32-eisbecher-and-shakes-qa
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify protected Worker target
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
      - name: Deploy private Gelato preview only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gd-v32-verified.json
          node -e "const d=require('/tmp/gd-v32-verified.json');const x=d.result?.deployments?.[0];if(!d.success||!x?.versions?.some(v=>v.percentage===100))process.exit(1);console.log('CLOUDFLARE_DEPLOY_PASS',x.id)"
