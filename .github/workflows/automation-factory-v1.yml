name: Automation Factory V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/automation-v1/**'
      - 'scripts/automation-factory-v1-smoke.mjs'
      - 'docs/AUTOMATION-FACTORY-V1.md'
      - '.github/workflows/automation-factory-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/automation-v1/manifest.js
          node --check src/automation-v1/contracts.js
          node --check src/automation-v1/planner.js
          node --check src/automation-v1/router.js
          node --check src/automation-v1/approval.js
          node --check src/automation-v1/idempotency.js
          node --check src/automation-v1/recovery.js
          node --check src/automation-v1/observability.js
          node --check src/automation-v1/adapters.js
          node --check src/automation-v1/delivery.js
          node --check src/automation-v1/runtime.js
          node --check src/automation-v1/index.js
          node --check scripts/automation-factory-v1-smoke.mjs
      - name: Automation Factory V1 acceptance
        run: node scripts/automation-factory-v1-smoke.mjs
      - name: Existing Automation Factory regression
        run: node scripts/automation-factory-smoke.mjs
      - name: Existing Automation Executor regression
        run: node scripts/automation-executor-smoke.mjs
      - name: Existing external actions regression
        run: node scripts/automation-external-actions-smoke.mjs
      - name: Provider hierarchy regression
        run: node scripts/automation-provider-selection-smoke.mjs
      - name: Make staging bridge regression
        run: node scripts/make-staging-bridge-smoke.mjs
      - name: Make staging execution regression
        run: node scripts/make-staging-execution-runner-smoke.mjs
      - name: Make to Supabase executor regression
        run: node scripts/make-supabase-lead-bridge-executor-smoke.mjs
