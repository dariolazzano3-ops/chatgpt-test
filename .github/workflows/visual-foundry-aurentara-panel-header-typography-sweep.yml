name: Visual Foundry AURENTARA Panel Header Typography Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-panel-header-typography-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-header-typography:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: H1
            title_size: 14
            title_weight: 650
            subtitle_size: 9
          - id: H2
            title_size: 15
            title_weight: 650
            subtitle_size: 9.5
          - id: H3
            title_size: 16
            title_weight: 650
            subtitle_size: 10
          - id: H4
            title_size: 14
            title_weight: 700
            subtitle_size: 9.5
          - id: H5
            title_size: 15
            title_weight: 700
            subtitle_size: 10
          - id: H6
            title_size: 16
            title_weight: 700
            subtitle_size: 10.5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_CANDIDATE: REFERENCE_EXTRACTED_EARTH_EXACT_PLACEMENT
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: T5
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: 1.32
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: 5.5
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: 600
      VISUAL_FOUNDRY_PANEL_HEADER_TYPOGRAPHY_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_PANEL_HEADER_TITLE_SIZE_PX: ${{ matrix.title_size }}
      VISUAL_FOUNDRY_PANEL_HEADER_TITLE_WEIGHT: ${{ matrix.title_weight }}
      VISUAL_FOUNDRY_PANEL_HEADER_SUBTITLE_SIZE_PX: ${{ matrix.subtitle_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-panel-header-typography-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
