name: Gelato Eisbecher heartbeat V28 private preview
on:
  push:
    branches: [aurentara/gelato-eisbecher-pulse-v28]
    paths: [.github/workflows/gelato-cups-heartbeat-v28.yml]
permissions:
  contents: read
concurrency:
  group: gelato-eisbecher-heartbeat-v28
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Source and private scope QA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aurentara/gelato-eisbecher-pulse-v28'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('projects/gelato-donatello-premium-v6')
          html=(root/'index.html').read_text()
          app=(root/'assets/js/app.js').read_text()
          script=(root/'assets/js/components/discovery-cups.js').read_text()
          hero=(root/'assets/js/components/discovery-cups.js').read_text()
          css=(root/'assets/css/style.css').read_text()
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert html.count('data-discovery-cups')==1 and html.count('data-cup-layer=')==2
          assert html.count('class="v26-discovery__card ')==3
          assert html.count('href="/eissorten/"')>=1 and html.count('href="#v26-shakes"')==1
          assert 'initDiscoveryCups();' in app and 'const FLAVORS' in hero
          assert len(re.findall(r'src: "/assets/images/cups/',hero))==6
          assert 'const TICK_MS = 2000;' in script
          assert 'v28-cup-frame' in css and 'v27-gelato-heartbeat' in css and 'prefers-reduced-motion:reduce' in css
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['run_worker_first'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          paths=re.findall(r'src: "(/assets/images/cups/[^"]+)"',hero)
          for path in paths: assert (root/path.lstrip('/')).is_file(),path
          print('PASS: 6 verified Eisbecher assets, 2 image layers, 2-sec cadence, private target & reduced-motion safeguards')
          PY
      - name: iPhone and desktop transition QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gd-v28-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gd-v28-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gd-v28-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [name,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
              const card=page.locator('[data-discovery-cups]');
              await card.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('[data-discovery-cups] img.is-active')?.complete);
              const first=await card.locator('img.is-active').getAttribute('src');
              assert(first?.includes('fruechte-becher.webp'),first);
              const t=Date.now();
              await page.waitForFunction(()=>document.querySelector('[data-discovery-cups] img.is-active')?.getAttribute('src')?.includes('erdbeer-becher.webp'),{},{timeout:8000});
              const elapsed=Date.now()-t;
              assert(elapsed>1300&&elapsed<5200,'wrong rotation interval: '+elapsed);
              const pulse=await card.locator('img.is-active').evaluate(e=>getComputedStyle(e).animationName);
              assert(pulse.includes('v27-gelato-heartbeat'),'missing heartbeat');
              await page.waitForFunction(()=>document.querySelector('[data-discovery-cups] img.is-active')?.getAttribute('src')?.includes('amarena-becher.webp'),{},{timeout:6500});
              const check=await page.evaluate(()=>{const card=document.querySelector('[data-discovery-cups]');return {count:document.querySelectorAll('.v26-discovery__card').length,sw:document.documentElement.scrollWidth,inner:window.innerWidth,cardWidth:card.getBoundingClientRect().width,frameLoaded:[...card.querySelectorAll('img')].every(x=>x.complete&&x.naturalWidth>0),images:[...card.querySelectorAll('img')].map(x=>x.getAttribute('src'))}});
              assert(check.count===3&&check.sw<=check.inner+2&&check.frameLoaded,JSON.stringify(check));
              await card.screenshot({path:'visual-evidence/eisbecher-'+name+'.png',animations:'disabled'});
              await card.focus();
              const focusedSrc=await card.locator('img.is-active').getAttribute('src');
              await page.waitForTimeout(2350);
              assert.strictEqual(await card.locator('img.is-active').getAttribute('src'),focusedSrc,'slideshow should pause for keyboard focus');
              assert.deepStrictEqual(errs,[],'browser errors');
              console.log('PASS '+name+' ~2s pulse, changed twice, correct frame, no overflow, focus pauses. firstSwitchMs='+elapsed);
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
            const card=page.locator('[data-discovery-cups]');
            await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(2400);
            assert((await card.locator('img.is-active').getAttribute('src')).includes('fruechte-becher.webp'),'reduced motion must be static');
            console.log('PASS reduced-motion static image');
            await browser.close();
          })().catch(e=>{console.error('V28 BROWSER QA FAIL:',e);process.exit(1)});
          JS
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v28-cup-transitions
          path: visual-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check protected worker
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
      - name: Deploy ONLY private Gelato worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gd-v28-live.json
          node -e "const j=require('/tmp/gd-v28-live.json'),d=j.result?.deployments?.[0];if(!j.success||!d?.versions?.some(v=>v.percentage===100))process.exit(3);console.log('DEPLOYED private Gelato preview:',d.id)"
