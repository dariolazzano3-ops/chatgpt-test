name: Provider Durable Secret Source Audit V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - '.github/workflows/provider-durable-secret-source-audit-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: riosystems-staging
    env:
      ACTIVEPIECES_SOURCE_SECRET: ${{ secrets.ACTIVEPIECES_API_KEY }}
      WEBFLOW_SOURCE_SECRET: ${{ secrets.WEBFLOW_SITE_TOKEN }}
    steps:
      - name: Audit approved secret source availability without values
        shell: bash
        run: |
          set -euo pipefail
          ACTIVEPIECES_STATE=ABSENT
          WEBFLOW_STATE=ABSENT
          if [ -n "${ACTIVEPIECES_SOURCE_SECRET:-}" ]; then ACTIVEPIECES_STATE=PRESENT; fi
          if [ -n "${WEBFLOW_SOURCE_SECRET:-}" ]; then WEBFLOW_STATE=PRESENT; fi
          printf 'ACTIVEPIECES_APPROVED_GITHUB_SECRET_SOURCE=%s\n' "$ACTIVEPIECES_STATE"
          printf 'WEBFLOW_APPROVED_GITHUB_SECRET_SOURCE=%s\n' "$WEBFLOW_STATE"
          printf 'SECRET_VALUES_EXPOSED=NO\n'
          if [ "$ACTIVEPIECES_STATE" != PRESENT ] || [ "$WEBFLOW_STATE" != PRESENT ]; then
            exit 2
          fi
