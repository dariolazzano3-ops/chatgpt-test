name: HAMYREN Dedicated OpenAI Secret V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/private-customer-ai-acceptance-v2.js'
      - 'src/hamyren-openai-secret-presence-v1.js'
      - 'src/entry.js'
      - 'scripts/hamyren-openai-secret-presence-v1-smoke.mjs'
      - 'scripts/hamyren-runtime-secret-presence-final-seal-smoke.mjs'
      - '.github/workflows/hamyren-dedicated-openai-secret-v1.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --check src/customer-product/private-customer-ai-acceptance-v2.js
      - run: node --check src/hamyren-openai-secret-presence-v1.js
      - run: node --check src/entry.js
      - run: node --check scripts/hamyren-runtime-secret-presence-final-seal-smoke.mjs
      - run: node scripts/hamyren-openai-secret-presence-v1-smoke.mjs
      - run: node scripts/hamyren-runtime-secret-presence-final-seal-smoke.mjs
