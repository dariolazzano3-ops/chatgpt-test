name: Visual Foundry AURENTARA Attention Reference Assets

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-attention-assets-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attention-reference-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: AT0_CONTROL
            variant: CONTROL
          - id: AT1_THUMBS
            variant: THUMBS
          - id: AT2_THUMBS_MORE
            variant: THUMBS_MORE
          - id: AT3_THUMBS_MORE_ICON
            variant: THUMBS_MORE_ICON
          - id: AT4_FULL
            variant: FULL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_ATTENTION_ASSET_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_ATTENTION_ASSET_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-attention-assets-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
