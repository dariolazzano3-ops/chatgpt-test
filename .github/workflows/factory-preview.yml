name: Factory Preview

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project folder slug under projects/
        required: true
        type: string
      source_branch:
        description: Branch containing the project files
        required: true
        type: string
  push:
    branches:
      - 'factory/**'
      - feature/project-factory-v1-5
    paths:
      - 'projects/**'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: chatgpt-factory-preview
      RIOSYSTEMS_ZERO_COST_CONFIRMED: ${{ vars.RIOSYSTEMS_CLOUDFLARE_ZERO_COST_CONFIRMED }}
    steps:
      - name: Require account-specific zero-cost confirmation
        run: test "$RIOSYSTEMS_ZERO_COST_CONFIRMED" = 'true'

      - name: Resolve source branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source_branch=${{ inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.source.outputs.source_branch || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve project slug
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_SLUG='${{ inputs.project_slug }}'
          elif [ "${{ github.ref_name }}" = "feature/project-factory-v1-5" ]; then
            PROJECT_SLUG='factory-preview-smoke'
          else
            PROJECT_SLUG=$(git diff-tree --no-commit-id --name-only -r HEAD \
              | sed -n 's#^projects/\([^/][^/]*\)/.*#\1#p' \
              | head -n 1)
            test -n "$PROJECT_SLUG" || { echo "No changed project folder found in triggering commit"; exit 1; }
          fi
          echo "project_slug=$PROJECT_SLUG" >> "$GITHUB_OUTPUT"

      - name: Validate project folder
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
        run: |
          set -euo pipefail
          case "$PROJECT_SLUG" in
            *..*|/*|*\\*) echo "Invalid project slug"; exit 1 ;;
          esac
          test -d "projects/$PROJECT_SLUG"
          test -f "projects/$PROJECT_SLUG/index.html"

      - name: Resolve external preview policy
        id: preview_policy
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
        run: |
          set -euo pipefail
          PROJECT_JSON="projects/$PROJECT_SLUG/project.json"
          EXTERNAL_PUBLISH=true
          if [ -f "$PROJECT_JSON" ]; then
            EXTERNAL_PUBLISH=$(node -e '
              const fs=require("fs");
              const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(data?.preview_policy?.external_publish === false ? "false" : "true");
            ' "$PROJECT_JSON")
          fi
          echo "external_publish=$EXTERNAL_PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$EXTERNAL_PUBLISH" = "false" ]; then
            echo "External Pages preview disabled by project policy."
          fi

      - name: Check preview configuration
        if: steps.preview_policy.outputs.external_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Confirm private preview stays local
        if: steps.preview_policy.outputs.external_publish == 'false'
        run: |
          echo "Factory Preview external publish skipped."
          echo "production_deploy=false"
          echo "public_preview_deploy=false"

      - name: Deploy preview only
        if: steps.preview_policy.outputs.external_publish == 'true'
        id: deploy
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" != 'main'
          test "$SOURCE_BRANCH" != 'factory-control'
          SOURCE_DIR="$GITHUB_WORKSPACE/projects/$PROJECT_SLUG"
          cd /tmp
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy "$SOURCE_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$SOURCE_BRANCH" 2>&1 | tee /dev/stderr)

          PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Deployment alias URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          fi
          test -n "$PREVIEW_URL" || { echo "Could not resolve preview URL"; exit 1; }
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### Factory Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
