name: Factory Preview

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project folder slug under projects/
        required: true
        type: string
      source_branch:
        description: Branch containing the project files
        required: true
        type: string
  push:
    branches:
      - 'factory/**'
      - feature/project-factory-v1-5
    paths:
      - '.github/workflows/factory-preview.yml'
      - 'projects/**/.factory-preview-trigger'
      - 'projects/factory-preview-smoke/**'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: chatgpt-factory-preview
    steps:
      - name: Resolve source branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source_branch=${{ inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_branch }}
          fetch-depth: 2

      - name: Resolve project slug
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_SLUG='${{ inputs.project_slug }}'
          elif [ "${{ github.ref_name }}" = "feature/project-factory-v1-5" ]; then
            PROJECT_SLUG='factory-preview-smoke'
          else
            TRIGGER_PATH=$(git show --pretty='' --name-only HEAD | grep -E '^projects/[^/]+/\.factory-preview-trigger$' | head -n 1 || true)
            test -n "$TRIGGER_PATH" || { echo "Factory preview trigger file not found in latest commit"; exit 1; }
            PROJECT_SLUG=$(printf '%s' "$TRIGGER_PATH" | cut -d/ -f2)
          fi
          echo "project_slug=$PROJECT_SLUG" >> "$GITHUB_OUTPUT"

      - name: Validate project folder
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
        run: |
          set -euo pipefail
          case "$PROJECT_SLUG" in
            *..*|/*|*\\*) echo "Invalid project slug"; exit 1 ;;
          esac
          test -d "projects/$PROJECT_SLUG"
          test -f "projects/$PROJECT_SLUG/index.html"

      - name: Check preview configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Ensure preview project exists
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main || true

      - name: Deploy preview only
        id: deploy
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/projects/$PROJECT_SLUG"
          cd /tmp
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy "$SOURCE_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$SOURCE_BRANCH" 2>&1 | tee /dev/stderr)

          PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Deployment alias URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          fi
          test -n "$PREVIEW_URL" || { echo "Could not resolve preview URL"; exit 1; }
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### Factory Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
