name: Factory Preview

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project folder slug under projects/
        required: true
        type: string
      source_branch:
        description: Branch containing the project files
        required: true
        type: string
  push:
    branches:
      - feature/project-factory-v1-5
    paths:
      - '.github/workflows/factory-preview.yml'
      - 'projects/factory-preview-smoke/**'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: chatgpt-factory-preview
    steps:
      - name: Resolve preview target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "project_slug=${{ inputs.project_slug }}" >> "$GITHUB_OUTPUT"
            echo "source_branch=${{ inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_slug=factory-preview-smoke" >> "$GITHUB_OUTPUT"
            echo "source_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.source_branch }}

      - name: Validate project folder
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
        run: |
          set -euo pipefail
          case "$PROJECT_SLUG" in
            *..*|/*|*\\*) echo "Invalid project slug"; exit 1 ;;
          esac
          test -d "projects/$PROJECT_SLUG"
          test -f "projects/$PROJECT_SLUG/index.html"

      - name: Check preview configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Ensure preview project exists
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main || true

      - name: Deploy preview only
        id: deploy
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.target.outputs.project_slug }}
          SOURCE_BRANCH: ${{ steps.target.outputs.source_branch }}
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/projects/$PROJECT_SLUG"
          cd /tmp
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy "$SOURCE_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$SOURCE_BRANCH" 2>&1 | tee /dev/stderr)

          PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Deployment alias URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          fi
          test -n "$PREVIEW_URL" || { echo "Could not resolve preview URL"; exit 1; }
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### Factory Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL to pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.target.outputs.source_branch }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$SOURCE_BRANCH" \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for $SOURCE_BRANCH; preview is still available at $PREVIEW_URL"
            exit 0
          fi

          MARKER='<!-- factory-preview -->'
          BODY="$MARKER
          ## 🌐 Factory Preview

          **Preview:** $PREVIEW_URL

          Branch: \`$SOURCE_BRANCH\`
          Project: \`${{ steps.target.outputs.project_slug }}\`

          _Automatically updated after a successful Cloudflare Pages preview deployment._"

          COMMENT_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- factory-preview -->")) | .id' | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -f body="$BODY" >/dev/null
          else
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null
          fi

          echo "Published preview URL to PR #$PR_NUMBER"
