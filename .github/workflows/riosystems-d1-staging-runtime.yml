name: RIOSYSTEMS D1 Staging Runtime

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/d1-runtime-store.js'
      - 'migrations/0003_riosystems_runtime_store.sql'
      - 'scripts/d1-runtime-store-smoke.mjs'
      - '.github/workflows/riosystems-d1-staging-runtime.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/d1-runtime-store.js
          node --check scripts/d1-runtime-store-smoke.mjs
      - name: D1 runtime store smoke
        run: node scripts/d1-runtime-store-smoke.mjs
      - name: Preview staging regression
        run: node scripts/preview-staging-fullgas-smoke.mjs
      - name: Staging provider bindings regression
        run: node scripts/staging-provider-bindings-smoke.mjs
      - name: Real provider bridge regression
        run: node scripts/real-provider-bridge-smoke.mjs
      - name: Phase 6 regression
        run: node scripts/riosystems-phase6-smoke.mjs
      - name: V5 regression
        run: node scripts/factory-v50-readiness.mjs
