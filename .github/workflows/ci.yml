name: CI

on:
  push:
    branches:
      - develop
      - staging
      - main
      - factory-control
      - feature/project-factory-v1-5
      - 'factory-v3/auto/**'
  pull_request:
    branches: [develop, staging, main, factory-control]
    paths-ignore:
      - 'projects/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: npm run check
      - name: HAMYREN Build Credit final prelaunch acceptance
        run: |
          node --test scripts/hamyren-final-technical-prelaunch-closing-v1.test.mjs
          node --test scripts/hamyren-build-credit-boundary-v1.test.mjs
      - name: HAMYREN final commercial and journey regressions
        run: |
          node --check ./src/customer-product/payment-lifecycle-v1.js
          node ./scripts/aurentara-customer-economics-v1-smoke.mjs
          node ./scripts/aurentara-customer-product-surface-v1-smoke.mjs
          node ./scripts/aurentara-payment-lifecycle-v1-smoke.mjs
          node ./scripts/aurentara-production-activation-contracts-v1-smoke.mjs
          node ./scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
          node ./scripts/aurentara-customer-red-team-v1.mjs
          node --test scripts/hamyren-capability-policy-v1.test.mjs
          node scripts/hamyren-customer-journey-readiness-v1-smoke.mjs
      - name: HAMYREN memory and business-state regressions
        run: |
          node --test scripts/hamyren-foundation-v1.test.mjs
          node --test scripts/business-state-v1.test.mjs
          node --test scripts/hamyren-memory-v1.test.mjs
          node scripts/hamyren-vertical-readiness-matrix-v1-smoke.mjs
          node scripts/hamyren-public-research-v1-smoke.mjs
          node scripts/hamyren-connectors-v1-smoke.mjs
          node scripts/personal-business-ai-founder-offer-v1-smoke.mjs
          node --test scripts/hamyren-business-ownership-v1.test.mjs
          node --test scripts/operator-hamyren-v1.test.mjs
      - name: HAMYREN Delivery to Memory V1 acceptance
        run: node --test scripts/hamyren-delivery-memory-feedback-v1.test.mjs
      - name: Canonical brand and ownership contract
        run: |
          node scripts/brand-ownership-v1-smoke.mjs
          node scripts/operator-branding-v1-smoke.mjs
      - name: Integrated RIOSYSTEMS regression gate
        run: node scripts/riosystems-integrated-regression-gate.mjs
      - name: Private Operator Dashboard V1 acceptance
        run: |
          node scripts/operator-dashboard-v1-smoke.mjs
          node scripts/operator-functional-completion-v1-smoke.mjs
          node scripts/operator-functional-seal-v1-smoke.mjs
          node scripts/provider-preflight-v1-smoke.mjs
          node scripts/operator-provider-preflight-v1-smoke.mjs
          node scripts/operator-design-ux-v1-smoke.mjs
      - name: Universal Mission V1 acceptance
        run: |
          node scripts/universal-mission-run-v1-smoke.mjs
          node scripts/universal-mission-generalization-v1-smoke.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Check live Factory diagnostics
        run: |
          set -euo pipefail
          echo '=== /factory/diagnostics ==='
          curl -fsS 'https://chatgpt-test.gelato-donatello-dario-a5a5376c.workers.dev/factory/diagnostics'
          echo
          echo '=== /factory/diagnostics/github ==='
          curl -fsS 'https://chatgpt-test.gelato-donatello-dario-a5a5376c.workers.dev/factory/diagnostics/github'
          echo
