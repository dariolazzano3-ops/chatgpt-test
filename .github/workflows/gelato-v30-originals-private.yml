name: Gelato V30 original photos private preview
on:
  push:
    branches: [aurentara/gelato-new-cups-vanilla-v30]
    paths: [.github/workflows/gelato-v30-originals-private.yml]
permissions:
  contents: read
concurrency:
  group: gelato-v30-photos-private
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check actual photos, references and private safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aurentara/gelato-new-cups-vanilla-v30'
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          import re,json,hashlib
          root=Path('projects/gelato-donatello-premium-v6')
          cups=['spaghetti-neri','spaghetti-classic','tartufo-becher','spaghetti-melone','spaghetti-erdbeere','spaghetti-carbonara','spaghetti-amarena']
          drinks=['vanille-shake']
          hashes=['8f982fd05cc8776a3d15f274f33494673c7e6a282fd63e05f18f9cd91687e69b','86dcc3501305843997f2abba20a72ff3befa9c5469342b1d1be27b2843b654b0','a4e6abf9bb24493de5d78a84963e4de0b1d453b7a43ed4b9ee2a63130de925e8','4aa371de48a33e3f66b86cfcd6f6669809db319357404d29780b858924881c2f','666dc75b6531fc3494eca52b46d0f298a710f00035c3e2b6630d3e16bf78e510','c4384020709b3ec19ae599c8b74f2c535ebbda43538fab018b57a537d4926548','9d2ab4cfca26299a7543c97a6df1ef8b7365b27f8dc04baf6e9ab119c44469a9','d77373b542a84da399dae8a5f808acb4e7a34e24f325558991b84abf98879311']
          for name,digest in zip(cups+drinks,hashes):
            cat='drinks' if name in drinks else 'cups'
            path=root/'assets/images'/cat/(name+'.webp')
            assert path.exists(),str(path)
            raw=path.read_bytes()
            assert 40000<len(raw)<500000 and raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',name
            assert hashlib.sha256(raw).hexdigest()==digest,'Image checksum mismatch '+name
          js=(root/'assets/js/components/discovery-cups.js').read_text()
          assert len(re.findall(r'src: "/assets/images/cups/',js))==16
          assert 'const TICK_MS = 2000;' in js
          cups_page=(root/'eisbecher/index.html').read_text()
          drinks_page=(root/'getraenke/index.html').read_text()
          for name in cups:assert '/assets/images/cups/'+name+'.webp' in cups_page,name
          assert cups_page.count('class="v30-cup-gallery__item')==7
          assert 'Vanille-Shake' in drinks_page and '/assets/images/drinks/vanille-shake.webp' in drinks_page
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2' and config['assets']['run_worker_first'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          print('PASS 8 exact SHA-256 images, 16 slideshow photos, gallery, vanilla, private Cloudflare scope')
          PY
      - name: Responsive browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gd-v30-web.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gd-v30-playwright --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert'),{chromium}=require('/tmp/gd-v30-playwright/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const p=await browser.newPage({viewport:{width,height}});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.goto('http://127.0.0.1:43119/eisbecher/',{waitUntil:'domcontentloaded'});
              const gallery=p.locator('.v30-cup-gallery');
              await gallery.scrollIntoViewIfNeeded();
              await gallery.locator('img').evaluateAll(async imgs=>Promise.all(imgs.map(img=>img.decode().catch(()=>{}))));
              const quality=await gallery.evaluate(e=>({count:e.querySelectorAll('img').length,loaded:[...e.querySelectorAll('img')].every(x=>x.complete&&x.naturalWidth>1000),overflow:e.scrollWidth>e.clientWidth+2,labels:[...e.querySelectorAll('figcaption strong')].map(x=>x.textContent)}));
              assert(quality.count===7&&quality.loaded&&!quality.overflow,JSON.stringify(quality));
              await gallery.screenshot({path:'visual-evidence/cup-gallery-'+label+'.png',animations:'disabled'});
              await p.goto('http://127.0.0.1:43119/getraenke/',{waitUntil:'domcontentloaded'});
              const vanilla=p.locator('img[src="/assets/images/drinks/vanille-shake.webp"]');
              await vanilla.scrollIntoViewIfNeeded();
              await vanilla.evaluate(x=>x.decode());
              assert(await vanilla.evaluate(x=>x.naturalWidth===1254));
              await p.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
              const slideshow=p.locator('[data-discovery-cups]');
              await slideshow.scrollIntoViewIfNeeded();
              await p.waitForFunction(()=>document.querySelector('[data-discovery-cups] img.is-active')?.getAttribute('src')?.includes('erdbeer-becher'),{},{timeout:7300});
              const stats=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+2,cards:document.querySelectorAll('.v26-discovery__card').length}));
              assert(!stats.overflow&&stats.cards===3,JSON.stringify(stats));
              assert(errors.length===0,errors.join(' | '));
              console.log('PASS '+label+' seven new cups rendered, Vanilla Shake decoded, 2-sec slideshow cycles');
              await p.close();
            }
            await browser.close();
          })().catch(e=>{console.error('BROWSER QA FAIL',e);process.exit(1)});
          JS
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v30-original-photo-qa
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify existing protected deployment target
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
      - name: Deploy ONLY private Gelato preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify Cloudflare 100 percent active
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gd-v30-deploy.json
          node -e "const r=require('/tmp/gd-v30-deploy.json'),d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('PRIVATE DEPLOY PASS',d.id)"
