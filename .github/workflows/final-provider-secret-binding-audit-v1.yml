name: Final Provider Secret Binding Audit V1

on:
  push:
    branches: [final-provider-secret-binding-audit-v1]
    paths:
      - '.github/workflows/final-provider-secret-binding-audit-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-control
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: List secret names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler secret list --env staging --format json > /tmp/staging-secrets.json
          npx wrangler secret list --name chatgpt-test --format json > /tmp/default-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const parseNames = (path) => {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const items = Array.isArray(data) ? data : [];
            return [...new Set(items.map(x => String(x?.name || '').trim()).filter(Boolean))].sort();
          };
          const staging = parseNames('/tmp/staging-secrets.json');
          const normal = parseNames('/tmp/default-secrets.json');
          const wanted = ['WEBFLOW_SITE_TOKEN','ACTIVEPIECES_API_KEY'];
          console.log('SECRET_BINDING_AUDIT=' + JSON.stringify({
            staging_worker: 'riosystems-staging',
            staging_secret_names: staging,
            staging: Object.fromEntries(wanted.map(k => [k, staging.includes(k) ? 'PRESENT' : 'ABSENT'])),
            default_worker: 'chatgpt-test',
            default_secret_names: normal,
            default: Object.fromEntries(wanted.map(k => [k, normal.includes(k) ? 'PRESENT' : 'ABSENT'])),
            secret_values_exposed: false,
            provider_requests: 0,
            provider_writes: 0,
            production: false,
            variable_cost_eur: 0
          }));
          NODE
