name: RIOSYSTEMS WebFactory Autonomous Delivery Loop V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/web-factory/autonomous-delivery-loop-v1.js'
      - 'src/web-factory/index.js'
      - 'src/web-factory/adapter.js'
      - 'scripts/webfactory-autonomous-delivery-loop-v1-smoke.mjs'
      - '.github/workflows/webfactory-autonomous-delivery-loop-v1.yml'
      - 'docs/RIOSYSTEMS-WEB-FACTORY-AUTONOMOUS-DELIVERY-LOOP-V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for J7/J9 regressions
        run: npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check src/web-factory/autonomous-delivery-loop-v1.js
          node --check src/web-factory/index.js
          node --check src/web-factory/adapter.js
          node --check scripts/webfactory-autonomous-delivery-loop-v1-smoke.mjs
      - name: Autonomous Delivery Loop acceptance
        run: node scripts/webfactory-autonomous-delivery-loop-v1-smoke.mjs
      - name: J7 visual closure regression
        run: node scripts/webfactory-100-j7-visual-closure-smoke.mjs
      - name: J9 browser accessibility performance regression
        run: node scripts/webfactory-100-j9-browser-accessibility-performance-v2-smoke.mjs
      - name: J14 full dogfood regression
        run: node scripts/webfactory-100-j14-full-dogfood-closure-smoke.mjs
      - name: WebFactory provider regression
        run: node scripts/web-factory-v1-smoke.mjs
      - name: Safety seal
        run: |
          node -e "const fs=require('fs');const y=fs.readFileSync('.github/workflows/webfactory-autonomous-delivery-loop-v1.yml','utf8');if(/wrangler\\s+deploy|pages\\s+deploy|curl\\s+.*workers\\.dev/i.test(y))process.exit(1);console.log('No deploy command in acceptance workflow')"
          echo "Automatic merge: false"
          echo "Production deploy: false"
          echo "Public launch: false"
          echo "DNS changes: false"
          echo "Billing activation: false"
          echo "External customer writes: false"
