name: RIOSYSTEMS Universal Mission Run V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/universal-mission-run.js'
      - 'scripts/universal-mission-run-v1-smoke.mjs'
      - '.github/workflows/universal-mission-run-v1.yml'
      - 'docs/RIOSYSTEMS-UNIVERSAL-MISSION-RUN-V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-mission-run-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax check
        run: node --check src/universal-mission-run.js && node --check scripts/universal-mission-run-v1-smoke.mjs
      - name: Universal Mission Run V1 acceptance
        run: node scripts/universal-mission-run-v1-smoke.mjs
      - name: Central RIOSYSTEMS regression
        run: npm run check:riosystems
