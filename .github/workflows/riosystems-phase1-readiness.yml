name: RIOSYSTEMS Phase 1 Readiness

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/runtime-governance.js'
      - 'src/runtime-cost-ledger.js'
      - 'src/runtime-approvals.js'
      - 'src/runtime-project-boundary.js'
      - 'src/provider-runtime.js'
      - 'src/runtime-control-plane.js'
      - 'src/runtime-readiness.js'
      - 'src/mission-pipeline.js'
      - 'scripts/runtime-governance-smoke.mjs'
      - 'scripts/phase1-control-plane-smoke.mjs'
      - 'scripts/phase1-readiness.mjs'
      - '.github/workflows/riosystems-phase1-readiness.yml'

jobs:
  validate-phase1-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check src/runtime-governance.js
          node --check src/runtime-cost-ledger.js
          node --check src/runtime-approvals.js
          node --check src/runtime-project-boundary.js
          node --check src/provider-runtime.js
          node --check src/runtime-control-plane.js
          node --check src/runtime-readiness.js
          node --check src/mission-pipeline.js
          node --check scripts/phase1-readiness.mjs
      - name: Foundation smoke
        run: node scripts/runtime-governance-smoke.mjs
      - name: Control plane smoke
        run: node scripts/phase1-control-plane-smoke.mjs
      - name: Phase 1 readiness
        run: node scripts/phase1-readiness.mjs
      - name: Existing mission pipeline regression
        run: node scripts/mission-pipeline-smoke.mjs
      - name: Existing V5 readiness regression
        run: node scripts/factory-v50-readiness.mjs
