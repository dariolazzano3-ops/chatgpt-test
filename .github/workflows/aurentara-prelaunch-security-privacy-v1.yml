name: AURENTARA Prelaunch Security Privacy V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/prelaunch-security-privacy-v1.js'
      - 'src/customer-product/launch-readiness-v1.js'
      - 'src/entry.js'
      - 'migrations/20260901_aurentara_customer_ai_foundation_v1.sql'
      - 'migrations/20260901_aurentara_customer_chat_runtime_v1.sql'
      - 'scripts/aurentara-prelaunch-security-privacy-v1-smoke.mjs'
      - 'scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs'
      - 'scripts/aurentara-customer-red-team-v1.mjs'
      - 'docs/AURENTARA_PERSONAL_BUSINESS_AI_PRELAUNCH_SECURITY_PRIVACY_V1.md'
      - '.github/workflows/aurentara-prelaunch-security-privacy-v1.yml'

jobs:
  prelaunch-security-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/prelaunch-security-privacy-v1.js
          node --check src/customer-product/launch-readiness-v1.js
          node --check src/entry.js
          node --check scripts/aurentara-prelaunch-security-privacy-v1-smoke.mjs
      - name: Prelaunch security privacy acceptance
        run: node scripts/aurentara-prelaunch-security-privacy-v1-smoke.mjs
      - name: Launch readiness regression
        run: node scripts/aurentara-controlled-launch-readiness-v1-smoke.mjs
      - name: Mandatory Customer Red Team regression
        run: node scripts/aurentara-customer-red-team-v1.mjs
