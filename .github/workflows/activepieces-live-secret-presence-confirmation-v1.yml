name: Activepieces Live Secret Presence Confirmation V1

on:
  push:
    branches: [activepieces-live-secret-presence-confirmation-v1]
    paths:
      - '.github/workflows/activepieces-live-secret-presence-confirmation-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-control
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Confirm staging provider secret names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler secret list --env staging --format json > /tmp/staging-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/staging-secrets.json','utf8'));
          const names = new Set((Array.isArray(data) ? data : []).map(x => String(x?.name || '').trim()).filter(Boolean));
          const result = {
            worker: 'riosystems-staging',
            WEBFLOW_SITE_TOKEN: names.has('WEBFLOW_SITE_TOKEN') ? 'PRESENT' : 'ABSENT',
            ACTIVEPIECES_API_KEY: names.has('ACTIVEPIECES_API_KEY') ? 'PRESENT' : 'ABSENT',
            provider_requests: 0,
            provider_writes: 0,
            secrets_exposed: false,
            production: false,
            variable_cost_eur: 0
          };
          console.log('SECRET_PRESENCE_CONFIRMATION=' + JSON.stringify(result));
          NODE
