name: RIOSYSTEMS Staging Release Budget Control

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/operator-budget-policy.js'
      - 'src/staging-release-control.js'
      - 'scripts/staging-release-budget-control-smoke.mjs'
      - '.github/workflows/riosystems-staging-release-budget-control.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/operator-budget-policy.js
          node --check src/staging-release-control.js
          node --check scripts/staging-release-budget-control-smoke.mjs
      - name: Staging release budget control smoke
        run: node scripts/staging-release-budget-control-smoke.mjs
      - name: D1 runtime store regression
        run: node scripts/d1-runtime-store-smoke.mjs
      - name: Preview staging regression
        run: node scripts/preview-staging-fullgas-smoke.mjs
      - name: Real provider bridge regression
        run: node scripts/real-provider-bridge-smoke.mjs
      - name: Phase 6 regression
        run: node scripts/riosystems-phase6-smoke.mjs
      - name: V5 regression
        run: node scripts/factory-v50-readiness.mjs
