name: RIOSYSTEMS Operator Access Readiness Check

on:
  push:
    branches: [operator-access-readiness-check]
    paths:
      - '.github/workflows/riosystems-operator-access-readiness-check.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RIOSYSTEMS_OPERATOR_EMAIL: ${{ secrets.RIOSYSTEMS_OPERATOR_EMAIL }}
      TARGET_ACCESS_DOMAIN: riosystems-staging.gelato-donatello-dario-a5a5376c.workers.dev/operator
    steps:
      - uses: actions/checkout@v4
      - name: Verify readiness without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "operator-access-readiness-check"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RIOSYSTEMS_OPERATOR_EMAIL"

          STATUS="$(curl -sS -o /tmp/access-apps.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100")"

          echo "ACCESS_APPS_HTTP_STATUS=$STATUS"
          echo "access_apps_http_status=$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "200" ]; then
            jq -r '.errors[]? | "CLOUDFLARE_ERROR=\(.code):\(.message)"' /tmp/access-apps.json || true
            exit 1
          fi

          MATCHES="$(jq --arg d "$TARGET_ACCESS_DOMAIN" '[.result[]? | select(.domain == $d)] | length' /tmp/access-apps.json)"
          echo "MATCHING_ACCESS_APP_COUNT=$MATCHES"
          echo "matching_access_app_count=$MATCHES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MATCHES" -gt 0 ]; then
            jq -r --arg d "$TARGET_ACCESS_DOMAIN" '.result[]? | select(.domain == $d) | "EXISTING_ACCESS_APP_ID=" + .id + "\nEXISTING_ACCESS_APP_AUD=" + (.aud // "")' /tmp/access-apps.json
          fi
          echo "OPERATOR_EMAIL_SECRET_PRESENT=true"
          echo "operator_email_secret_present=true" >> "$GITHUB_STEP_SUMMARY"
          echo "READINESS=READY_FOR_ACCESS_CONFIGURATION"
          echo "readiness=READY_FOR_ACCESS_CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"
