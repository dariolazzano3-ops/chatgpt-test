name: AURENTARA Web Project Control V2

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/operator-web-project-control-v2.js'
      - 'src/entry.js'
      - 'scripts/aurentara-web-project-control-v2-smoke.mjs'
      - 'scripts/aurentara-web-project-control-v2-browser.mjs'
      - 'docs/AURENTARA-WEB-PROJECT-CONTROL-V2.md'
      - '.github/workflows/aurentara-web-project-control-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check src/operator-web-project-control-v2.js
          node --check src/entry.js
          node --check scripts/aurentara-web-project-control-v2-smoke.mjs
          node --check scripts/aurentara-web-project-control-v2-browser.mjs
      - name: V2 contract
        run: node scripts/aurentara-web-project-control-v2-smoke.mjs
      - name: Desktop and iPhone operator acceptance
        run: node scripts/aurentara-web-project-control-v2-browser.mjs
      - name: Premium workspace regression
        run: node scripts/project-ferrari-premium-masterdashboard-v1-smoke.mjs
      - name: J14 WebFactory composed regression
        run: node scripts/webfactory-100-j14-full-dogfood-closure-smoke.mjs
      - name: Operator shell regression
        run: node scripts/operator-dashboard-v1-smoke.mjs
      - name: Staging bundle dry-run
        run: npx wrangler deploy --env staging --dry-run
      - name: Safety seal
        run: |
          ! grep -E 'wrangler deploy([^[:alnum:]-]|$)' .github/workflows/aurentara-web-project-control-v2.yml
          echo "Production deploy: false"
          echo "Public launch: false"
          echo "DNS changes: false"
          echo "Billing activation: false"
          echo "Automatic merge: false"
