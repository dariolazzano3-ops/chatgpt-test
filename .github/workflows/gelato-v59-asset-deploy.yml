name: Gelato V59 · protected image deploy fallback
on:
  push:
    branches: [aurentara/gelato-joghurt-kinder-v59]
    paths: [.github/workflows/gelato-v59-asset-deploy.yml]
permissions:
  contents: read
concurrency:
  group: gelato-v59-safe-image-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check authentic originals, content and private-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aurentara/gelato-joghurt-kinder-v59'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('projects/gelato-donatello-premium-v6')
          shots={
            'joghurt-fruechte':'61d1de88995474575573c237451eeb00dcdb8c31bf8b65d65c1a10fd0fd547e4',
            'joghurt-waldbeer':'aada02704921633178e90e3faed728e77782cc79b6ddccf2704b28920e83d093',
            'kinder-spaghetti':'56b1ad05af392de2b7d2601a1fc98e70c3889258ebaa0b8c3f408f00a8fe6bc2',
          }
          config=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert config['name']=='gelato-donatello-private-preview-v2'
          assert config['assets']['run_worker_first'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          slides=(root/'assets/js/components/discovery-cups.js').read_text()
          gallery=(root/'eisbecher/index.html').read_text()
          assert 'const TICK_MS = 2000;' in slides
          assert len(re.findall(r'src: "/assets/images/cups/',slides))==27
          assert gallery.count('id="joghurt-eisbecher"')==1
          assert gallery.count('Kinder Spaghetti</strong>')==1
          assert gallery.count('class="v30-cup-gallery__item"')>=18
          for name,digest in shots.items():
            file=root/'assets/images/cups'/f'{name}.webp'
            data=file.read_bytes()
            assert len(data)>65000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP'
            assert hashlib.sha256(data).hexdigest()==digest
            assert slides.count(f'/assets/images/cups/{name}.webp')==1
            assert gallery.count(f'/assets/images/cups/{name}.webp')==1
          for src in re.findall(r'src: "(/assets/images/cups/[^"]+)"',slides):
            assert (root/src.lstrip('/')).is_file(),src
          print('PASS: three original images, existing 2s animation, 27 valid cups, private access/noindex')
          PY
      - name: Check static HTTP asset delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 43123 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gd-v59-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          for slug in joghurt-fruechte joghurt-waldbeer kinder-spaghetti; do
            curl -fsS "http://127.0.0.1:43123/assets/images/cups/$slug.webp" -o "/tmp/$slug.webp"
            file "/tmp/$slug.webp" | grep -q "Web/P image"
          done
          curl -fsS "http://127.0.0.1:43123/eisbecher/" -o /tmp/v59-gallery.html
          grep -q "Unsere Joghurt-Lieblinge" /tmp/v59-gallery.html
          echo 'PASS: all new images and Eisbecher gallery served with HTTP 200'
      - name: Private Cloudflare preflight
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$code" = "200"
      - name: Deploy ONLY protected private preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Confirm private deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gd-v59-live.json
          node -e "const r=require('/tmp/gd-v59-live.json'),d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('Private Gelato deployment confirmed:',d.id)"
