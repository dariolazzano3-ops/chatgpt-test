name: Gelato V78 Reference Private Preview
on:
  push:
    branches: [aurentara/gelato-caffe-v78-reference]
    paths: ['.github/workflows/gelato-caffe-v78.yml']
permissions:
  contents: read
jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact private destination and reference styling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('projects/gelato-donatello-premium-v6')
          cfg=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          css=(r/'assets/css/style.css').read_text()
          js=(r/'assets/js/app.js').read_text()
          assert cfg['name']=='gelato-donatello-private-preview-v2'
          assert cfg['assets']['directory']=='./'+str(r)
          assert cfg['assets']['run_worker_first'] is False
          assert 'V78: user reference art direction' in css
          assert 'const rotation=(progress-.5)*360' in js
          assert 'X-Robots-Tag: noindex' in (r/'_headers').read_text()
          assert (r/'assets/images/editorial/caffe-donatello-cup-v75.webp').is_file()
          print('V78 PRIVATE QA PASS')
          PY
      - name: Deploy ONLY protected private Gelato Worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify Cloudflare deployment
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" >/tmp/v78.json
          node -e "const x=require('/tmp/v78.json');const d=x.result?.deployments?.[0];if(!x.success||!d?.versions?.some(v=>v.percentage===100))process.exit(1);console.log('V78 PRIVATE DEPLOY PASS',d.id)"
