name: Gelato V74 Original Coffee Background Private Preview
on:
  push:
    branches: [aurentara/gelato-caffe-original-background-v74]
    paths: ['.github/workflows/gelato-caffe-v74.yml']
permissions:
  contents: read
concurrency:
  group: gelato-v74-private
  cancel-in-progress: false
jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check real photo texture, sizing, safe staging target and exact motion changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-caffe-original-background-v74"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('projects/gelato-donatello-premium-v6')
          css=(root/'assets/css/style.css').read_text()
          js=(root/'assets/js/app.js').read_text()
          html=(root/'index.html').read_text()
          cfg=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          proj=json.loads((root/'project.json').read_text())
          assert cfg['name']=='gelato-donatello-private-preview-v2'
          assert cfg['assets']['directory']=='./projects/gelato-donatello-premium-v6'
          assert cfg['assets']['run_worker_first'] is False
          assert proj['preview_policy']['external_publish'] is False
          assert proj['safety']['production_deploy'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          texture=root/'assets/images/editorial/caffe-original-tisch-textur-v74.webp'
          assert texture.is_file() and 1000<texture.stat().st_size<20000
          data=texture.read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert 'url("/assets/images/editorial/caffe-original-tisch-textur-v74.webp")' in css
          assert 'width:79%;max-width:360px' in css
          assert 'const rotation=(progress-.5)*72;' in js
          assert 'const lift=(.5-progress)*28;' in js
          assert 'prefers-reduced-motion:reduce' in css
          assert 'window.requestAnimationFrame(update)' in js
          assert 'data-caffe-scroll' in html
          assert 'caffe-donatello-cup.webp' in html
          assert 'Auch wenn alles eiskalt ist:' in html
          assert 'Ein warmer Caffè geht immer.' in html
          print('PASS V74 authentic original charcoal tabletop, smaller cup, 6x stronger rotation, protected private-only target')
          PY
          node --check projects/gelato-donatello-premium-v6/assets/js/app.js
      - name: Real Chromium iPhone desktop scroll and contrast QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gelato-v74-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gelato-v74-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gelato-v74-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [name,width,height,motion] of [
              ['iphone-small',360,780,'no-preference'],['iphone',390,844,'no-preference'],
              ['tablet',768,1024,'no-preference'],['desktop',1440,900,'no-preference'],
              ['reduced-motion',390,844,'reduce']
            ]){
              const page=await browser.newPage({viewport:{width,height},reducedMotion:motion});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const res=await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              assert.strictEqual(res.status(),200);
              const s=page.locator('.v73-caffe'),visual=s.locator('.v73-caffe__visual'),cup=s.locator('.v73-caffe__cup');
              await s.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>{
                const i=document.querySelector('.v73-caffe__cup');return i?.complete&&i.naturalWidth>200;
              },null,{timeout:15000});
              const style=await s.evaluate(e=>{
                const s=getComputedStyle(e),c=getComputedStyle(e.querySelector('.v73-caffe__copy h2')),
                  img=e.querySelector('.v73-caffe__cup'),p=img.parentElement;
                return {background:s.backgroundImage,color:c.color,section:e.getBoundingClientRect().width,
                  cupWidth:img.getBoundingClientRect().width,visualWidth:p.getBoundingClientRect().width};
              });
              assert(style.background.includes('caffe-original-tisch-textur-v74.webp'),'original background missing');
              assert(style.color==='rgb(250, 244, 233)','text must remain legible on dark background');
              assert(style.cupWidth/style.visualWidth<.87,'cup not downsized enough '+JSON.stringify(style));
              const bg=await page.request.get('http://127.0.0.1:43119/assets/images/editorial/caffe-original-tisch-textur-v74.webp');
              assert.strictEqual(bg.status(),200);
              assert((await bg.body()).length>1000);
              const before=parseFloat(await visual.evaluate(e=>e.style.getPropertyValue('--coffee-rotation')))||0;
              await page.evaluate(()=>window.scrollBy({top:215,behavior:'instant'}));
              await page.waitForTimeout(180);
              const after=parseFloat(await visual.evaluate(e=>e.style.getPropertyValue('--coffee-rotation')))||0;
              if(motion==='reduce'){
                assert.strictEqual(after,0);
                assert.strictEqual(await cup.evaluate(e=>getComputedStyle(e).transform),'none');
              }else{
                assert(Math.abs(after-before)>3,'Scroll rotation too subtle or stopped '+JSON.stringify({before,after}));
                assert(Math.abs(after)<=36.1,'rotation exceeds ±36 degrees');
              }
              const overflow=await page.evaluate(()=>({page:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert(overflow.page<=overflow.viewport+3,'Horizontal overflow '+JSON.stringify(overflow));
              assert.deepStrictEqual(errors,[],'Page JS error');
              await s.screenshot({path:'visual-evidence/coffee-'+name+'.png',animations:'disabled'});
              assert.strictEqual((await page.request.get('http://127.0.0.1:43119/kontakt/')).status(),200);
              console.log('PASS V74',name,'original tabletop, smaller real cup, warm readable copy, scroll motion',before.toFixed(1),after.toFixed(1));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('BROWSER QA FAILURE',e);process.exit(1)});
          JS
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v74-coffee-background
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify existing private Worker target
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$status" = "200"
      - name: Deploy ONLY private Gelato Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify Cloudflare new version at 100 percent
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v74-deploy.json
          node -e "const r=require('/tmp/gelato-v74-deploy.json');const d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('GELATO V74 PRIVATE DEPLOY PASS',d.id)"
