name: Gelato V20 owner-provided shop photo private preview release (one time)
on:
  push:
    branches:
      - release/gelato-shop-interior-v20-once
    paths:
      - .github/workflows/gelato-v20-shop-photo-private-preview-once.yml

permissions:
  contents: read

concurrency:
  group: gelato-v20-shop-photo-private-preview-once
  cancel-in-progress: false

jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SHA: a8c86cfc7b7a49176fed57c2a912d99dc2f21a78
      PROJECT_PATH: projects/gelato-donatello-premium-v6
      WORKER: gelato-donatello-private-preview-v2
      PRIVATE_URL: https://gelato-donatello-private-preview-v2.gelato-donatello-dario-a5a5376c.workers.dev
    steps:
      - name: Checkout owner-approved V20 feature at exact immutable commit
        uses: actions/checkout@v4
        with:
          ref: a8c86cfc7b7a49176fed57c2a912d99dc2f21a78
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact source and private safety limits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f "$PROJECT_PATH/assets/images/events/gelato-event-familie.webp"
          grep -q 'v10-event-feature' "$PROJECT_PATH/index.html"
          grep -q 'gelato-event-familie.webp' "$PROJECT_PATH/index.html"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.env.PROJECT_PATH+'/project.json','utf8'));
          const s = p.safety || {};
          for (const k of ['production_deploy','public_deploy','dns_changes','billing','external_writes']) {
            if(s[k] !== false) throw Error('PRIVATE_SAFETY_VIOLATION: '+k);
          }
          if(p.preview_policy?.mode !== 'PRIVATE_CLOUDFLARE_ACCESS_ONLY') throw Error('NOT_PRIVATE_ACCESS_ONLY');
          console.log('Exact V18 source and private safety OK');
          NODE

      - name: Static event photo acceptance and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const root=process.env.PROJECT_PATH;
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const home=read('index.html'), css=read('assets/css/style.css'), app=read('assets/js/app.js');
          assert(home.includes('v10-event-feature'));
          assert(home.includes('<figure class="v10-event-feature__visual v15-event-photo">'));
          assert(home.includes('/assets/images/events/gelato-event-familie.webp'));
          assert(home.includes('alt="Familie beim Eisgenuss'));
          assert(!home.includes('data-event-depth'),'Depth data attributes remain');
          assert(!home.includes('v11-depth-scene'),'Old depth UI remains');
          assert(!home.includes('v11-depth-viewer'),'Viewer remains');
          assert(!home.includes('data-event-depth-open'),'Fullscreen icon remains');
          assert(!home.includes('data-gyro-toggle'),'Sensor UI remains');
          assert(!app.includes('initEventDepth'),'Event depth code still executes');
          assert(!app.includes('event-depth.js'),'Event depth module still loads');
          assert(css.includes('.v15-event-photo img'));
          assert(home.includes('v16-event__media-credit'));
          assert(home.includes('v16-event__cta-copy'));
          assert(css.includes('/* V16: premium editorial event story'));
          assert(css.includes('linear-gradient(145deg,#e7ddce 0%,#e0d4c3 58%,#d8cbb9 100%)'),
            'V18 warm taupe event gradient missing');
          assert(!css.includes('linear-gradient(145deg,#f0eadc 0%,#e9dfce 58%,#e7ddcc 100%)'),
            'Previous extra-light event background remains');
          assert(css.includes('background:#f5efe5;'), 'Existing cream rental form was modified');
          assert(home.includes('<em>Event.</em>'));

          assert(!css.includes('.v11-depth-scene__stage'));
          assert(!css.includes('.v12-gyro-toggle'));
          assert(home.includes('Eisvitrine entdecken'),'Event CTA missing');
          assert(home.includes('href="/eisvitrine/"'),'Event CTA route changed');
          assert(css.includes('v8-cake-spotlight'));
          assert(!home.includes('Bewegliches Eventfoto'));
          for(const route of ['eissorten','eisbecher','eistorten','eisvitrine','kontakt']) {
            assert.match(read(route+'/index.html'),/noindex/i,route+' should remain private');
          }
          const stat=fs.statSync(path.join(root,'assets/images/events/gelato-event-familie.webp'));
          assert(stat.size>100000 && stat.size<1500000,'Event image missing');
          assert(fs.readdirSync(path.join(root,'assets/images/flavors')).filter(x=>x.endsWith('.webp')).length>=41);
          assert(fs.readdirSync(path.join(root,'assets/images/cakes')).filter(x=>x.endsWith('.webp')).length>=24);
          // V20: only the homepage shop image changed, preserving all surrounding design.
          const source=path.join(root,'assets/images/shop/interior-original-2026.avif');
          const bytes=fs.readFileSync(source);
          assert(bytes.length===20052,'Wrong V20 asset length');
          assert(bytes.subarray(4,12).toString('ascii')==='ftypavif','Wrong AVIF type');
          const sha256=require('node:crypto').createHash('sha256').update(bytes).digest('hex');
          assert(sha256==='50f231d50ed9ac56b6a4c6ae216458075f7e1cce1d6b37d72e9f681be8c50079',
            'Owner photo differs from verified upload');
          assert(home.includes('src="/assets/images/shop/interior-original-2026.avif"'),
            'Homepage photo source was not changed');
          assert(!home.includes('src="/assets/images/shop/show-premium.webp"'),
            'Previous shop image is still selected');
          assert(home.includes('<figcaption>Direkt aus dem Eislabor in die Vitrine.</figcaption>'),
            'Existing photo caption changed');
          const rental=read('eisvitrine/index.html');
          assert.match(rental,/20 Litern Eis/,'20 L description missing');
          assert.match(rental,/>20 <span>L<\/span>/,'20 L fact missing');
          assert.match(rental,/250 <span>€<\/span>/,'rental cost missing');
          assert.match(rental,/100 <span>€<\/span>/,'deposit missing');
          assert(!rental.includes('5 Litern Eis')&&!rental.includes('5 L</strong>'),'old 5 L text');
          assert(!rental.includes('kein bestätigtes Foto')&&!rental.includes('kein erfundenes'),'obsolete notice');
          assert(rental.includes('v17-rental-hero')&&rental.includes('v17-rental-board'),'black design missing');
          assert(rental.includes('gelato-vitrine-produkt.webp'),'uploaded photo not referenced');
          assert(rental.includes('<picture>') && rental.includes('gelato-vitrine-produkt-hd.avif'),
            'High-resolution AVIF picture source missing');
          assert(rental.includes('width="1254" height="1254"'),'Correct retina intrinsic image dimensions missing');
          const highRes=fs.statSync(path.join(root,'assets/images/events/gelato-vitrine-produkt-hd.avif'));
          assert(highRes.size>=35000 && highRes.size<150000,'High-resolution AVIF asset not present');
          const avifFile=fs.readFileSync(path.join(root,'assets/images/events/gelato-vitrine-produkt-hd.avif'));
          assert(avifFile.subarray(4,12).toString('ascii')==='ftypavif','Unexpected high-res format');
          assert(css.includes('.v17-rental-hero__visual picture'),'Responsive high-res picture styles missing');
          assert(fs.statSync(path.join(root,'assets/images/events/gelato-vitrine-produkt.webp')).size>5000,'product photo missing');
          assert(css.includes('/* V17 · Gelato Donatello'),'rental CSS missing');
          console.log('V17 static photo and site regression gate PASS');
          NODE
          find "$PROJECT_PATH/assets/js" -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install Chromium for real mobile gesture verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Mobile and desktop static-photo visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory "$PROJECT_PATH" >/tmp/gelato-v15-photo.log 2>&1 &
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              const photo=page.locator('.v15-event-photo img');
              await photo.scrollIntoViewIfNeeded();
              assert(await photo.isVisible(),'Static event image not visible');
              assert(await photo.evaluate(el=>el.complete&&el.naturalWidth>=1000),'Image did not load');
              assert.equal(await photo.getAttribute('src'),'/assets/images/events/gelato-event-familie.webp');
              assert.equal(await page.locator('.v15-event-photo button').count(),0,'Overlay button remains');
              assert.equal(await page.locator('dialog[data-event-depth-dialog]').count(),0,'Viewer dialog remains');
              assert.equal(await page.locator('[data-event-depth-stage]').count(),0,'Swipe target remains');
              const original=await photo.evaluate(el=>({style:getComputedStyle(el).transform,src:el.currentSrc}));
              assert.equal(original.style,'none','Unexpected 3D transform');
              const photoBox=await photo.boundingBox();
              assert(photoBox&&photoBox.width>280&&photoBox.height>210,'Bad mobile image dimensions');
              await page.mouse.move(photoBox.x+photoBox.width*.4,photoBox.y+photoBox.height*.5);
              await page.mouse.down();
              await page.mouse.move(photoBox.x+photoBox.width*.65,photoBox.y+photoBox.height*.5,{steps:5});
              await page.mouse.up();
              assert.equal(await photo.evaluate(el=>getComputedStyle(el).transform),'none','Photo moved on swipe');
              assert(await page.locator('.v10-event-feature__cta').isVisible(),'CTA missing');

              await page.setViewportSize({width:320,height:700});
              await photo.scrollIntoViewIfNeeded();
              const mobile=await photo.boundingBox();
              assert(mobile&&mobile.x>=10&&mobile.x+mobile.width<=322,'320px image overflow');
              await page.setViewportSize({width:1440,height:900});
              await photo.scrollIntoViewIfNeeded();
              assert(await photo.isVisible(),'Desktop photo missing');
              assert.equal(await photo.evaluate(el=>getComputedStyle(el).transform),'none','Desktop photo transformed');
              assert.equal(errors.length,0,'Browser errors: '+errors.join('; '));
              console.log('PASS: original fixed photo, no box, no swipe/viewer, CTA, iPhone 320/390 and desktop 1440');
            } finally {await browser.close();}
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE

      - name: Replacement interior photo browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --directory "$PROJECT_PATH" >/tmp/gelato-v20-shop-photo.log 2>&1 &
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4175/',{waitUntil:'networkidle'});
              const media=page.locator('.v6-editorial--heritage .v6-editorial__media');
              const img=media.locator('img');
              await img.scrollIntoViewIfNeeded();
              assert(await img.isVisible(),'Updated shop image not visible');
              assert.equal(await img.getAttribute('src'),'/assets/images/shop/interior-original-2026.avif');
              assert(await img.evaluate(e=>e.complete&&e.naturalWidth===900&&e.naturalHeight===1200),
                'Owner-supplied interior photo did not decode');
              assert.equal((await media.locator('figcaption').innerText()).trim().toLocaleLowerCase('de-DE'),
                'Direkt aus dem Eislabor in die Vitrine.','Existing caption changed');
              for(const width of [320,390,768,1440]){
                await page.setViewportSize({width,height:900});
                await img.scrollIntoViewIfNeeded();
                const rect=await img.boundingBox();
                assert(rect&&rect.width>200&&rect.x>=-2&&rect.x+rect.width<=width+2,
                  'Photo layout overflow: '+width);
              }
              assert(!errors.length,'Browser JS error: '+errors.join('; '));
              console.log('V20 PASS: owner original photo AVIF decoded, caption and responsive frame retained');
            }finally{await browser.close();}
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE

      - name: Rental photo and 20 L mobile/desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory "$PROJECT_PATH" >/tmp/gelato-rental.log 2>&1 &
          node <<'NODE'
          const assert=require('node:assert/strict'),{chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4174/eisvitrine/',{waitUntil:'networkidle'});
              const photo=page.locator('.v17-rental-hero__visual img');
              assert(await photo.isVisible(),'Product image not visible');
              const src=await photo.getAttribute('src');
              assert(src.endsWith('/gelato-vitrine-produkt.webp'),'Wrong photo source '+src);
              assert(await photo.evaluate(img=>img.complete&&img.naturalWidth===1254&&img.naturalHeight===1254),
                'Browser did not decode 1254px crisp image (currentSrc/naturalWidth)');
              const actualSource=await photo.evaluate(img=>img.currentSrc);
              assert(actualSource.endsWith('/gelato-vitrine-produkt-hd.avif'),'Browser selected blurry fallback: '+actualSource);
              console.log('Crisp product image loaded',actualSource);
              assert(await page.locator('.v17-rental-board__specs strong').count()===4,'Four price cards missing');
              const facts=await page.locator('.v17-rental-board__specs').innerText();
              assert(/20\s*L/.test(facts)&&facts.includes('250')&&facts.includes('100')&&facts.includes('4'),'Rental facts incorrect');
              const css=await page.locator('.v17-rental-hero').evaluate(el=>getComputedStyle(el).backgroundColor);
              assert(css==='rgb(16, 15, 13)','Hero no longer black: '+css);
              await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle'});
              const homeEventBg=await page.locator('.v7-event-teaser.v10-event-feature')
                .evaluate(el=>getComputedStyle(el).backgroundImage);
              assert(homeEventBg.includes('rgb(231, 221, 206)') &&
                homeEventBg.includes('rgb(224, 212, 195)') &&
                homeEventBg.includes('rgb(216, 203, 185)'), 'V18 warm homepage gradient not applied: '+homeEventBg);
              await page.goto('http://127.0.0.1:4174/eisvitrine/',{waitUntil:'networkidle'});
              const cta=page.locator('.v17-rental-button');assert.equal(await cta.getAttribute('href'),'#vitrine-anfrage');
              const form=page.locator('#vitrine-anfrage');assert(await form.count()===1,'Request form absent');
              for(const width of [320,375,390,430,768,1024,1440]){
                await page.setViewportSize({width,height:900});
                const v=await page.evaluate(()=>{
                  let s=document.querySelector('.v17-rental-hero__inner').getBoundingClientRect();
                  let i=document.querySelector('.v17-rental-hero__visual img').getBoundingClientRect();
                  let card=document.querySelector('.v17-rental-board').getBoundingClientRect();
                  return {vw:innerWidth,scroll:document.documentElement.scrollWidth,section:[s.left,s.right],image:[i.left,i.right],card:[card.left,card.right],height:i.height};
                });
                assert(v.scroll<=width+2,'Horizontal scroll at '+width+': '+v.scroll);
                for(const key of ['section','image','card'])assert(v[key][0]>=-2&&v[key][1]<=width+2,'Overflow '+key+' at '+width);
                assert(v.height>170,'Product image too short at '+width);
              }
              assert(!errors.length,'JS errors '+errors.join('; '));
              console.log('V17 PASS: image loads, dark hero, 20 L, 250/100, CTA, all seven viewport sizes');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Confirm existing Cloudflare Access remains protected BEFORE deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I --max-time 25 "$PRIVATE_URL/" > /tmp/gelato-predeploy-access.txt
          grep -Eq '^HTTP/.* 302' /tmp/gelato-predeploy-access.txt
          tr -d '\r' < /tmp/gelato-predeploy-access.txt | grep -Eqi '^location: https://[^ ]*cloudflareaccess\.com/'

      - name: Private Worker dry run only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npx --yes wrangler@4 deploy "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --name "$WORKER" --compatibility-date 2026-10-07 \
            --keep-vars --dry-run --message "Gelato Donatello private V20 a8c86cfc7b"

      - name: Publish only to existing Access-protected private Worker
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npx --yes wrangler@4 deploy "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --name "$WORKER" --compatibility-date 2026-10-07 \
            --keep-vars --message "Gelato Donatello private V20 a8c86cfc7b"

      - name: Verify Cloudflare Access gate
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I --max-time 25 "$PRIVATE_URL/" > /tmp/gelato-access-headers.txt
          grep -Eq '^HTTP/.* 302' /tmp/gelato-access-headers.txt
          tr -d '\r' < /tmp/gelato-access-headers.txt | grep -Eqi '^location: https://[^ ]*cloudflareaccess\.com/'
          {
            echo "### Gelato Donatello PRIVATE V20"
            echo "Preview: $PRIVATE_URL"
            echo "Source SHA: $EXPECTED_SHA"
            echo "Public deploy: false"
            echo "DNS changes: false"
          } >> "$GITHUB_STEP_SUMMARY"
