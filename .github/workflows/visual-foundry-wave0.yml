name: Visual Foundry Wave 0
# render determinism gate: decoded RGBA
# approved-reference lifecycle recheck

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-wave0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check src/visual-foundry/baseline.js
      - run: node --check scripts/visual-foundry-wave0.mjs
      - run: node scripts/visual-foundry-wave0-smoke.mjs
      - run: node --check src/visual-foundry/reference-registry.js
      - run: node scripts/visual-foundry-wave1-smoke.mjs
      - run: node --check src/visual-foundry/reference-spec.js
      - run: node scripts/visual-foundry-wave2-smoke.mjs
      - run: node --check src/visual-foundry/render-lab.js
      - run: node scripts/visual-foundry-wave3-smoke.mjs
      - run: node --check src/visual-foundry/dom-measurement.js
      - run: node scripts/visual-foundry-wave4-smoke.mjs
      - run: node --check src/visual-foundry/visual-comparator.js
      - run: node scripts/visual-foundry-wave5-smoke.mjs
      - run: node --check src/visual-foundry/visual-delta.js
      - run: node scripts/visual-foundry-wave6-smoke.mjs
      - run: node --check src/visual-foundry/visual-acceptance.js
      - run: node scripts/visual-foundry-wave7-smoke.mjs
      - run: node --check src/visual-foundry/fixture-mode.js
      - run: node scripts/visual-foundry-wave8-smoke.mjs
      - run: node --check src/visual-foundry/runtime-binding.js
      - run: node scripts/visual-foundry-wave9-smoke.mjs
      - run: node --check src/visual-foundry/semantic-review.js
      - run: node scripts/visual-foundry-wave10-smoke.mjs
      - run: node --check src/visual-foundry/model-router.js
      - run: node scripts/visual-foundry-wave11-smoke.mjs
      - run: node --check src/visual-foundry/delta-closer.js
      - run: node --check scripts/qa-repair-loop.mjs
      - run: node scripts/visual-foundry-wave12-smoke.mjs
      - run: node --check src/visual-foundry/responsive-engine.js
      - run: node scripts/visual-foundry-wave13-smoke.mjs
      - run: node --check src/visual-foundry/asset-ledger.js
      - run: node scripts/visual-foundry-wave14-smoke.mjs
      - run: node --check src/visual-foundry/typography-contract.js
      - run: node scripts/visual-foundry-wave15-smoke.mjs
      - run: node --check src/visual-foundry/golden-regression.js
      - run: node scripts/visual-foundry-wave16-smoke.mjs
      - run: node --check src/visual-foundry/evidence-pack.js
      - run: node scripts/visual-foundry-wave17-smoke.mjs
      - run: node --check src/visual-foundry/cost-architecture.js
      - run: node --check src/visual-foundry/delta-closer.js
      - run: node scripts/visual-foundry-wave18-smoke.mjs
      - run: node --check src/visual-foundry/benchmark-harness.js
      - run: node scripts/visual-foundry-wave19-smoke.mjs
      - run: node --check scripts/visual-foundry-core-acceptance.mjs
      - run: node scripts/qa-repair-policy-smoke.mjs
      - run: node scripts/factory-observability-smoke.mjs
      - run: node scripts/visual-foundry-core-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-foundry-wave0-evidence
          path: |
            artifacts/visual-foundry/wave0-smoke
            artifacts/visual-foundry/wave1
            artifacts/visual-foundry/wave2
            artifacts/visual-foundry/wave3
            artifacts/visual-foundry/wave4
            artifacts/visual-foundry/wave5
            artifacts/visual-foundry/wave6
            artifacts/visual-foundry/wave7
            artifacts/visual-foundry/wave8
            artifacts/visual-foundry/wave9
            artifacts/visual-foundry/wave10
            artifacts/visual-foundry/wave11
            artifacts/visual-foundry/wave12
            artifacts/visual-foundry/wave13
            artifacts/visual-foundry/wave14
            artifacts/visual-foundry/wave15
            artifacts/visual-foundry/wave16
            artifacts/visual-foundry/wave17
            artifacts/visual-foundry/wave18
            artifacts/visual-foundry/wave19
            artifacts/visual-foundry/core-acceptance
          if-no-files-found: error


  gold-standard-registration:
    needs: wave0
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node scripts/visual-foundry-aurentara-reference-registration-smoke.mjs

  gold-standard-isolated-run:
    needs: gold-standard-registration
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: ${{ matrix.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-gold-standard-run-${{ matrix.run_number }}
          path: artifacts/visual-foundry/gold-standard/run-${{ matrix.run_number }}
          if-no-files-found: error
