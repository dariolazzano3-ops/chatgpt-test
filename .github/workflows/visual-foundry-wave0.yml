name: Visual Foundry Wave 0

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - 'src/visual-foundry/**'
      - 'scripts/visual-foundry-wave0*'
      - '.github/workflows/visual-foundry-wave0.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check src/visual-foundry/baseline.js
      - run: node --check scripts/visual-foundry-wave0.mjs
      - run: node scripts/visual-foundry-wave0-smoke.mjs
      - run: node --check src/visual-foundry/reference-registry.js
      - run: node scripts/visual-foundry-wave1-smoke.mjs
      - run: node --check src/visual-foundry/reference-spec.js
      - run: node scripts/visual-foundry-wave2-smoke.mjs
      - run: node --check src/visual-foundry/render-lab.js
      - run: node scripts/visual-foundry-wave3-smoke.mjs
      - run: node --check src/visual-foundry/dom-measurement.js
      - run: node scripts/visual-foundry-wave4-smoke.mjs
      - run: node --check src/visual-foundry/visual-comparator.js
      - run: node scripts/visual-foundry-wave5-smoke.mjs
      - run: node --check src/visual-foundry/visual-delta.js
      - run: node scripts/visual-foundry-wave6-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-foundry-wave0-evidence
          path: |
            artifacts/visual-foundry/wave0-smoke
            artifacts/visual-foundry/wave1
            artifacts/visual-foundry/wave2
            artifacts/visual-foundry/wave3
            artifacts/visual-foundry/wave4
            artifacts/visual-foundry/wave5
            artifacts/visual-foundry/wave6
          if-no-files-found: error
