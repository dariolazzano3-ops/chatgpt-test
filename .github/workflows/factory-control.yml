name: Factory Control

on:
  push:
    branches:
      - factory-control
    paths:
      - 'factory-requests/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Factory request JSON path on factory-control'
        required: true
        type: string

concurrency:
  group: factory-control-serial
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

jobs:
  run-factory-request:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: chatgpt-factory-preview
    steps:
      - name: Checkout control request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'factory-control' || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Stage Factory runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-runtime
          cp scripts/visual-qa.mjs .factory-runtime/visual-qa.mjs
          cp scripts/cost-guard.mjs .factory-runtime/cost-guard.mjs
          cp scripts/promote-active-project.mjs .factory-runtime/promote-active-project.mjs
          cp scripts/request-idempotency.mjs .factory-runtime/request-idempotency.mjs

      - name: Resolve request file
        id: request
        shell: bash
        env:
          DISPATCH_FILE: ${{ github.event.inputs.request_file || '' }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_FILE" ]; then
            REQUEST_FILE="$DISPATCH_FILE"
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^factory-requests/[^/]+\.json$' | head -n 1 || true)
          fi
          test -n "$REQUEST_FILE" || { echo "No Factory request JSON found"; exit 1; }
          test -f "$REQUEST_FILE" || { echo "Factory request file not found: $REQUEST_FILE"; exit 1; }
          case "$REQUEST_FILE" in factory-requests/*.json) ;; *) echo "Unsafe request path"; exit 1 ;; esac
          cp "$REQUEST_FILE" .factory-runtime/request.json
          echo "file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Refresh serialized control state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin factory-control
          git checkout origin/factory-control -- factory-state/active-project.json
          if git cat-file -e origin/factory-control:factory-state/request-ledger.json 2>/dev/null; then
            git checkout origin/factory-control -- factory-state/request-ledger.json
          fi
          test -f factory-state/active-project.json
          test -f .factory-runtime/request.json

      - name: Check request idempotency
        id: idempotency
        shell: bash
        run: node .factory-runtime/request-idempotency.mjs check .factory-runtime/request.json factory-state/request-ledger.json

      - name: Publish duplicate request result
        if: steps.idempotency.outputs.duplicate == 'true'
        shell: bash
        env:
          REQUEST_KEY: ${{ steps.idempotency.outputs.request_key }}
          PREVIEW_URL: ${{ steps.idempotency.outputs.existing_preview_url }}
          PROJECT_PATH: ${{ steps.idempotency.outputs.existing_project_path }}
          SOURCE_BRANCH: ${{ steps.idempotency.outputs.existing_branch }}
          PR_URL: ${{ steps.idempotency.outputs.existing_pr_url }}
        run: |
          set -euo pipefail
          echo "### Factory Control Duplicate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Request key: $REQUEST_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: prior successful execution reused" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $PROJECT_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- New branch/PR/deploy: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: not deployed" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute Factory request
        if: steps.idempotency.outputs.duplicate != 'true'
        id: factory
        run: node scripts/factory-control.mjs '${{ steps.request.outputs.file }}'

      - name: Restore event worktree before project checkout
        if: steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- factory-state/active-project.json
          if git cat-file -e HEAD:factory-state/request-ledger.json 2>/dev/null; then
            git restore --source=HEAD --staged --worktree -- factory-state/request-ledger.json
          else
            git rm --cached --ignore-unmatch factory-state/request-ledger.json >/dev/null 2>&1 || true
            rm -f factory-state/request-ledger.json
          fi
          test -f .factory-runtime/request.json

      - name: Checkout generated project branch
        if: steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.factory.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          test -f .factory-runtime/visual-qa.mjs
          test -f .factory-runtime/cost-guard.mjs
          test -f .factory-runtime/promote-active-project.mjs
          test -f .factory-runtime/request-idempotency.mjs
          test -f .factory-runtime/request.json

      - name: Validate generated project
        if: steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
        run: |
          set -euo pipefail
          case "$PROJECT_PATH" in projects/*) ;; *) echo "Unsafe project path: $PROJECT_PATH"; exit 1 ;; esac
          test -f "$PROJECT_PATH/index.html"
          test -f "$PROJECT_PATH/project.json"
          test -f "$PROJECT_PATH/styles.css"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$PROJECT_PATH/project.json"
          npm run check

      - name: Cost and usage guard
        if: steps.idempotency.outputs.duplicate != 'true'
        id: cost
        env:
          QA_ONLY: ${{ steps.factory.outputs.qa_only }}
        run: node .factory-runtime/cost-guard.mjs "$(git rev-parse HEAD)" .factory-runtime/visual-qa.mjs

      - name: Validate preview configuration
        if: steps.idempotency.outputs.duplicate != 'true' && steps.cost.outputs.duplicate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy automatic preview
        if: steps.idempotency.outputs.duplicate != 'true' && steps.cost.outputs.duplicate != 'true'
        id: preview
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
          SOURCE_BRANCH: ${{ steps.factory.outputs.branch }}
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH"
          cd /tmp
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main || true
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy "$SOURCE_DIR" --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$SOURCE_BRANCH" 2>&1 | tee /dev/stderr)
          PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Deployment alias URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1); fi
          test -n "$PREVIEW_URL" || { echo "Could not resolve preview URL"; exit 1; }
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Install Visual QA browser
        if: steps.idempotency.outputs.duplicate != 'true' && steps.cost.outputs.duplicate != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Visual QA
        if: steps.idempotency.outputs.duplicate != 'true' && steps.cost.outputs.duplicate != 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node .factory-runtime/visual-qa.mjs "$PREVIEW_URL" visual-qa

      - name: Upload Visual QA evidence
        if: always() && steps.idempotency.outputs.duplicate != 'true' && steps.cost.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Factory failure
        if: failure() && steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.request.outputs.file || 'unresolved' }}
        run: |
          echo "### Factory Control Failure" >> "$GITHUB_STEP_SUMMARY"
          echo "- Request: \`$REQUEST_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Active project promotion: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery: submit a corrected request; the previous active project remains unchanged" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote successful project to active state
        if: steps.idempotency.outputs.duplicate != 'true' && steps.factory.outputs.qa_only != 'true'
        env:
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
          SOURCE_BRANCH: ${{ steps.factory.outputs.branch }}
          PR_URL: ${{ steps.factory.outputs.pr_url }}
          PREVIEW_URL: ${{ steps.preview.outputs.url || steps.cost.outputs.existing_url }}
        run: node .factory-runtime/promote-active-project.mjs "$PROJECT_PATH" "$SOURCE_BRANCH" "$PR_URL" "$PREVIEW_URL"

      - name: Record successful request
        if: steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        env:
          REQUEST_KEY: ${{ steps.idempotency.outputs.request_key }}
          MODE: ${{ steps.factory.outputs.qa_only == 'true' && 'qa' || 'project' }}
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
          SOURCE_BRANCH: ${{ steps.factory.outputs.branch }}
          PR_URL: ${{ steps.factory.outputs.pr_url }}
          PREVIEW_URL: ${{ steps.preview.outputs.url || steps.cost.outputs.existing_url }}
          QA_ONLY: ${{ steps.factory.outputs.qa_only }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL" || { echo "Preview URL missing before idempotency record"; exit 1; }
          META=$(mktemp)
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({mode:process.env.MODE,project_path:process.env.PROJECT_PATH,branch:process.env.SOURCE_BRANCH,pr_url:process.env.PR_URL,preview_url:process.env.PREVIEW_URL,qa_only:process.env.QA_ONLY==="true"},null,2))' "$META"
          rm -rf /tmp/factory-control-ledger
          git fetch origin factory-control
          git worktree add --detach /tmp/factory-control-ledger origin/factory-control
          node .factory-runtime/request-idempotency.mjs record .factory-runtime/request.json /tmp/factory-control-ledger/factory-state/request-ledger.json "$META"
          cd /tmp/factory-control-ledger
          git config user.name "factory-control[bot]"
          git config user.email "factory-control[bot]@users.noreply.github.com"
          git add factory-state/request-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Factory: record successful request $REQUEST_KEY"
          git push origin HEAD:factory-control

      - name: Publish Factory result
        if: steps.idempotency.outputs.duplicate != 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url || steps.cost.outputs.existing_url }}
          PR_URL: ${{ steps.factory.outputs.pr_url }}
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
          QA_CONTEXT: ${{ steps.cost.outputs.qa_context }}
          QA_DUPLICATE: ${{ steps.cost.outputs.duplicate }}
          MONTHLY_RUNS: ${{ steps.cost.outputs.monthly_runs }}
          USAGE_LEVEL: ${{ steps.cost.outputs.usage_level }}
          REQUEST_KEY: ${{ steps.idempotency.outputs.request_key }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          test -n "$PREVIEW_URL" || { echo "Preview URL missing"; exit 1; }
          if [ "$QA_DUPLICATE" = "true" ]; then
            DESCRIPTION='Factory QA reused prior matching success; no new preview deploy'
          else
            DESCRIPTION='Factory project validated, visually checked and preview deployed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context='factory-control/preview' -f description="$DESCRIPTION" -f target_url="$PREVIEW_URL" >/dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context="$QA_CONTEXT" -f description='Visual QA passed for this QA runtime version' -f target_url="$PREVIEW_URL" >/dev/null
          if [ -n "$PR_URL" ]; then gh pr comment "$PR_URL" --body "✅ Factory Control V3 completed successfully.\n\n- Project: \`$PROJECT_PATH\`\n- Preview: $PREVIEW_URL\n- Visual QA: passed\n- Request key: \`$REQUEST_KEY\`\n- QA cache reused: $QA_DUPLICATE\n- Factory Control runs this month: $MONTHLY_RUNS ($USAGE_LEVEL)\n- Production: not deployed"; fi
          echo "### Factory Control Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Request key: $REQUEST_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visual QA: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- QA cache reused: $QA_DUPLICATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Factory Control runs this month: $MONTHLY_RUNS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Usage level: $USAGE_LEVEL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: not deployed" >> "$GITHUB_STEP_SUMMARY"
