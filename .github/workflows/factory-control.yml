name: Factory Control

on:
  push:
    branches:
      - factory-control
    paths:
      - 'factory-requests/*.json'

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  run-factory-request:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: chatgpt-factory-preview
    steps:
      - name: Checkout control request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Stage Visual QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-runtime
          cp scripts/visual-qa.mjs .factory-runtime/visual-qa.mjs

      - name: Resolve request file
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^factory-requests/[^/]+\.json$' | head -n 1 || true)
          test -n "$REQUEST_FILE" || { echo "No Factory request JSON found in latest commit"; exit 1; }
          echo "file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Execute Factory request
        id: factory
        run: node scripts/factory-control.mjs '${{ steps.request.outputs.file }}'

      - name: Checkout generated project branch
        shell: bash
        env:
          BRANCH: ${{ steps.factory.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          test -f .factory-runtime/visual-qa.mjs

      - name: Validate generated project
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
        run: |
          set -euo pipefail
          case "$PROJECT_PATH" in
            projects/*) ;;
            *) echo "Unsafe project path: $PROJECT_PATH"; exit 1 ;;
          esac
          test -f "$PROJECT_PATH/index.html"
          test -f "$PROJECT_PATH/project.json"
          test -f "$PROJECT_PATH/styles.css"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$PROJECT_PATH/project.json"
          npm run check

      - name: Validate preview configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy automatic preview
        id: preview
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
          SOURCE_BRANCH: ${{ steps.factory.outputs.branch }}
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/$PROJECT_PATH"
          cd /tmp
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main || true
          DEPLOY_OUTPUT=$(npx --yes wrangler@4 pages deploy "$SOURCE_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$SOURCE_BRANCH" 2>&1 | tee /dev/stderr)
          PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Deployment alias URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/.*Take a peek over at \(https:\/\/[^ ]*\).*/\1/p' | tail -n 1)
          fi
          test -n "$PREVIEW_URL" || { echo "Could not resolve preview URL"; exit 1; }
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Install Visual QA browser
        run: npx playwright install --with-deps chromium

      - name: Run Visual QA
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node .factory-runtime/visual-qa.mjs "$PREVIEW_URL" visual-qa

      - name: Upload Visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Factory result
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_URL: ${{ steps.factory.outputs.pr_url }}
          PROJECT_PATH: ${{ steps.factory.outputs.project_path }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='factory-control/preview' \
            -f description='Factory project validated, visually checked and preview deployed' \
            -f target_url="$PREVIEW_URL" >/dev/null

          if [ -n "$PR_URL" ]; then
            gh pr comment "$PR_URL" --body "✅ Factory Control V3 completed successfully.\n\n- Project: \`$PROJECT_PATH\`\n- Preview: $PREVIEW_URL\n- Visual QA: passed (desktop + mobile evidence attached to the workflow run)\n- Production: not deployed\n\nThe generated branch was validated before preview deployment."
          fi

          echo "### Factory Control Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visual QA: passed (desktop + mobile)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: factory-control/preview = success" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: not deployed" >> "$GITHUB_STEP_SUMMARY"
