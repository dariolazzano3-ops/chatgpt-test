name: LEAN V4.6

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/mission-execution-router.js'
      - 'scripts/mission-execution-router-smoke.mjs'
      - 'factory-state/runtime.json'
      - '.github/workflows/lean-v46.yml'

jobs:
  validate-v46:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check src/mission-execution-router.js
          node --check scripts/mission-execution-router-smoke.mjs
      - name: Unified mission router smoke
        run: node scripts/mission-execution-router-smoke.mjs
      - name: Runtime metadata
        run: |
          node -e "const r=require('./factory-state/runtime.json'); if(r.factory_version!=='4.6'||r.production_deploy!==false||r.capabilities.unified_mission_execution_router!==true||r.capabilities.web_automation_mission_routing!==true||r.capabilities.automatic_multi_factory_execution!==false) process.exit(1)"
