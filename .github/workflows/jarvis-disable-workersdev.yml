name: JARVIS Disable Legacy workers.dev Host

on:
  push:
    branches:
      - 'factory/jarvis-personal-assistant-v1'
    paths:
      - '.github/jarvis-disable-workersdev-request.json'
      - '.github/workflows/jarvis-disable-workersdev.yml'

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: jarvis-private-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authorize scoped removal
        run: |
          set -euo pipefail
          REQUEST=".github/jarvis-disable-workersdev-request.json"
          test -f "$REQUEST"
          node - "$REQUEST" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ok =
            r.schema === 'jarvis-disable-workersdev-request-v1' &&
            r.worker === 'jarvis-private-staging' &&
            r.confirmation === 'DISABLE_JARVIS_LEGACY_WORKERS_DEV' &&
            r.production_deploy === false &&
            r.account_subdomain_rename === false &&
            r.aurentara_routes_modified === false;
          if(!ok) process.exit(1);
          NODE

      - name: Disable JARVIS workers.dev route only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"enabled":false,"previews_enabled":false}'             > /tmp/jarvis-subdomain-disable.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/jarvis-subdomain-disable.json','utf8'));
          if(body.success!==true) process.exit(1);
          NODE

      - name: Verify JARVIS workers.dev disabled
        run: |
          set -euo pipefail
          curl -fsS             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             > /tmp/jarvis-subdomain-status.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/jarvis-subdomain-status.json','utf8'));
          if(body.success!==true) process.exit(1);
          if(body.result?.enabled !== false) process.exit(2);
          if(body.result?.previews_enabled !== false) process.exit(3);
          console.log(JSON.stringify({
            ok:true,
            worker:'jarvis-private-staging',
            workers_dev_enabled:false,
            previews_enabled:false,
            account_subdomain_rename:false,
            aurentara_routes_modified:false,
            production_deploy:false
          },null,2));
          NODE
