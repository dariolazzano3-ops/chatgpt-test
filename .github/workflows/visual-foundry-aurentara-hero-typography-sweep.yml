name: Visual Foundry AURENTARA Hero Typography Sweep

on:
  push:
    branches:
      - factory/visual-foundry-v1
    paths:
      - '.github/workflows/visual-foundry-aurentara-hero-typography-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-typography:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: T1
            scale_x: 1.28
            letter_spacing: 6.5
            weight: 500
          - id: T2
            scale_x: 1.30
            letter_spacing: 6.0
            weight: 500
          - id: T3
            scale_x: 1.32
            letter_spacing: 5.5
            weight: 500
          - id: T4
            scale_x: 1.34
            letter_spacing: 5.0
            weight: 500
          - id: T5
            scale_x: 1.32
            letter_spacing: 5.5
            weight: 600
          - id: T6
            scale_x: 1.34
            letter_spacing: 5.0
            weight: 600
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOLD_STANDARD_RUN: 1
      VISUAL_FOUNDRY_HERO_TYPOGRAPHY_CANDIDATE: ${{ matrix.id }}
      VISUAL_FOUNDRY_HERO_TITLE_SCALE_X: ${{ matrix.scale_x }}
      VISUAL_FOUNDRY_HERO_TITLE_LETTER_SPACING_PX: ${{ matrix.letter_spacing }}
      VISUAL_FOUNDRY_HERO_TITLE_WEIGHT: ${{ matrix.weight }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/visual-foundry-gold-standard-isolated-run.mjs
      - run: node scripts/visual-foundry-gold-standard-isolated-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurentara-hero-typography-${{ matrix.id }}
          path: artifacts/visual-foundry/gold-standard/run-1
          if-no-files-found: error
