name: RIOSYSTEMS Business Staging Write Plan

on:
  pull_request:
    paths:
      - 'src/business-staging-write-plan.js'
      - 'src/provider-stack-v1.js'
      - 'src/command-center.js'
      - 'scripts/business-staging-write-plan-smoke.mjs'
      - 'scripts/provider-stack-v1-smoke.mjs'
      - 'scripts/phase5-command-center-smoke.mjs'
      - 'docs/RIOSYSTEMS-BUSINESS-STAGING-ACTIVATION.md'
      - '.github/workflows/riosystems-business-staging-write-plan.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/business-staging-write-plan.js
          node --check src/provider-stack-v1.js
          node --check src/command-center.js
          node --check scripts/business-staging-write-plan-smoke.mjs
          node --check scripts/provider-stack-v1-smoke.mjs
          node --check scripts/phase5-command-center-smoke.mjs
      - name: Business staging write plan smoke
        run: node scripts/business-staging-write-plan-smoke.mjs
      - name: Provider stack regression
        run: node scripts/provider-stack-v1-smoke.mjs
      - name: Command center regression
        run: node scripts/phase5-command-center-smoke.mjs
      - name: Existing business regressions
        run: |
          node scripts/business-provider-selection-smoke.mjs
          node scripts/business-factory-smoke.mjs
          node scripts/business-mission-bridge-smoke.mjs
      - name: Safety regressions
        run: |
          node scripts/real-provider-bridge-smoke.mjs
          node scripts/mission-safety-smoke.mjs
