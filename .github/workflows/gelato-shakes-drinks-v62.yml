name: Gelato V62 Shakes & Drinks private preview
on:
  push:
    branches: [aurentara/gelato-shakes-drinks-v62]
    paths: [.github/workflows/gelato-shakes-drinks-v62.yml]
permissions:
  contents: read
concurrency:
  group: gelato-shakes-drinks-private-v62
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact image classification, links, scope and accessibility
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aurentara/gelato-shakes-drinks-v62"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('projects/gelato-donatello-premium-v6')
          home=(root/'index.html').read_text()
          cups=(root/'eisbecher/index.html').read_text()
          drinks=(root/'getraenke/index.html').read_text()
          card=(root/'assets/js/components/discovery-drinks.js').read_text()
          cupjs=(root/'assets/js/components/discovery-cups.js').read_text()
          nav=(root/'assets/js/components/nav.js').read_text()
          app=(root/'assets/js/app.js').read_text()
          css=(root/'assets/css/style.css').read_text()
          cfg=json.loads(Path('wrangler.gelato-private-preview.jsonc').read_text())
          assert cfg['name']=='gelato-donatello-private-preview-v2'
          assert cfg['assets']['run_worker_first'] is False
          assert 'X-Robots-Tag: noindex' in (root/'_headers').read_text()
          assert home.count('data-discovery-drinks')==1 and home.count('data-drink-layer=')==2
          assert 'Shakes <span>&amp; Drinks</span>' in home
          assert 'Orange Flip' in home and 'Shakes & Drinks' in nav
          assert 'initDiscoveryDrinks();' in app
          assert 'const TICK_MS = 2000' in card and 'prefers-reduced-motion' in card
          assert 'v62-drink-frame' in css and 'v27-gelato-heartbeat' in css
          paths=re.findall(r'src: "(/assets/images/drinks/[^"]+)"',card)
          assert len(paths)==6 and len(set(paths))==6
          for path in paths: assert (root/path.lstrip('/')).is_file(),path
          assert 'orange-flip.webp' in drinks and 'Orange Flip' in drinks
          assert 'Sechs Genussmomente' in drinks
          assert 'Orange Flip' not in cupjs and 'Orange Flip' not in cups
          assert 'orange-flip-becher.webp' not in home+cupjs+cups+drinks
          assert not (root/'assets/images/cups/orange-flip-becher.webp').exists()
          assert (root/'assets/images/drinks/orange-flip.webp').stat().st_size>100000
          assert len(re.findall(r'src: "/assets/images/cups/',cupjs))==31
          assert drinks.count('v29-drinks-catalog__card')==6
          print('PASS: Orange Flip exclusively under Drinks, 6 drinks, 31 cups, 2s pulse, noindex, private scope')
          PY
      - name: Responsive browser and animation QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python3 -m http.server 43119 --bind 127.0.0.1 --directory projects/gelato-donatello-premium-v6 >/tmp/gd-v62-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npm install --prefix /tmp/gd-v62-browser --no-save --no-package-lock --no-audit --no-fund --silent playwright@1.56.1
          node <<'JS'
          const assert=require('assert');
          const {chromium}=require('/tmp/gd-v62-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const [label,width,height] of [['iphone',390,844],['desktop',1440,900]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded',timeout:30000});
              const card=page.locator('[data-discovery-drinks]');
              await card.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>{
                const i=document.querySelector('[data-discovery-drinks] img.is-active');
                return i?.complete&&i.naturalWidth>0;
              });
              assert((await card.locator('img.is-active').getAttribute('src')).includes('erdbeer-shake.webp'));
              let last=Date.now();
              for(const filename of ['vanille-shake.webp','schoko-shake.webp','orange-flip.webp']){
                await page.waitForFunction(filename=>document.querySelector('[data-discovery-drinks] img.is-active')?.src.includes(filename),filename,{timeout:7000});
                const elapsed=Date.now()-last;last=Date.now();
                assert(elapsed>900&&elapsed<5400,filename+' transition timing '+elapsed);
                console.log(label,filename,'switch ms:',elapsed);
              }
              const state=await card.evaluate(el=>{
                const rect=el.getBoundingClientRect(),title=el.querySelector('.v26-discovery__card-copy strong');
                const span=title.querySelector('span');
                const s=span.getBoundingClientRect();
                const imgs=[...el.querySelectorAll('.v62-drink-frame')].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0}));
                return {width:rect.width,titleRight:Math.round(s.right-rect.left),cardWidth:Math.round(rect.width),anim:getComputedStyle(el.querySelector('img.is-active')).animationName,images:imgs,allText:el.innerText};
              });
              assert(state.anim.includes('v27-gelato-heartbeat'),JSON.stringify(state));
              assert(state.images.every(i=>i.loaded),JSON.stringify(state));
              assert(state.titleRight<=state.cardWidth+2,'Title clipped outside card '+JSON.stringify(state));
              const overflow=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,inner:window.innerWidth}));
              assert(overflow.scroll<=overflow.inner+3,'Horizontal overflow '+JSON.stringify(overflow));
              await card.screenshot({path:'visual-evidence/home-drinks-'+label+'.png',animations:'disabled'});
              await page.goto('http://127.0.0.1:43119/getraenke/',{waitUntil:'domcontentloaded'});
              const drinkPage=await page.locator('#getraenke-auswahl').innerText();
              assert(drinkPage.includes('Orange Flip')&&drinkPage.includes('Eisschokolade'));
              await page.locator('.v29-drinks-catalog').screenshot({path:'visual-evidence/catalog-drinks-'+label+'.png',animations:'disabled'});
              await page.goto('http://127.0.0.1:43119/eisbecher/',{waitUntil:'domcontentloaded'});
              assert(!(await page.locator('main').innerText()).includes('Orange Flip'));
              assert.deepStrictEqual(errors,[],'Page JS errors');
              console.log('PASS',label,'Shakes & Drinks 6-photo rotation, layout, drink gallery, no Orange Flip in Eisbecher');
              await page.close();
            }
            const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await page.goto('http://127.0.0.1:43119/',{waitUntil:'domcontentloaded'});
            const card=page.locator('[data-discovery-drinks]');await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(2400);
            assert((await card.locator('img.is-active').getAttribute('src')).includes('erdbeer-shake.webp'));
            console.log('PASS reduced-motion static');
            await page.close();await browser.close();
          })().catch(e=>{console.error('BROWSER QA FAILURE',e);process.exit(1)});
          JS
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gelato-v62-responsive-qa
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm private worker access
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments")
          test "$status" = "200"
      - name: Deploy ONLY private Gelato preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 deploy --config wrangler.gelato-private-preview.jsonc
      - name: Verify Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gelato-donatello-private-preview-v2/deployments" -o /tmp/gelato-v62-deploy.json
          node -e "const r=require('/tmp/gelato-v62-deploy.json');const d=r.result?.deployments?.[0];if(!r.success||!d?.versions?.some(v=>v.percentage===100))process.exit(2);console.log('PRIVATE GELATO DEPLOY PASS',d.id)"
