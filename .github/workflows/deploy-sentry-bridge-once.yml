name: Deploy Sentry Bridge Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sentry-bridge-once.yml'

concurrency:
  group: deploy-sentry-bridge-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_BASE_URL: https://chatgpt-test.gelato-donatello-dario-a5a5376c.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate before deploy
        run: |
          set -euo pipefail
          npm run check
          npx wrangler deploy --dry-run

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars

      - name: Verify deployment and Sentry secret presence
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS "$WORKER_BASE_URL/factory/diagnostics" -o /tmp/diagnostics.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/diagnostics.json','utf8'));
          if (body?.ok !== true) throw new Error('FACTORY_DIAGNOSTICS_NOT_HEALTHY');
          if (body?.secrets?.sentry_auth_token_configured !== true) throw new Error('SENTRY_AUTH_TOKEN_NOT_PRESENT_AFTER_DEPLOY');
          if (body?.secrets?.secret_values_exposed !== false) throw new Error('SECRET_EXPOSURE_GUARD_FAILED');
          console.log('Factory diagnostics healthy; SENTRY_AUTH_TOKEN is configured; secret values are not exposed.');
          NODE

          status=$(curl -sS -o /tmp/sentry-unauthorized.json -w '%{http_code}' "$WORKER_BASE_URL/factory/diagnostics/sentry")
          test "$status" = "401" || { echo "Expected 401 from protected Sentry route, got $status"; cat /tmp/sentry-unauthorized.json; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/sentry-unauthorized.json','utf8'));
          if (body?.error !== 'UNAUTHORIZED') throw new Error('SENTRY_ROUTE_AUTH_GUARD_FAILED');
          console.log('Protected Sentry route is live and rejects unauthenticated requests.');
          NODE
