name: RIOSYSTEMS Operator Control Plane V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/operator-control-plane-v1.js'
      - 'src/operator-dashboard-v1.js'
      - 'scripts/operator-control-plane-v1-smoke.mjs'
      - 'docs/RIOSYSTEMS-OPERATOR-CONTROL-PLANE-V1.md'
      - '.github/workflows/riosystems-operator-control-plane-v1.yml'
      - 'src/command-center.js'
      - 'src/provider-stack-v1.js'
      - 'src/mission-delivery-aggregator.js'
      - 'src/bakery-muller-live-e2e-evidence.js'
      - 'src/growth-v1/contracts.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/operator-control-plane-v1.js
          node --check src/operator-dashboard-v1.js
          node --check scripts/operator-control-plane-v1-smoke.mjs
      - name: Operator control plane acceptance
        run: node scripts/operator-control-plane-v1-smoke.mjs
      - name: Command Center regression
        run: node scripts/phase5-command-center-smoke.mjs
      - name: Mission delivery regression
        run: node scripts/mission-delivery-aggregator-smoke.mjs
      - name: Provider Stack regression
        run: node scripts/provider-stack-v1-smoke.mjs
      - name: Block 6 live E2E evidence regression
        run: node scripts/bakery-muller-live-e2e-evidence-smoke.mjs
      - name: Growth Factory regression
        run: node scripts/growth-gtm-factory-v1-smoke.mjs
