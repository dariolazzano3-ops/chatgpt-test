name: HAMYREN Public Customer Surface Readiness V1

on:
  pull_request:
    branches: [factory-control]
    paths:
      - 'src/customer-product/**'
      - 'scripts/hamyren-public-customer-surface-readiness-v1-smoke.mjs'
      - 'scripts/hamyren-legal-privacy-technical-readiness-v1-smoke.mjs'
      - 'scripts/aurentara-customer-product-surface-v1-smoke.mjs'
      - 'scripts/aurentara-customer-red-team-v1-smoke.mjs'
      - 'docs/HAMYREN_PUBLIC_CUSTOMER_SURFACE_READINESS_V1.md'
      - '.github/workflows/hamyren-public-customer-surface-readiness-v1.yml'

jobs:
  public-customer-surface-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/customer-product/shell-v1.js
          node --check src/customer-product/production-account-surface-v1.js
          node --check src/customer-product/hamyren-public-surface-readiness-v1.js
          node --check scripts/hamyren-public-customer-surface-readiness-v1-smoke.mjs
      - name: HAMYREN public surface readiness
        run: node scripts/hamyren-public-customer-surface-readiness-v1-smoke.mjs
      - name: Legal privacy technical readiness regression
        run: node scripts/hamyren-legal-privacy-technical-readiness-v1-smoke.mjs
      - name: Existing customer surface regression
        run: node scripts/aurentara-customer-product-surface-v1-smoke.mjs
      - name: Customer red team regression
        run: node scripts/aurentara-customer-red-team-v1-smoke.mjs
